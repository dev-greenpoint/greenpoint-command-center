<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overview — Greenpoint</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 6px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
    }
    .stat-value.accent { color: var(--accent); }
    .stat-value.warning { color: var(--warning); }
    .progress-bar {
      height: 4px;
      background: var(--surface-2);
      border-radius: 2px;
      margin: 6px 0 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
    }
    .client-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      text-decoration: none;
      color: var(--text);
    }
    .client-row:last-child { border-bottom: none; }
    .client-row:hover { color: var(--accent); }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .overview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 900px) {
      .overview-grid { grid-template-columns: 1fr; }
    }
    .tag {
      display: inline-block;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 11px;
      padding: 2px 7px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content" id="page-content">
        <p style="color:var(--text-muted);">Loading…</p>
      </main>
    </div>
  </div>

  <script src="/components/shell.js"></script>
  <script>
    renderShell({ pageId: 'overview', title: 'Overview' });

    async function load() {
      const res = await fetch('/api/overview');
      const { stats, activeProgress, onboardingProgress, workload } = await res.json();

      document.getElementById('page-content').innerHTML = `

        <!-- Stats -->
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">Active Clients</div>
            <div class="stat-value accent">${stats.activeClients}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Onboarding</div>
            <div class="stat-value warning">${stats.onboardingClients}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Tasks To Do</div>
            <div class="stat-value">${stats.tasksTodo}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">In Progress</div>
            <div class="stat-value">${stats.tasksInProgress}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Tasks Done</div>
            <div class="stat-value">${stats.tasksDone}</div>
          </div>
        </div>

        <div class="overview-grid">

          <!-- Active Clients -->
          <div class="card">
            <div class="section-title">Active Clients</div>
            ${activeProgress.length === 0 ? `<p style="font-size:13px;color:var(--text-muted);">No active clients yet.</p>` : ''}
            ${activeProgress.map(c => `
              <a class="client-row" href="/clients/${c.id}/board">
                <div style="flex:1;min-width:0;">
                  <div style="font-weight:600;margin-bottom:2px;">${c.name}</div>
                  ${c.services ? `<div style="font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${c.services}</div>` : ''}
                  ${c.pct !== null ? `
                  <div class="progress-bar"><div class="progress-fill" style="width:${c.pct}%"></div></div>
                  <div style="font-size:11px;color:var(--text-dim);">${c.pct}% through campaign${c.daysLeft !== null ? ` · ${c.daysLeft}d left` : ''}</div>
                  ` : ''}
                </div>
                <div style="text-align:right;flex-shrink:0;">
                  <div style="font-size:12px;color:var(--text-muted);">${c.taskDone}/${c.taskTotal} tasks</div>
                </div>
              </a>
            `).join('')}
          </div>

          <!-- Onboarding -->
          <div class="card">
            <div class="section-title">Onboarding</div>
            ${onboardingProgress.length === 0 ? `<p style="font-size:13px;color:var(--text-muted);">No clients onboarding.</p>` : ''}
            ${onboardingProgress.map(c => `
              <a class="client-row" href="/clients/${c.id}">
                <div style="flex:1;min-width:0;">
                  <div style="font-weight:600;margin-bottom:2px;">${c.name}</div>
                  <div class="progress-bar"><div class="progress-fill" style="width:${c.total ? Math.round((c.done/c.total)*100) : 0}%;background:var(--warning);"></div></div>
                  <div style="font-size:11px;color:var(--text-dim);">${c.done}/${c.total} checklist items</div>
                </div>
              </a>
            `).join('')}
          </div>

          <!-- Team Workload -->
          <div class="card">
            <div class="section-title">Team Workload</div>
            ${workload.length === 0 ? `<p style="font-size:13px;color:var(--text-muted);">No team assignments yet.</p>` : ''}
            ${workload.map(m => `
              <div style="padding:8px 0;border-bottom:1px solid var(--border);">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
                  <span style="font-size:13px;font-weight:600;">${m.name}</span>
                  <span style="font-size:11px;color:var(--text-muted);">${m.clients.length} client${m.clients.length !== 1 ? 's' : ''}</span>
                </div>
                <div style="display:flex;flex-wrap:wrap;gap:4px;">
                  ${m.clients.map(c => `<span class="tag">${c.name}${c.role ? ' · ' + c.role : ''}</span>`).join('')}
                </div>
              </div>
            `).join('')}
          </div>

          <!-- Tasks snapshot -->
          <div class="card">
            <div class="section-title">Tasks In Progress</div>
            ${stats.tasksInProgress === 0 ? `<p style="font-size:13px;color:var(--text-muted);">No tasks in progress.</p>` : `<p style="font-size:13px;color:var(--text-muted);">View tasks from the client board.</p>`}
          </div>

        </div>
      `;
    }

    load();
  </script>
</body>
</html>
