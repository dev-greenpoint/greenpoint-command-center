<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overview — Greenpoint</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/main.css">
  <script src="/components/theme.js"></script>
  <style>
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 6px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
    }
    .stat-value.accent { color: var(--accent); }
    .stat-value.warning { color: var(--warning); }
    .progress-bar {
      height: 4px;
      background: var(--surface-2);
      border-radius: 2px;
      margin: 6px 0 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
    }
    .client-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      text-decoration: none;
      color: var(--text);
    }
    .client-row:last-child { border-bottom: none; }
    .client-row:hover { color: var(--accent); }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .tag {
      display: inline-block;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 11px;
      padding: 2px 7px;
      color: var(--text-muted);
    }

    .client-block {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
    }
    .client-block-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      background: var(--surface);
      user-select: none;
    }
    .client-block-header:hover { background: var(--surface-2); }
    .client-block-name {
      font-weight: 600;
      font-size: 14px;
      flex: 1;
    }
    .client-block-meta {
      font-size: 12px;
      color: var(--text-muted);
    }
    .client-block-chevron {
      font-size: 9px;
      color: var(--text-dim);
      transition: transform 0.2s;
    }
    .client-block.open .client-block-chevron { transform: rotate(180deg); }
    .client-block-campaigns {
      display: none;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }
    .client-block.open .client-block-campaigns { display: block; }
    .campaign-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      font-size: 13px;
      transition: background 0.1s;
    }
    .campaign-link:last-child { border-bottom: none; }
    .campaign-link:hover { background: var(--surface); color: var(--accent); }
    .campaign-link-name { flex: 1; }
    .campaign-stage {
      font-size: 11px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content" id="page-content">
        <p style="color:var(--text-muted);">Loading…</p>
      </main>
    </div>
  </div>

  <script src="/components/shell.js"></script>
  <script>
    renderShell({ pageId: 'overview', title: 'Overview' });

    function escHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    const TYPE_LABEL = { pr: 'PR', social: 'Social', events: 'Events', paid: 'Paid Media', design: 'Design', edm: 'eDM' };

    async function load() {
      const res = await fetch('/api/overview');
      const { stats, activeProgress } = await res.json();

      document.getElementById('page-content').innerHTML = `

        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">Active Clients</div>
            <div class="stat-value accent">${stats.activeClients}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Onboarding</div>
            <div class="stat-value warning">${stats.onboardingClients}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Active Campaigns</div>
            <div class="stat-value">${stats.activeCampaigns}</div>
          </div>
        </div>

        <div class="section-title">Active Clients</div>

        ${activeProgress.length === 0 ? `<p style="font-size:13px;color:var(--text-muted);">No active clients yet.</p>` : ''}

        ${activeProgress.map((c, i) => `
          <div class="client-block" id="block-${c.id}">
            <div class="client-block-header" onclick="toggleClient('${c.id}')">
              <div class="client-block-name">${escHtml(c.name)}</div>
              ${c.services ? `<div class="client-block-meta">${escHtml(c.services)}</div>` : ''}
              <div class="client-block-meta">${c.campaigns.length} campaign${c.campaigns.length !== 1 ? 's' : ''}</div>
              ${c.pct !== null ? `<div class="client-block-meta">${c.daysLeft}d left</div>` : ''}
              <div class="client-block-chevron">▼</div>
            </div>
            ${c.pct !== null ? `
            <div style="height:3px;background:var(--surface-2);">
              <div style="height:100%;width:${c.pct}%;background:var(--accent);"></div>
            </div>` : ''}
            <div class="client-block-campaigns">
              ${c.campaigns.length === 0
                ? `<div style="padding:12px 20px;font-size:13px;color:var(--text-muted);">No active campaigns.</div>`
                : c.campaigns.map(camp => `
                  <a class="campaign-link" href="/campaigns/${camp.id}">
                    <span class="campaign-link-name">${escHtml(camp.name)}</span>
                    ${camp.type ? `<span class="tag">${TYPE_LABEL[camp.type] || camp.type}</span>` : ''}
                    <span class="campaign-stage">Stage ${(camp.currentStage || 0) + 1}</span>
                  </a>
                `).join('')
              }
              <div style="padding:10px 20px;border-top:1px solid var(--border);">
                <a href="/clients/${c.id}/board" style="font-size:12px;color:var(--accent);text-decoration:none;">View client board →</a>
              </div>
            </div>
          </div>
        `).join('')}
      `;
    }

    function toggleClient(id) {
      const block = document.getElementById('block-' + id);
      block.classList.toggle('open');
    }

    load();
  </script>
</body>
</html>
