<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign — Greenpoint</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    /* Campaign info card */
    .camp-info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
      margin-bottom: 24px;
    }
    .camp-info-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .camp-info-title {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 8px;
    }
    .camp-info-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
    }
    .chip-active     { background: #0d3323; color: var(--success); }
    .chip-draft      { background: var(--surface-2); color: var(--text-muted); }
    .chip-paused     { background: #3d2a00; color: var(--warning); }
    .chip-completed  { background: #1a1a2e; color: #8888cc; }
    .camp-info-meta {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .camp-info-meta-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .camp-info-meta-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-dim);
    }
    .camp-info-meta-val {
      font-size: 13px;
      color: var(--text);
    }
    .camp-setup {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .camp-setup-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .camp-setup-val {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
    }

    /* Task buttons */
    .task-stages { display: flex; flex-direction: column; gap: 12px; }
    .task-stage { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .task-stage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--surface-2);
      cursor: pointer;
      user-select: none;
    }
    .task-stage-header:hover { background: var(--surface); }
    .task-stage-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--text-dim);
    }
    .task-stage-header.all-done .task-stage-label { color: var(--success); }
    .task-stage-chevron { font-size: 10px; color: var(--text-dim); transition: transform .2s; }
    .task-stage.collapsed .task-stage-chevron { transform: rotate(-90deg); }
    .task-stage-body {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
    }
    .task-stage.collapsed .task-stage-body { display: none; }
    .task-btns-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .task-btn {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      min-width: 160px;
      max-width: 260px;
      cursor: pointer;
      text-align: left;
      transition: border-color .15s, background .15s;
      position: relative;
    }
    .task-btn:hover { border-color: var(--accent); background: var(--surface-2); }
    .task-btn.done {
      background: rgba(72,187,120,0.07);
      border-color: rgba(72,187,120,0.3);
    }
    .task-btn-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .task-btn.done .task-btn-title {
      color: var(--text-muted);
      text-decoration: line-through;
    }
    .task-btn-check {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
    }
    .task-btn.done .task-btn-check {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }
    /* Red ! badge */
    .task-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 16px;
      height: 16px;
      background: var(--danger, #e53e3e);
      color: #fff;
      border-radius: 50%;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      pointer-events: none;
    }
    .task-btn.done .task-badge { display: none; }

    /* Research textarea */
    .research-textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      line-height: 1.7;
      padding: 10px 12px;
      resize: vertical;
      min-height: 140px;
      font-family: inherit;
      transition: border-color .15s;
    }
    .research-textarea:focus { outline: none; border-color: var(--accent); }
    .research-textarea::placeholder { color: var(--text-dim); }

    /* Drawer */
    .drawer-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:300; }
    .drawer-overlay.open { display:block; }
    .drawer { position:fixed;top:0;right:-400px;width:380px;height:100%;background:var(--surface);border-left:1px solid var(--border);z-index:301;display:flex;flex-direction:column;transition:right 0.25s ease; }
    .drawer.open { right:0; }
    .drawer-header { display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border); }
    .drawer-header h2 { font-size:15px;font-weight:600; }
    .drawer-close { background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:20px;line-height:1; }
    .drawer-body { flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px; }
    .drawer-footer { padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content" id="page-content">
        <p style="color:var(--text-muted);">Loading…</p>
      </main>
    </div>
  </div>

  <!-- Campaign edit drawer -->
  <div class="drawer-overlay" id="edit-overlay"></div>
  <div class="drawer" id="edit-drawer">
    <div class="drawer-header">
      <h2>Edit Campaign</h2>
      <button class="drawer-close" onclick="closeEditDrawer()">×</button>
    </div>
    <div class="drawer-body">
      <div class="form-group"><label>Campaign Name</label><input type="text" id="f-name"></div>
      <div class="form-row">
        <div class="form-group">
          <label>Status</label>
          <select id="f-status">
            <option value="draft">Draft</option>
            <option value="active">Active</option>
            <option value="paused">Paused</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="f-type">
            <option value="">Select type</option>
            <option value="PR">PR</option>
            <option value="PR Light">PR Light</option>
            <option value="Social Media">Social Media</option>
            <option value="Google Ads">Google Ads</option>
            <option value="Email">Email</option>
            <option value="SEO">SEO</option>
            <option value="Content">Content</option>
            <option value="Video">Video</option>
            <option value="Multi-channel">Multi-channel</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Start Date</label><input type="date" id="f-start"></div>
        <div class="form-group"><label>End Date</label><input type="date" id="f-end"></div>
      </div>
      <div class="form-group"><label>Budget</label><input type="number" id="f-budget" min="0"></div>
      <div class="form-group"><label>Notes</label><textarea id="f-notes" rows="4"></textarea></div>
    </div>
    <div class="drawer-footer">
      <button class="btn btn-primary" id="edit-save">Save</button>
      <button class="btn btn-ghost" onclick="closeEditDrawer()">Cancel</button>
      <button class="btn btn-danger" style="margin-left:auto;" onclick="deleteCampaign()">Delete</button>
    </div>
  </div>

  <script src="/components/shell.js"></script>
  <script>
    const campaignId = location.pathname.split('/')[2];
    let campaign = null;
    let allTasks = [];

    const STAGES = {
      PR:         ['Campaign Prep','Campaign Development','Awaiting Client Approval','Set up Public Address','Pitch','Campaign Complete'],
      'PR Light': ['Campaign Prep','Campaign Development','Awaiting Client Approval','Set up Public Address','Pitch','Campaign Complete'],
      default:    ['Planning','In Progress','Review','Wrap-up'],
    };
    function getStages(type) { return STAGES[type] || STAGES.default; }

    async function load() {
      const [campRes, tasksRes] = await Promise.all([
        fetch(`/api/campaigns/${campaignId}`),
        fetch(`/api/campaigns/${campaignId}/tasks`),
      ]);
      if (!campRes.ok) {
        document.getElementById('page-content').innerHTML = '<p style="color:var(--danger);">Campaign not found.</p>';
        return;
      }
      campaign = await campRes.json();
      allTasks = tasksRes.ok ? await tasksRes.json() : [];
      renderShell({ pageId: 'campaigns', title: campaign.name });
      render();
    }

    function render() {
      const stages = getStages(campaign.type);
      const chipClass = { active:'chip-active', draft:'chip-draft', paused:'chip-paused', completed:'chip-completed' }[campaign.status] || 'chip-draft';
      const statusLabel = campaign.status.charAt(0).toUpperCase() + campaign.status.slice(1);
      const isPR = campaign.type === 'PR' || campaign.type === 'PR Light';

      let setup = null;
      try { if (campaign.setup) setup = typeof campaign.setup === 'string' ? JSON.parse(campaign.setup) : campaign.setup; } catch {}

      const researchVal = setup?.research || '';
      const setupHtml = (() => {
        const parts = [];
        if (setup?.angle) parts.push(`<div><div class="camp-setup-label">Campaign Angle</div><div class="camp-setup-val">${escHtml(setup.angle)}</div></div>`);
        if (setup?.keyMessages?.length) parts.push(`<div><div class="camp-setup-label">Key Messages</div><div class="camp-setup-val">${setup.keyMessages.map(m => `<div style="padding:2px 0 2px 10px;border-left:2px solid var(--border);margin-bottom:4px;">${escHtml(m)}</div>`).join('')}</div></div>`);
        if (setup?.spokespeople?.length) parts.push(`<div><div class="camp-setup-label">Spokespeople</div><div class="camp-setup-val">${escHtml(setup.spokespeople.join(', '))}</div></div>`);
        if (isPR) parts.push(`<div>
          <div class="camp-setup-label">Research</div>
          <textarea id="research-field" class="research-textarea"
            placeholder="Click 'Conduct Campaign Research' to generate article topics, publications and journalists to target — or add your own notes here."
            onblur="saveResearch(this.value)">${escHtml(researchVal)}</textarea>
        </div>`);
        return parts.length ? `<div class="camp-setup">${parts.join('')}</div>` : '';
      })();

      const metaItems = [];
      if (campaign.client_name) metaItems.push(`<div class="camp-info-meta-item"><div class="camp-info-meta-label">Client</div><div class="camp-info-meta-val"><a href="/clients/${campaign.client_id}/board" style="color:var(--accent);text-decoration:none;">${escHtml(campaign.client_name)}</a></div></div>`);
      if (campaign.start_date) metaItems.push(`<div class="camp-info-meta-item"><div class="camp-info-meta-label">Start</div><div class="camp-info-meta-val">${escHtml(campaign.start_date)}</div></div>`);
      if (campaign.end_date) metaItems.push(`<div class="camp-info-meta-item"><div class="camp-info-meta-label">End</div><div class="camp-info-meta-val">${escHtml(campaign.end_date)}</div></div>`);
      if (campaign.budget) metaItems.push(`<div class="camp-info-meta-item"><div class="camp-info-meta-label">Budget</div><div class="camp-info-meta-val">$${Number(campaign.budget).toLocaleString()}</div></div>`);

      const stagesHtml = stages.map((stageName, stageIdx) => {
        const stageTasks = allTasks.filter(t => t.stage_index === stageIdx);
        if (!stageTasks.length) return '';
        const allDone = stageTasks.every(t => t.done);
        const doneCount = stageTasks.filter(t => t.done).length;
        const btns = stageTasks.map(t => {
          const isDone = !!t.done;
          const isResearchTask = isPR && t.title && (t.title.toLowerCase().includes('research articles') || t.title.toLowerCase().includes('conduct campaign research'));
          const clickHandler = isResearchTask && !isDone ? `onclick="runResearch(${t.id})"` : `onclick="toggleDone(${t.id}, ${isDone ? 0 : 1})"`;
          return `
            <div class="task-btn ${isDone ? 'done' : ''}" id="task-btn-${t.id}" ${clickHandler}>
              <div class="task-btn-title">
                <div class="task-btn-check">${isDone ? '✓' : ''}</div>
                ${escHtml(t.title)}
              </div>
              ${!isDone ? '<div class="task-badge">!</div>' : ''}
            </div>`;
        }).join('');
        return `
          <div class="task-stage${allDone ? ' collapsed' : ''}" id="task-stage-${stageIdx}">
            <div class="task-stage-header${allDone ? ' all-done' : ''}" onclick="toggleStage(${stageIdx})">
              <div class="task-stage-label">${allDone ? '✓ ' : ''}${escHtml(stageName)}</div>
              <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:11px;color:var(--text-dim);">${doneCount}/${stageTasks.length}</span>
                <span class="task-stage-chevron">▼</span>
              </div>
            </div>
            <div class="task-stage-body">
              <div class="task-btns-wrap">${btns}</div>
            </div>
          </div>`;
      }).filter(Boolean).join('');

      document.getElementById('page-content').innerHTML = `
        <div style="margin-bottom:16px;">
          <a href="/campaigns" style="color:var(--text-muted);font-size:13px;text-decoration:none;">← Campaigns</a>
        </div>
        <div class="camp-info-card">
          <div class="camp-info-top">
            <div>
              <h1 class="camp-info-title">${escHtml(campaign.name)}</h1>
              <div class="camp-info-chips">
                <span class="status-chip ${chipClass}">${statusLabel}</span>
                ${campaign.type ? `<span style="font-size:12px;color:var(--text-muted);background:var(--surface-2);padding:3px 10px;border-radius:100px;">${escHtml(campaign.type)}</span>` : ''}
              </div>
            </div>
            <button class="btn btn-ghost" style="font-size:12px;white-space:nowrap;" onclick="openEditDrawer()">Edit Campaign</button>
          </div>
          ${metaItems.length ? `<div class="camp-info-meta">${metaItems.join('')}</div>` : ''}
          ${setupHtml}
        </div>
        <div class="task-stages" id="task-stages">
          ${stagesHtml || '<p style="color:var(--text-dim);font-size:13px;">No tasks yet.</p>'}
        </div>
      `;
    }

    async function toggleDone(taskId, done) {
      const btn = document.getElementById(`task-btn-${taskId}`);
      if (btn) {
        btn.classList.toggle('done', !!done);
        const check = btn.querySelector('.task-btn-check');
        if (check) check.textContent = done ? '✓' : '';
        const badge = btn.querySelector('.task-badge');
        if (done) { if (badge) badge.remove(); }
        else if (!badge) { const b = document.createElement('div'); b.className = 'task-badge'; b.textContent = '!'; btn.appendChild(b); }
        btn.setAttribute('onclick', `toggleDone(${taskId}, ${done ? 0 : 1})`);
      }
      const task = allTasks.find(t => t.id === taskId);
      if (task) task.done = done ? 1 : 0;

      // Auto-collapse when all done, re-expand if un-ticked
      const stageIdx = task?.stage_index;
      if (stageIdx !== undefined) {
        const stageTasks = allTasks.filter(t => t.stage_index === stageIdx);
        const allDone = stageTasks.every(t => t.done);
        const section = document.getElementById(`task-stage-${stageIdx}`);
        const header = section?.querySelector('.task-stage-header');
        const label = section?.querySelector('.task-stage-label');
        const countEl = section?.querySelector('.task-stage-header > div > span:first-child');
        if (countEl) countEl.textContent = `${stageTasks.filter(t=>t.done).length}/${stageTasks.length}`;
        if (allDone) {
          setTimeout(() => {
            section?.classList.add('collapsed');
            header?.classList.add('all-done');
            if (label) label.textContent = '✓ ' + label.textContent.replace(/^✓ /, '');
          }, 400);
        } else {
          section?.classList.remove('collapsed');
          header?.classList.remove('all-done');
          if (label) label.textContent = label.textContent.replace(/^✓ /, '');
        }
      }

      await fetch(`/api/campaigns/${campaignId}/tasks/${taskId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done: !!done })
      });
    }

    function toggleStage(stageIdx) {
      const section = document.getElementById(`task-stage-${stageIdx}`);
      if (section) section.classList.toggle('collapsed');
    }

    // ── Research ──────────────────────────────────────────────────────────────

    async function runResearch(taskId) {
      const btn = document.getElementById(`task-btn-${taskId}`);
      const titleEl = btn?.querySelector('.task-btn-title');
      if (titleEl) titleEl.innerHTML = `<div class="task-btn-check"></div> Generating…`;

      try {
        const res = await fetch(`/api/pitch-lists/campaign/${campaignId}/research`, { method: 'POST' });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        // Save to setup.research
        let setup = null;
        try { setup = campaign.setup ? JSON.parse(campaign.setup) : {}; } catch { setup = {}; }
        setup.research = data.brief;
        campaign.setup = JSON.stringify(setup);
        await saveSetupField(setup);

        // Populate the textarea
        const field = document.getElementById('research-field');
        if (field) field.value = data.brief;

        // Mark task done
        await toggleDone(taskId, 1);
      } catch (err) {
        if (titleEl) titleEl.innerHTML = `<div class="task-btn-check"></div> Conduct Campaign Research`;
        alert('Research failed: ' + err.message);
      }
    }

    async function saveResearch(value) {
      let setup = null;
      try { setup = campaign.setup ? JSON.parse(campaign.setup) : {}; } catch { setup = {}; }
      setup.research = value;
      campaign.setup = JSON.stringify(setup);
      await saveSetupField(setup);
    }

    async function saveSetupField(setup) {
      await fetch(`/api/campaigns/${campaignId}/setup`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ setup })
      });
    }

    // ── Helpers ────────────────────────────────────────────────────────────────

    function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // ── Edit drawer ────────────────────────────────────────────────────────────

    function openEditDrawer() {
      document.getElementById('f-name').value = campaign.name || '';
      document.getElementById('f-status').value = campaign.status || 'draft';
      document.getElementById('f-type').value = campaign.type || '';
      document.getElementById('f-start').value = campaign.start_date || '';
      document.getElementById('f-end').value = campaign.end_date || '';
      document.getElementById('f-budget').value = campaign.budget || '';
      document.getElementById('f-notes').value = campaign.notes || '';
      document.getElementById('edit-overlay').classList.add('open');
      document.getElementById('edit-drawer').classList.add('open');
    }
    function closeEditDrawer() {
      document.getElementById('edit-overlay').classList.remove('open');
      document.getElementById('edit-drawer').classList.remove('open');
    }
    document.getElementById('edit-overlay').addEventListener('click', closeEditDrawer);

    document.getElementById('edit-save').addEventListener('click', async () => {
      const btn = document.getElementById('edit-save');
      btn.disabled = true; btn.textContent = 'Saving…';
      await fetch(`/api/campaigns/${campaignId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('f-name').value,
          status: document.getElementById('f-status').value,
          type: document.getElementById('f-type').value || null,
          start_date: document.getElementById('f-start').value || null,
          end_date: document.getElementById('f-end').value || null,
          budget: document.getElementById('f-budget').value || null,
          notes: document.getElementById('f-notes').value || null,
        })
      });
      btn.disabled = false; btn.textContent = 'Save';
      closeEditDrawer();
      load();
    });

    async function deleteCampaign() {
      if (!confirm('Delete this campaign?')) return;
      await fetch(`/api/campaigns/${campaignId}`, { method: 'DELETE' });
      window.location.href = '/campaigns';
    }

    load();
  </script>
</body>
</html>
