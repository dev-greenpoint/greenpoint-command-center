<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign — Greenpoint</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    .board-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
    }
    .chip-active     { background: #0d3323; color: var(--success); }
    .chip-draft      { background: var(--surface-2); color: var(--text-muted); }
    .chip-paused     { background: #3d2a00; color: var(--warning); }
    .chip-completed  { background: #1a1a2e; color: #8888cc; }

    /* Stage tabs */
    .stage-tabs-wrap { border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
    .stage-tabs { display: flex; gap: 2px; min-width: max-content; }
    .stage-tab {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px; font-size: 13px; font-weight: 500;
      color: var(--text-muted); background: none; border: none;
      border-radius: 8px 8px 0 0; cursor: pointer;
      transition: color .15s, background .15s; white-space: nowrap;
      margin-bottom: -1px;
    }
    .stage-tab:hover:not(.active) { color: var(--text); background: var(--surface-2); }
    .stage-tab.active { background: var(--accent); color: #fff; font-weight: 600; }
    .stage-tab.done { color: var(--success); }
    .stage-tab .tab-count {
      font-size: 10px; font-weight: 700; padding: 1px 6px;
      border-radius: 100px; background: var(--surface-2); color: var(--text-dim);
    }
    .stage-tab.active .tab-count { background: rgba(0,0,0,.2); color: #fff; }
    .stage-tab.done .tab-count { background: rgba(72,187,120,.15); color: var(--success); }

    /* Stage panel */
    .stage-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

    /* Task list — Asana-style rows */
    .task-list { width: 100%; }
    .task-cols {
      display: grid;
      grid-template-columns: 18px 1fr 120px 95px 85px 22px;
      gap: 0 8px;
      padding: 0 4px 5px;
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .task-row {
      display: grid;
      grid-template-columns: 18px 1fr 120px 95px 85px 22px;
      gap: 0 8px;
      padding: 0 4px;
      min-height: 34px;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .task-row:last-child { border-bottom: none; }
    .task-row:hover { background: var(--surface-2); }
    .task-row.done .task-cell-title span { text-decoration: line-through; color: var(--text-dim); }
    .task-row input[type=checkbox] {
      width: 13px; height: 13px; flex-shrink: 0;
      cursor: pointer; accent-color: var(--accent);
    }

    /* Editable cells */
    .task-cell { position: relative; cursor: text; min-width: 0; }
    .task-cell span {
      display: block; font-size: 13px; line-height: 1;
      padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .task-cell-assignee span, .task-cell-due span {
      font-size: 12px; color: var(--text-muted);
    }
    .task-cell input {
      display: none; width: 100%; box-sizing: border-box;
      background: var(--surface); border: 1px solid var(--accent);
      border-radius: 4px; color: var(--text);
      font-size: 12px; padding: 3px 6px;
    }
    .task-cell input:focus { outline: none; }
    .task-cell select {
      display: none; width: 100%; box-sizing: border-box;
      background: var(--surface); border: 1px solid var(--accent);
      border-radius: 4px; color: var(--text);
      font-size: 11px; padding: 3px 4px; cursor: pointer;
    }
    .task-cell select:focus { outline: none; }
    .task-cell.editing span { display: none; }
    .task-cell.editing input,
    .task-cell.editing select { display: block; }

    /* Assignee avatar */
    .av {
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%; font-weight: 700; flex-shrink: 0;
      vertical-align: middle; color: #fff;
    }
    .task-cell-assignee { cursor: pointer; overflow: visible !important; }
    .task-cell-assignee > span { display: flex; align-items: center; gap: 5px; }

    /* Assignee dropdown */
    .av-dropdown {
      display: none; position: absolute; top: calc(100% + 4px); left: 0;
      z-index: 300; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: 0 6px 16px rgba(0,0,0,0.35);
      padding: 4px; min-width: 150px;
    }
    .av-dropdown.open { display: block; }
    .av-option {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    .av-option:hover { background: var(--surface-2); }

    /* Progress chips */
    .progress-chip {
      display: inline-block; padding: 2px 7px; border-radius: 100px;
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .04em; white-space: nowrap; cursor: pointer;
    }
    .pc-not-assigned { background: var(--surface-2); color: var(--text-dim); }
    .pc-planned      { background: #0d1f33; color: #6699cc; }
    .pc-in-progress  { background: #2a1800; color: #cc8800; }
    .pc-in-review    { background: #1a0a2e; color: #9966cc; }
    .pc-complete     { background: #0d3323; color: var(--success); }

    /* Delete button */
    .task-del {
      background: none; border: none; color: transparent;
      cursor: pointer; font-size: 14px; line-height: 1; padding: 0;
      transition: color 0.1s;
    }
    .task-row:hover .task-del { color: var(--text-dim); }
    .task-del:hover { color: var(--danger) !important; }

    /* Add task row */
    .add-task-row {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 0 8px;
      padding: 0 4px;
      min-height: 32px;
      align-items: center;
    }
    .add-task-trigger {
      font-size: 12px; color: var(--text-dim);
      cursor: pointer; transition: color 0.15s;
    }
    .add-task-trigger:hover { color: var(--accent); }
    .add-task-inline { display: none; }
    .add-task-inline.open { display: grid; grid-template-columns: 1fr 100px 85px auto auto; gap: 5px; align-items: center; margin-top: 2px; padding: 4px 4px 6px; }
    .add-task-inline input {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); font-size: 12px;
      padding: 4px 7px; width: 100%; box-sizing: border-box;
    }
    .add-task-inline input:focus { outline: none; border-color: var(--accent); }

    /* Drawer (campaign edit) */
    .drawer-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200; }
    .drawer-overlay.open { display:block; }
    .drawer { position:fixed;top:0;right:-400px;width:380px;height:100%;background:var(--surface);border-left:1px solid var(--border);z-index:201;display:flex;flex-direction:column;transition:right 0.25s ease; }
    .drawer.open { right:0; }
    .drawer-header { display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border); }
    .drawer-header h2 { font-size:15px;font-weight:600; }
    .drawer-close { background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:20px;line-height:1; }
    .drawer-body { flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px; }
    .drawer-footer { padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content" id="page-content">
        <p style="color:var(--text-muted);">Loading…</p>
      </main>
    </div>
  </div>

  <!-- Campaign edit drawer -->
  <div class="drawer-overlay" id="edit-overlay"></div>
  <div class="drawer" id="edit-drawer">
    <div class="drawer-header">
      <h2>Edit Campaign</h2>
      <button class="drawer-close" onclick="closeEditDrawer()">×</button>
    </div>
    <div class="drawer-body">
      <div class="form-group"><label>Campaign Name</label><input type="text" id="f-name"></div>
      <div class="form-row">
        <div class="form-group">
          <label>Status</label>
          <select id="f-status">
            <option value="draft">Draft</option>
            <option value="active">Active</option>
            <option value="paused">Paused</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="f-type">
            <option value="">Select type</option>
            <option value="PR">PR</option>
            <option value="Social Media">Social Media</option>
            <option value="Google Ads">Google Ads</option>
            <option value="Email">Email</option>
            <option value="SEO">SEO</option>
            <option value="Content">Content</option>
            <option value="Video">Video</option>
            <option value="Multi-channel">Multi-channel</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Start Date</label><input type="date" id="f-start"></div>
        <div class="form-group"><label>End Date</label><input type="date" id="f-end"></div>
      </div>
      <div class="form-group"><label>Budget</label><input type="number" id="f-budget" min="0"></div>
      <div class="form-group"><label>Notes</label><textarea id="f-notes" rows="4"></textarea></div>
    </div>
    <div class="drawer-footer">
      <button class="btn btn-primary" id="edit-save">Save</button>
      <button class="btn btn-ghost" onclick="closeEditDrawer()">Cancel</button>
      <button class="btn btn-danger" style="margin-left:auto;" onclick="deleteCampaign()">Delete</button>
    </div>
  </div>

  <script src="/components/shell.js"></script>
  <script>
    const campaignId = location.pathname.split('/')[2];
    let campaign = null;
    let allTasks = [];
    let teamMembers = [];

    const STAGES = {
      PR:       ['Campaign Prep','Campaign Development','Awaiting Client Approval','Set up Public Address','Pitch','Campaign Complete'],
      'PR Light': ['Campaign Prep','Campaign Development','Awaiting Client Approval','Set up Public Address','Pitch','Campaign Complete'],
      default:  ['Planning','In Progress','Review','Wrap-up'],
    };
    function getStages(type) { return STAGES[type] || STAGES.default; }

    const GROUPS = {
      PR: [
        { label: 'Preparation',  stages: [0, 1] },
        { label: 'Approval',     stages: [2] },
        { label: 'Outreach',     stages: [3, 4] },
        { label: 'Complete',     stages: [5] },
      ],
      'PR Light': [
        { label: 'Preparation',  stages: [0, 1] },
        { label: 'Approval',     stages: [2] },
        { label: 'Outreach',     stages: [3, 4] },
        { label: 'Complete',     stages: [5] },
      ],
    };
    function getGroups(type) { return GROUPS[type] || null; }

    // ── Load ──────────────────────────────────────────────────────────────────

    async function load() {
      const [campRes, tasksRes, teamRes] = await Promise.all([
        fetch(`/api/campaigns/${campaignId}`),
        fetch(`/api/campaigns/${campaignId}/tasks`),
        fetch('/api/team-members/names')
      ]);
      teamMembers = teamRes.ok ? await teamRes.json() : [];
      if (!campRes.ok) {
        document.getElementById('page-content').innerHTML = '<p style="color:var(--danger);">Campaign not found.</p>';
        return;
      }
      campaign = await campRes.json();
      allTasks = tasksRes.ok ? await tasksRes.json() : [];
      renderShell({ pageId: 'campaigns', title: campaign.name });
      render();
    }

    let activeStageTab = 0;

    function render() {
      const stages   = getStages(campaign.type);
      const chipClass  = { active:'chip-active', draft:'chip-draft', paused:'chip-paused', completed:'chip-completed' }[campaign.status] || 'chip-draft';
      const statusLabel = campaign.status.charAt(0).toUpperCase() + campaign.status.slice(1);
      const currentStage = campaign.current_stage || 0;

      // Clamp active tab to valid range
      if (activeStageTab >= stages.length) activeStageTab = currentStage;

      const tabsHtml = stages.map((s, i) => {
        const stageTasks = allTasks.filter(t => t.stage_index === i);
        const doneCount  = stageTasks.filter(t => t.done).length;
        const allDone    = stageTasks.length > 0 && doneCount === stageTasks.length;
        const isDone     = i < currentStage || allDone;
        const isActive   = i === activeStageTab;
        const countBadge = stageTasks.length ? `<span class="tab-count">${doneCount}/${stageTasks.length}</span>` : '';
        const tick       = isDone ? '✓ ' : '';
        return `<button class="stage-tab ${isActive?'active':''} ${isDone&&!isActive?'done':''}" onclick="switchStageTab(${i})">${tick}${s}${countBadge}</button>`;
      }).join('');

      document.getElementById('page-content').innerHTML = `
        <div class="board-header">
          <a href="/campaigns" style="color:var(--text-muted);font-size:13px;text-decoration:none;">← Campaigns</a>
          ${campaign.client_name ? `<span style="color:var(--text-dim);">›</span><a href="/clients/${campaign.client_id}/board" style="color:var(--text-muted);font-size:13px;text-decoration:none;">${escHtml(campaign.client_name)}</a>` : ''}
          <h1 style="font-size:20px;font-weight:700;">${escHtml(campaign.name)}</h1>
          <span class="status-chip ${chipClass}">${statusLabel}</span>
          ${campaign.type ? `<span style="font-size:12px;color:var(--text-muted);">${escHtml(campaign.type)}</span>` : ''}
          <div style="flex:1;"></div>
          <button class="btn btn-ghost" style="font-size:12px;" onclick="openEditDrawer()">Edit</button>
        </div>
        <div class="stage-tabs-wrap"><div class="stage-tabs">${tabsHtml}</div></div>
        <div class="stage-panel" id="stage-panel"></div>
      `;
      renderStagePanel();
    }

    function renderStagePanel() {
      const stages     = getStages(campaign.type);
      const stageName  = stages[activeStageTab] || '';
      const stageTasks = allTasks.filter(t => t.stage_index === activeStageTab);
      const doneCount  = stageTasks.filter(t => t.done).length;

      const colHeader = stageTasks.length ? `
        <div class="task-cols">
          <div></div><div>Task</div><div>Progress</div><div>Assignee</div><div>Due</div><div></div>
        </div>` : '';

      const tasksHtml = stageTasks.map(t => {
        const prog = t.progress || 'Not Assigned';
        const progClass = progressClass(prog);
        return `
        <div class="task-row ${t.done ? 'done' : ''}" id="task-row-${t.id}">
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleDone(${t.id}, this.checked)">
          <div class="task-cell task-cell-title" onclick="editCell(this, ${t.id}, 'title')">
            <span>${escHtml(t.title)}</span>
            <input type="text" value="${escAttr(t.title)}"
              onblur="saveField(${t.id}, 'title', this.value)"
              onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape')cancelCell(this.parentElement)">
          </div>
          <div class="task-cell task-cell-progress" onclick="editCell(this, ${t.id}, 'progress')">
            <span><span class="progress-chip ${progClass}">${prog}</span></span>
            <select onchange="saveField(${t.id}, 'progress', this.value)" onblur="cancelCell(this.parentElement)">
              ${['Not Assigned','Planned','In Progress','In Review','Complete'].map(o => `<option${o===prog?' selected':''}>${o}</option>`).join('')}
            </select>
          </div>
          <div class="task-cell task-cell-assignee" onclick="openAssigneeSelector(event, ${t.id})">
            <span>${assigneeDisplay(t.assignee)}</span>
            <div class="av-dropdown" id="av-drop-${t.id}">
              <div class="av-option" onclick="event.stopPropagation();selectAssignee(${t.id}, null)">
                <span style="font-size:11px;color:var(--text-dim)">— Unassign</span>
              </div>
              ${teamMembers.map(name => `
                <div class="av-option" onclick="event.stopPropagation();selectAssignee(${t.id}, '${name.replace(/'/g,"\\'")}')">
                  ${avatarHtml(name)} ${escHtml(name)}
                </div>`).join('')}
            </div>
          </div>
          <div class="task-cell task-cell-due" onclick="editCell(this, ${t.id}, 'due_date')">
            <span>${t.due_date || '<span style=color:var(--text-dim)>—</span>'}</span>
            <input type="date" value="${t.due_date || ''}"
              onchange="saveField(${t.id}, 'due_date', this.value)"
              onblur="saveField(${t.id}, 'due_date', this.value)"
              onkeydown="if(event.key==='Escape')cancelCell(this.parentElement)">
          </div>
          <button class="task-del" onclick="deleteTask(${t.id})" title="Delete">×</button>
        </div>`;
      }).join('');

      const emptyMsg = `<div style="padding:24px 16px;font-size:13px;color:var(--text-dim);">No tasks in this stage yet.</div>`;

      document.getElementById('stage-panel').innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);">
          <span style="font-size:13px;font-weight:600;">${escHtml(stageName)}</span>
          <span style="font-size:12px;color:var(--text-muted);">${doneCount}/${stageTasks.length} done</span>
        </div>
        <div style="padding:8px 20px 12px;">
          <div class="task-list">
            ${colHeader}
            ${stageTasks.length ? tasksHtml : emptyMsg}
          </div>
          <div class="add-task-row">
            <div></div>
            <div class="add-task-trigger" id="add-trigger-${activeStageTab}" onclick="showAddForm(${activeStageTab})">+ Add task</div>
          </div>
          <div class="add-task-inline" id="add-form-${activeStageTab}">
            <input type="text" id="add-title-${activeStageTab}" placeholder="Task title…"
              onkeydown="if(event.key==='Enter')submitTask(${activeStageTab});if(event.key==='Escape')hideAddForm(${activeStageTab})">
            <input type="text" id="add-assignee-${activeStageTab}" placeholder="Assignee">
            <input type="date" id="add-due-${activeStageTab}">
            <button class="btn btn-primary" style="font-size:12px;padding:4px 10px;white-space:nowrap;" onclick="submitTask(${activeStageTab})">Add</button>
            <button class="btn btn-ghost" style="font-size:12px;padding:4px 8px;" onclick="hideAddForm(${activeStageTab})">✕</button>
          </div>
        </div>`;
    }

    function switchStageTab(i) {
      activeStageTab = i;
      document.querySelectorAll('.stage-tab').forEach((el, idx) => el.classList.toggle('active', idx === i));
      renderStagePanel();
    }

    // ── Add task ───────────────────────────────────────────────────────────────

    function showAddForm(stageIndex) {
      document.getElementById(`add-trigger-${stageIndex}`).style.display = 'none';
      const form = document.getElementById(`add-form-${stageIndex}`);
      form.classList.add('open');
      document.getElementById(`add-title-${stageIndex}`).focus();
    }
    function hideAddForm(stageIndex) {
      document.getElementById(`add-form-${stageIndex}`).classList.remove('open');
      const trigger = document.getElementById(`add-trigger-${stageIndex}`);
      if (trigger) trigger.style.display = '';
    }

    async function submitTask(stageIndex) {
      const title = document.getElementById(`add-title-${stageIndex}`).value.trim();
      if (!title) return;
      const assignee = document.getElementById(`add-assignee-${stageIndex}`).value.trim();
      const due_date = document.getElementById(`add-due-${stageIndex}`).value;
      hideAddForm(stageIndex);
      await fetch(`/api/campaigns/${campaignId}/tasks`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stage_index: stageIndex, title, assignee: assignee || null, due_date: due_date || null })
      });
      load();
    }

    // ── Toggle done ────────────────────────────────────────────────────────────

    async function toggleDone(taskId, done) {
      await fetch(`/api/campaigns/${campaignId}/tasks/${taskId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done })
      });
      const task = allTasks.find(t => t.id === taskId);
      if (task) task.done = done ? 1 : 0;
      // Refresh tab badges and panel
      const stages     = getStages(campaign.type);
      const currentStage = campaign.current_stage || 0;
      document.querySelectorAll('.stage-tab').forEach((el, i) => {
        const stageTasks = allTasks.filter(t => t.stage_index === i);
        const doneCount  = stageTasks.filter(t => t.done).length;
        const allDone    = stageTasks.length > 0 && doneCount === stageTasks.length;
        const isDone     = i < currentStage || allDone;
        el.classList.toggle('done', isDone && i !== activeStageTab);
        const badge = el.querySelector('.tab-count');
        if (badge) badge.textContent = `${doneCount}/${stageTasks.length}`;
        const tick = isDone ? '✓ ' : '';
        el.childNodes[0].textContent = tick + stages[i];
      });
    }

    // ── Helpers ────────────────────────────────────────────────────────────────

    function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function escAttr(s) { return escHtml(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    function avatarColor(name) {
      const palette = ['#5b5fcf','#2e7d32','#8e3a7a','#d4870a','#0277bd','#6a4f00','#00695c','#b71c1c'];
      let h = 0;
      for (let i = 0; i < (name||'').length; i++) h = (name.charCodeAt(i) + ((h << 5) - h)) | 0;
      return palette[Math.abs(h) % palette.length];
    }
    function avatarHtml(name, size=20) {
      if (!name) return '';
      const initials = name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
      return `<span class="av" style="width:${size}px;height:${size}px;background:${avatarColor(name)};font-size:${Math.round(size*.42)}px">${initials}</span>`;
    }
    function assigneeDisplay(name) {
      return name
        ? `${avatarHtml(name)} ${name}`
        : '<span style="color:var(--text-dim)">—</span>';
    }

    function openAssigneeSelector(event, taskId) {
      event.stopPropagation();
      const drop = document.getElementById(`av-drop-${taskId}`);
      const isOpen = drop.classList.contains('open');
      document.querySelectorAll('.av-dropdown.open').forEach(d => d.classList.remove('open'));
      if (!isOpen) drop.classList.add('open');
    }
    async function selectAssignee(taskId, name) {
      document.querySelectorAll('.av-dropdown.open').forEach(d => d.classList.remove('open'));
      await saveField(taskId, 'assignee', name || '');
    }
    document.addEventListener('click', () => {
      document.querySelectorAll('.av-dropdown.open').forEach(d => d.classList.remove('open'));
    });

    function progressClass(p) {
      return { 'Not Assigned': 'pc-not-assigned', 'Planned': 'pc-planned', 'In Progress': 'pc-in-progress', 'In Review': 'pc-in-review', 'Complete': 'pc-complete' }[p] || 'pc-not-assigned';
    }

    // ── Per-field inline edit ──────────────────────────────────────────────────

    function editCell(cell, taskId, field) {
      cell.classList.add('editing');
      const el = cell.querySelector('input, select');
      if (!el) return;
      el.focus();
      if (el.type === 'text') el.select();
    }

    function cancelCell(cell) {
      cell.classList.remove('editing');
    }

    const cellFieldMap = { title: 'title', assignee: 'assignee', due_date: 'due', progress: 'progress' };

    async function saveField(taskId, field, value) {
      const task = allTasks.find(t => t.id === taskId);
      if (!task) return;
      const sanitized = (value && value.trim) ? value.trim() : value;
      if (field === 'title' && !sanitized) { cancelCell(document.querySelector(`#task-row-${taskId} .task-cell-title`)); return; }

      const row = document.getElementById(`task-row-${taskId}`);
      if (row) {
        row.querySelectorAll('.task-cell').forEach(c => c.classList.remove('editing'));
        const cellName = cellFieldMap[field];
        const span = row.querySelector(`.task-cell-${cellName} > span`);
        if (span) {
          if (field === 'progress') {
            const p = sanitized || 'Not Assigned';
            span.innerHTML = `<span class="progress-chip ${progressClass(p)}">${p}</span>`;
          } else if (field === 'assignee') {
            span.innerHTML = assigneeDisplay(sanitized);
          } else {
            span.innerHTML = sanitized || '<span style=color:var(--text-dim)>—</span>';
          }
        }
      }

      task[field] = sanitized || null;
      await fetch(`/api/campaigns/${campaignId}/tasks/${taskId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [field]: sanitized || null })
      });
    }

    async function deleteTask(taskId) {
      if (!confirm('Delete this task?')) return;
      await fetch(`/api/campaigns/${campaignId}/tasks/${taskId}`, { method: 'DELETE' });
      load();
    }

    // ── Advance / Back ─────────────────────────────────────────────────────────

    async function setStage(index) {
      const stages = getStages(campaign.type);
      const clamped = Math.max(0, Math.min(stages.length, index));
      await fetch(`/api/campaigns/${campaignId}/stage`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stage: clamped })
      });
      campaign.current_stage = clamped;
      render();
    }

    // ── Campaign edit drawer ───────────────────────────────────────────────────

    function openEditDrawer() {
      document.getElementById('f-name').value = campaign.name || '';
      document.getElementById('f-status').value = campaign.status || 'draft';
      document.getElementById('f-type').value = campaign.type || '';
      document.getElementById('f-start').value = campaign.start_date || '';
      document.getElementById('f-end').value = campaign.end_date || '';
      document.getElementById('f-budget').value = campaign.budget || '';
      document.getElementById('f-notes').value = campaign.notes || '';
      document.getElementById('edit-overlay').classList.add('open');
      document.getElementById('edit-drawer').classList.add('open');
    }
    function closeEditDrawer() {
      document.getElementById('edit-overlay').classList.remove('open');
      document.getElementById('edit-drawer').classList.remove('open');
    }
    document.getElementById('edit-overlay').addEventListener('click', closeEditDrawer);

    document.getElementById('edit-save').addEventListener('click', async () => {
      const btn = document.getElementById('edit-save');
      btn.disabled = true; btn.textContent = 'Saving…';
      await fetch(`/api/campaigns/${campaignId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('f-name').value,
          status: document.getElementById('f-status').value,
          type: document.getElementById('f-type').value || null,
          start_date: document.getElementById('f-start').value || null,
          end_date: document.getElementById('f-end').value || null,
          budget: document.getElementById('f-budget').value || null,
          notes: document.getElementById('f-notes').value || null,
        })
      });
      btn.disabled = false; btn.textContent = 'Save';
      closeEditDrawer();
      load();
    });

    async function deleteCampaign() {
      if (!confirm('Delete this campaign?')) return;
      await fetch(`/api/campaigns/${campaignId}`, { method: 'DELETE' });
      window.location.href = '/campaigns';
    }

    load();
  </script>
</body>
</html>
