<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign — Greenpoint</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    .board-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
    }
    .chip-active     { background: #0d3323; color: var(--success); }
    .chip-draft      { background: var(--surface-2); color: var(--text-muted); }
    .chip-paused     { background: #3d2a00; color: var(--warning); }
    .chip-completed  { background: #1a1a2e; color: #8888cc; }

    /* Progress track */
    .progress-track {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .progress-center { flex: 1; }
    .progress-bar-wrap {
      height: 5px;
      background: var(--surface-2);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .progress-dots {
      display: flex;
      justify-content: space-between;
    }
    .progress-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: 700;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .progress-dot.done  { background: var(--success); color: #000; border-color: var(--success); }
    .progress-dot.active { background: var(--accent); color: #000; border-color: var(--accent); }

    /* Stage sections */
    .stage-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
    }
    .stage-section.is-current {
      border-color: var(--accent);
    }
    .stage-section.is-done {
      opacity: 0.7;
    }
    .stage-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .stage-section.is-done .stage-header { border-bottom-color: transparent; }
    .stage-section.is-done.open .stage-header { border-bottom-color: var(--border); }
    .stage-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .stage-section.is-current .stage-num { background: var(--accent); color: #000; border-color: var(--accent); }
    .stage-section.is-done .stage-num { background: var(--success); color: #000; border-color: var(--success); }
    .stage-name { font-size: 13px; font-weight: 600; flex: 1; }
    .stage-badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 2px 8px;
      border-radius: 100px;
    }
    .badge-current { background: var(--accent); color: #000; }
    .badge-done { background: var(--success); color: #000; }
    .stage-task-count { font-size: 11px; color: var(--text-muted); }
    .stage-chevron { font-size: 10px; color: var(--text-dim); transition: transform 0.2s; }
    .stage-section.open .stage-chevron { transform: rotate(180deg); }

    .stage-body { display: none; padding: 8px 12px 10px; }
    .stage-section.open .stage-body { display: block; }

    /* Task list — Asana-style rows */
    .task-list { width: 100%; }
    .task-cols {
      display: grid;
      grid-template-columns: 18px 1fr 110px 95px 22px;
      gap: 0 8px;
      padding: 0 4px 5px;
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .task-row {
      display: grid;
      grid-template-columns: 18px 1fr 110px 95px 22px;
      gap: 0 8px;
      padding: 0 4px;
      min-height: 34px;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .task-row:last-child { border-bottom: none; }
    .task-row:hover { background: var(--surface-2); }
    .task-row.done .task-cell-title span { text-decoration: line-through; color: var(--text-dim); }
    .task-row input[type=checkbox] {
      width: 13px; height: 13px; flex-shrink: 0;
      cursor: pointer; accent-color: var(--accent);
    }

    /* Editable cells */
    .task-cell { position: relative; cursor: text; min-width: 0; }
    .task-cell span {
      display: block; font-size: 13px; line-height: 1;
      padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .task-cell-assignee span, .task-cell-due span {
      font-size: 12px; color: var(--text-muted);
    }
    .task-cell input {
      display: none; width: 100%; box-sizing: border-box;
      background: var(--surface); border: 1px solid var(--accent);
      border-radius: 4px; color: var(--text);
      font-size: 12px; padding: 3px 6px;
    }
    .task-cell input:focus { outline: none; }
    .task-cell.editing span { display: none; }
    .task-cell.editing input { display: block; }

    /* Delete button */
    .task-del {
      background: none; border: none; color: transparent;
      cursor: pointer; font-size: 14px; line-height: 1; padding: 0;
      transition: color 0.1s;
    }
    .task-row:hover .task-del { color: var(--text-dim); }
    .task-del:hover { color: var(--danger) !important; }

    /* Add task row */
    .add-task-row {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 0 8px;
      padding: 0 4px;
      min-height: 32px;
      align-items: center;
    }
    .add-task-trigger {
      font-size: 12px; color: var(--text-dim);
      cursor: pointer; transition: color 0.15s;
    }
    .add-task-trigger:hover { color: var(--accent); }
    .add-task-inline { display: none; }
    .add-task-inline.open { display: grid; grid-template-columns: 1fr 100px 85px auto auto; gap: 5px; align-items: center; margin-top: 2px; padding: 4px 4px 6px; }
    .add-task-inline input {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); font-size: 12px;
      padding: 4px 7px; width: 100%; box-sizing: border-box;
    }
    .add-task-inline input:focus { outline: none; border-color: var(--accent); }

    /* Drawer (campaign edit) */
    .drawer-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200; }
    .drawer-overlay.open { display:block; }
    .drawer { position:fixed;top:0;right:-400px;width:380px;height:100%;background:var(--surface);border-left:1px solid var(--border);z-index:201;display:flex;flex-direction:column;transition:right 0.25s ease; }
    .drawer.open { right:0; }
    .drawer-header { display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border); }
    .drawer-header h2 { font-size:15px;font-weight:600; }
    .drawer-close { background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:20px;line-height:1; }
    .drawer-body { flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px; }
    .drawer-footer { padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content" id="page-content">
        <p style="color:var(--text-muted);">Loading…</p>
      </main>
    </div>
  </div>

  <!-- Campaign edit drawer -->
  <div class="drawer-overlay" id="edit-overlay"></div>
  <div class="drawer" id="edit-drawer">
    <div class="drawer-header">
      <h2>Edit Campaign</h2>
      <button class="drawer-close" onclick="closeEditDrawer()">×</button>
    </div>
    <div class="drawer-body">
      <div class="form-group"><label>Campaign Name</label><input type="text" id="f-name"></div>
      <div class="form-row">
        <div class="form-group">
          <label>Status</label>
          <select id="f-status">
            <option value="draft">Draft</option>
            <option value="active">Active</option>
            <option value="paused">Paused</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="f-type">
            <option value="">Select type</option>
            <option value="PR">PR</option>
            <option value="Social Media">Social Media</option>
            <option value="Google Ads">Google Ads</option>
            <option value="Email">Email</option>
            <option value="SEO">SEO</option>
            <option value="Content">Content</option>
            <option value="Video">Video</option>
            <option value="Multi-channel">Multi-channel</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Start Date</label><input type="date" id="f-start"></div>
        <div class="form-group"><label>End Date</label><input type="date" id="f-end"></div>
      </div>
      <div class="form-group"><label>Budget</label><input type="number" id="f-budget" min="0"></div>
      <div class="form-group"><label>Notes</label><textarea id="f-notes" rows="4"></textarea></div>
    </div>
    <div class="drawer-footer">
      <button class="btn btn-primary" id="edit-save">Save</button>
      <button class="btn btn-ghost" onclick="closeEditDrawer()">Cancel</button>
      <button class="btn btn-danger" style="margin-left:auto;" onclick="deleteCampaign()">Delete</button>
    </div>
  </div>

  <script src="/components/shell.js"></script>
  <script>
    const campaignId = location.pathname.split('/')[2];
    let campaign = null;
    let allTasks = [];

    const STAGES = {
      PR: ['Strategy','Newsroom Research','Angle Development','Draft Release','Internal Review','Client Approval','Media List','Pitch Copy','Pitching','Follow-up','Coverage Tracking','Reporting'],
      default: ['Planning','In Progress','Review','Wrap-up'],
    };
    function getStages(type) { return STAGES[type] || STAGES.default; }

    // ── Load ──────────────────────────────────────────────────────────────────

    async function load() {
      const [campRes, tasksRes] = await Promise.all([
        fetch(`/api/campaigns/${campaignId}`),
        fetch(`/api/campaigns/${campaignId}/tasks`)
      ]);
      if (!campRes.ok) {
        document.getElementById('page-content').innerHTML = '<p style="color:var(--danger);">Campaign not found.</p>';
        return;
      }
      campaign = await campRes.json();
      allTasks = tasksRes.ok ? await tasksRes.json() : [];
      renderShell({ pageId: 'campaigns', title: campaign.name });
      render();
    }

    function render() {
      const stages = getStages(campaign.type);
      const currentStage = campaign.current_stage || 0;
      const pct = Math.round((currentStage / stages.length) * 100);
      const chipClass = { active: 'chip-active', draft: 'chip-draft', paused: 'chip-paused', completed: 'chip-completed' }[campaign.status] || 'chip-draft';
      const statusLabel = campaign.status.charAt(0).toUpperCase() + campaign.status.slice(1);

      const dotsHtml = stages.map((s, i) => {
        const done = i < currentStage;
        const active = i === currentStage;
        return `<div class="progress-dot ${done ? 'done' : active ? 'active' : ''}" title="${s}">${i + 1}</div>`;
      }).join('');

      const sectionsHtml = stages.map((s, i) => {
        const isCurrent = i === currentStage;
        const isDone = i < currentStage;
        const stageTasks = allTasks.filter(t => t.stage_index === i);
        const doneCount = stageTasks.filter(t => t.done).length;
        const taskCountLabel = stageTasks.length ? `${doneCount}/${stageTasks.length}` : '';

        const colHeader = stageTasks.length ? `
          <div class="task-cols">
            <div></div><div>Task</div><div>Assignee</div><div>Due</div><div></div>
          </div>` : '';

        const tasksHtml = stageTasks.map(t => `
          <div class="task-row ${t.done ? 'done' : ''}" id="task-row-${t.id}">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleDone(${t.id}, this.checked)">
            <div class="task-cell task-cell-title" onclick="editCell(this, ${t.id}, 'title')">
              <span>${t.title}</span>
              <input type="text" value="${t.title.replace(/"/g, '&quot;')}"
                onblur="saveField(${t.id}, 'title', this.value)"
                onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape')cancelCell(this.parentElement)">
            </div>
            <div class="task-cell task-cell-assignee" onclick="editCell(this, ${t.id}, 'assignee')">
              <span>${t.assignee || '<span style=color:var(--text-dim)>—</span>'}</span>
              <input type="text" value="${t.assignee || ''}" placeholder="Assignee"
                onblur="saveField(${t.id}, 'assignee', this.value)"
                onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape')cancelCell(this.parentElement)">
            </div>
            <div class="task-cell task-cell-due" onclick="editCell(this, ${t.id}, 'due_date')">
              <span>${t.due_date || '<span style=color:var(--text-dim)>—</span>'}</span>
              <input type="date" value="${t.due_date || ''}"
                onchange="saveField(${t.id}, 'due_date', this.value)"
                onblur="saveField(${t.id}, 'due_date', this.value)"
                onkeydown="if(event.key==='Escape')cancelCell(this.parentElement)">
            </div>
            <button class="task-del" onclick="deleteTask(${t.id})" title="Delete">×</button>
          </div>
        `).join('');

        const badgeHtml = isCurrent
          ? `<span class="stage-badge badge-current">Current</span>`
          : isDone ? `<span class="stage-badge badge-done">Done</span>` : '';

        return `
          <div class="stage-section ${isCurrent ? 'is-current open' : isDone ? 'is-done' : ''}" id="stage-section-${i}">
            <div class="stage-header" onclick="toggleSection(${i})">
              <div class="stage-num">${i + 1}</div>
              <div class="stage-name">${s}</div>
              ${badgeHtml}
              ${taskCountLabel ? `<span class="stage-task-count">${taskCountLabel}</span>` : ''}
              <span class="stage-chevron">▼</span>
            </div>
            <div class="stage-body">
              <div class="task-list">
                ${colHeader}
                ${tasksHtml}
              </div>
              <div class="add-task-row">
                <div></div>
                <div class="add-task-trigger" id="add-trigger-${i}" onclick="showAddForm(${i})">+ Add task</div>
              </div>
              <div class="add-task-inline" id="add-form-${i}">
                <input type="text" id="add-title-${i}" placeholder="Task title…" onkeydown="if(event.key==='Enter')submitTask(${i});if(event.key==='Escape')hideAddForm(${i})">
                <input type="text" id="add-assignee-${i}" placeholder="Assignee">
                <input type="date" id="add-due-${i}">
                <button class="btn btn-primary" style="font-size:12px;padding:4px 10px;white-space:nowrap;" onclick="submitTask(${i})">Add</button>
                <button class="btn btn-ghost" style="font-size:12px;padding:4px 8px;" onclick="hideAddForm(${i})">✕</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('page-content').innerHTML = `
        <div class="board-header">
          <a href="/campaigns" style="color:var(--text-muted);font-size:13px;text-decoration:none;">← Campaigns</a>
          ${campaign.client_name ? `<span style="color:var(--text-dim);">›</span><a href="/clients/${campaign.client_id}/board" style="color:var(--text-muted);font-size:13px;text-decoration:none;">${campaign.client_name}</a>` : ''}
          <h1 style="font-size:20px;font-weight:700;">${campaign.name}</h1>
          <span class="status-chip ${chipClass}">${statusLabel}</span>
          ${campaign.type ? `<span style="font-size:12px;color:var(--text-muted);">${campaign.type}</span>` : ''}
          <div style="flex:1;"></div>
          <button class="btn btn-ghost" style="font-size:12px;" onclick="openEditDrawer()">Edit</button>
        </div>

        <!-- Progress -->
        <div class="progress-track">
          ${currentStage > 0 ? `<button class="btn btn-ghost" style="font-size:12px;white-space:nowrap;" onclick="setStage(${currentStage - 1})">← Back</button>` : ''}
          <div class="progress-center">
            <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;text-align:center;">${stages[currentStage] || 'Complete'} &nbsp;·&nbsp; ${currentStage}/${stages.length} stages</div>
            <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
            <div class="progress-dots">${dotsHtml}</div>
          </div>
          ${currentStage < stages.length ? `<button class="btn btn-primary" style="font-size:12px;white-space:nowrap;" onclick="setStage(${currentStage + 1})">${currentStage + 1 < stages.length ? 'Advance →' : 'Complete ✓'}</button>` : '<span style="font-size:12px;color:var(--success);">All done ✓</span>'}
        </div>

        <!-- Stage sections -->
        <div id="stages-list">${sectionsHtml}</div>
      `;
    }

    // ── Stage toggle ───────────────────────────────────────────────────────────

    function toggleSection(index) {
      const section = document.getElementById(`stage-section-${index}`);
      section.classList.toggle('open');
    }

    // ── Add task ───────────────────────────────────────────────────────────────

    function showAddForm(stageIndex) {
      document.getElementById(`add-trigger-${stageIndex}`).style.display = 'none';
      const form = document.getElementById(`add-form-${stageIndex}`);
      form.classList.add('open');
      document.getElementById(`add-title-${stageIndex}`).focus();
    }
    function hideAddForm(stageIndex) {
      document.getElementById(`add-form-${stageIndex}`).classList.remove('open');
      const trigger = document.getElementById(`add-trigger-${stageIndex}`);
      if (trigger) trigger.style.display = '';
    }

    async function submitTask(stageIndex) {
      const title = document.getElementById(`add-title-${stageIndex}`).value.trim();
      if (!title) return;
      const assignee = document.getElementById(`add-assignee-${stageIndex}`).value.trim();
      const due_date = document.getElementById(`add-due-${stageIndex}`).value;
      hideAddForm(stageIndex);
      await fetch(`/api/campaigns/${campaignId}/tasks`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stage_index: stageIndex, title, assignee: assignee || null, due_date: due_date || null })
      });
      load();
    }

    // ── Toggle done ────────────────────────────────────────────────────────────

    async function toggleDone(taskId, done) {
      const card = document.getElementById(`task-card-${taskId}`);
      if (card) card.classList.toggle('done', done);
      await fetch(`/api/campaigns/${campaignId}/tasks/${taskId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done })
      });
      const task = allTasks.find(t => t.id === taskId);
      if (task) task.done = done ? 1 : 0;
    }

    // ── Per-field inline edit ──────────────────────────────────────────────────

    function editCell(cell, taskId, field) {
      cell.classList.add('editing');
      const input = cell.querySelector('input');
      input.focus();
      if (input.type === 'text') input.select();
    }

    function cancelCell(cell) {
      const task = allTasks.find(t => t.id === parseInt(cell.closest('.task-row').id.replace('task-row-', '')));
      cell.classList.remove('editing');
    }

    async function saveField(taskId, field, value) {
      const task = allTasks.find(t => t.id === taskId);
      if (!task) return;
      if (field === 'title' && !value.trim()) { cancelCell(document.querySelector(`#task-row-${taskId} .task-cell-title`)); return; }
      const sanitized = value.trim ? value.trim() : value;
      if (task[field] === sanitized) { document.querySelectorAll(`#task-row-${taskId} .task-cell`).forEach(c => c.classList.remove('editing')); return; }
      task[field] = sanitized || null;

      const row = document.getElementById(`task-row-${taskId}`);
      if (row) {
        row.querySelectorAll('.task-cell').forEach(c => c.classList.remove('editing'));
        const span = row.querySelector(`.task-cell-${field === 'due_date' ? 'due' : field} span`);
        if (span) span.innerHTML = sanitized || '<span style=color:var(--text-dim)>—</span>';
      }

      await fetch(`/api/campaigns/${campaignId}/tasks/${taskId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [field]: sanitized || null })
      });
    }

    async function deleteTask(taskId) {
      if (!confirm('Delete this task?')) return;
      await fetch(`/api/campaigns/${campaignId}/tasks/${taskId}`, { method: 'DELETE' });
      load();
    }

    // ── Advance / Back ─────────────────────────────────────────────────────────

    async function setStage(index) {
      const stages = getStages(campaign.type);
      const clamped = Math.max(0, Math.min(stages.length, index));
      await fetch(`/api/campaigns/${campaignId}/stage`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stage: clamped })
      });
      campaign.current_stage = clamped;
      render();
    }

    // ── Campaign edit drawer ───────────────────────────────────────────────────

    function openEditDrawer() {
      document.getElementById('f-name').value = campaign.name || '';
      document.getElementById('f-status').value = campaign.status || 'draft';
      document.getElementById('f-type').value = campaign.type || '';
      document.getElementById('f-start').value = campaign.start_date || '';
      document.getElementById('f-end').value = campaign.end_date || '';
      document.getElementById('f-budget').value = campaign.budget || '';
      document.getElementById('f-notes').value = campaign.notes || '';
      document.getElementById('edit-overlay').classList.add('open');
      document.getElementById('edit-drawer').classList.add('open');
    }
    function closeEditDrawer() {
      document.getElementById('edit-overlay').classList.remove('open');
      document.getElementById('edit-drawer').classList.remove('open');
    }
    document.getElementById('edit-overlay').addEventListener('click', closeEditDrawer);

    document.getElementById('edit-save').addEventListener('click', async () => {
      const btn = document.getElementById('edit-save');
      btn.disabled = true; btn.textContent = 'Saving…';
      await fetch(`/api/campaigns/${campaignId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('f-name').value,
          status: document.getElementById('f-status').value,
          type: document.getElementById('f-type').value || null,
          start_date: document.getElementById('f-start').value || null,
          end_date: document.getElementById('f-end').value || null,
          budget: document.getElementById('f-budget').value || null,
          notes: document.getElementById('f-notes').value || null,
        })
      });
      btn.disabled = false; btn.textContent = 'Save';
      closeEditDrawer();
      load();
    });

    async function deleteCampaign() {
      if (!confirm('Delete this campaign?')) return;
      await fetch(`/api/campaigns/${campaignId}`, { method: 'DELETE' });
      window.location.href = '/campaigns';
    }

    load();
  </script>
</body>
</html>
