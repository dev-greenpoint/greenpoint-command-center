<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Profile — Greenpoint</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .profile-grid { grid-template-columns: 1fr; }
    }
    .detail-row {
      display: flex;
      gap: 6px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label {
      color: var(--text-muted);
      width: 120px;
      flex-shrink: 0;
    }
    .checklist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      cursor: pointer;
    }
    .checklist-item:last-child { border-bottom: none; }
    .checklist-item.done { color: var(--text-muted); text-decoration: line-through; }
    .checklist-item input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
    .category-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-dim);
      padding: 10px 0 4px;
    }
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .task-item:last-child { border-bottom: none; }
    .task-item select {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 11px;
      padding: 2px 6px;
      margin-left: auto;
      flex-shrink: 0;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
    }
    .chip-onboarding { background: #3d2a00; color: var(--warning); }
    .chip-active { background: #0d3323; color: var(--success); }
    .chip-inactive { background: var(--surface-2); color: var(--text-muted); }
    .progress-bar {
      height: 4px;
      background: var(--surface-2);
      border-radius: 2px;
      margin: 8px 0 12px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content" id="page-content">
        <p style="color:var(--text-muted);">Loading…</p>
      </main>
    </div>
  </div>

  <script src="/components/shell.js"></script>
  <script>
    const clientId = location.pathname.split('/').pop();

    function avatarColor(name) {
      const palette = ['#5b5fcf','#2e7d32','#8e3a7a','#d4870a','#0277bd','#6a4f00','#00695c','#b71c1c'];
      let h = 0;
      for (let i = 0; i < (name||'').length; i++) h = (name.charCodeAt(i) + ((h << 5) - h)) | 0;
      return palette[Math.abs(h) % palette.length];
    }
    function initials(name) {
      return (name||'').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    }

    function calcEndDate(startDate, months) {
      if (!startDate || !months) return '';
      const d = new Date(startDate);
      d.setMonth(d.getMonth() + parseInt(months));
      return d.toISOString().split('T')[0];
    }

    async function saveEndDate(value) {
      await fetch(`/api/clients/${clientId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ end_date: value })
      });
    }

    async function load() {
      const res = await fetch(`/api/clients/${clientId}/profile`);
      if (!res.ok) { document.getElementById('page-content').innerHTML = '<p style="color:var(--danger);">Client not found.</p>'; return; }
      const { client, checklist, tasks, team, contacts } = await res.json();

      renderShell({ pageId: 'clients', title: client.name });

      // Only show general onboarding items on this page
      const onboardingItems = checklist.filter(i => (i.category || 'general') === 'general');
      const completed = onboardingItems.filter(i => i.completed).length;
      const total = onboardingItems.length;
      const pct = total ? Math.round((completed / total) * 100) : 100;

      const statusClass = client.status === 'active' ? 'chip-active' : client.status === 'onboarding' ? 'chip-onboarding' : 'chip-inactive';
      const statusLabel = client.status.charAt(0).toUpperCase() + client.status.slice(1);

      document.getElementById('page-content').innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
          <a href="/clients" style="color:var(--text-muted);font-size:13px;text-decoration:none;">← Clients</a>
          <h1 style="font-size:20px;font-weight:700;">${client.name}</h1>
          <span class="status-chip ${statusClass}">${statusLabel}</span>
          ${client.industry ? `<span style="font-size:12px;color:var(--text-muted);">${client.industry}</span>` : ''}
          <div style="flex:1;"></div>
          <a href="/clients/${clientId}/board" class="btn btn-ghost" style="font-size:13px;">View Board</a>
          ${client.status === 'onboarding' ? `<button class="btn btn-primary" id="complete-btn" ${pct < 100 ? 'disabled title="Complete all checklist items first"' : ''}>Mark as Active</button>` : ''}
        </div>

        <div class="profile-grid">

          <!-- Left column -->
          <div style="display:flex;flex-direction:column;gap:16px;">

            <!-- Research -->
            ${client.research ? `
            <div class="card">
              <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:10px;">Research</div>
              <p style="font-size:13px;line-height:1.7;color:var(--text);">${client.research}</p>
            </div>` : ''}

            <!-- Services + Details side by side -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;">

              <!-- Services in Scope -->
              <div class="card">
                <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:12px;">Services in Scope</div>
                ${client.services ? `
                <div style="display:flex;flex-direction:column;gap:6px;">
                  ${client.services.split(',').map(s => s.trim()).filter(Boolean).map(s => `
                    <span style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:5px 10px;font-size:12px;font-weight:500;">${s}</span>
                  `).join('')}
                </div>` : '<p style="font-size:13px;color:var(--text-dim);">None selected</p>'}
                ${client.platforms ? `
                <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
                  <div style="font-size:11px;color:var(--text-dim);margin-bottom:6px;">Platforms</div>
                  <div style="display:flex;flex-wrap:wrap;gap:5px;">
                    ${client.platforms.split(',').map(p => p.trim()).filter(Boolean).map(p => `
                      <span style="background:var(--surface-2);border:1px solid var(--border);border-radius:100px;padding:2px 9px;font-size:11px;color:var(--text-muted);">${p}</span>
                    `).join('')}
                  </div>
                </div>` : ''}
              </div>

              <!-- Client Details -->
              <div class="card">
                <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:12px;">Client Details</div>
                ${client.website ? `<div class="detail-row"><span class="detail-label">Website</span><a href="${client.website}" target="_blank" style="color:var(--accent);font-size:13px;">${client.website}</a></div>` : ''}
                ${client.monthly_hours ? `<div class="detail-row"><span class="detail-label">Monthly Hours</span>${client.monthly_hours} hrs</div>` : ''}
                ${client.start_date ? `<div class="detail-row"><span class="detail-label">Start Date</span>${client.start_date}</div>` : ''}
                ${client.campaign_length ? `<div class="detail-row"><span class="detail-label">Campaign Length</span>${client.campaign_length} month${client.campaign_length > 1 ? 's' : ''}</div>` : ''}
                <div class="detail-row">
                  <span class="detail-label">End Date</span>
                  <input type="date" id="end-date-input" value="${client.end_date || calcEndDate(client.start_date, client.campaign_length)}" style="background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:13px;padding:0;cursor:pointer;" onchange="saveEndDate(this.value)">
                </div>
                ${contacts.length ? `
                <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
                  <div style="font-size:11px;color:var(--text-dim);margin-bottom:8px;">Contacts</div>
                  ${contacts.map(c => `
                    <div style="margin-bottom:8px;">
                      <div style="font-size:13px;font-weight:600;">${c.name}${c.role ? ` <span style="font-weight:400;color:var(--text-muted);">· ${c.role}</span>` : ''}</div>
                      ${c.email ? `<div style="font-size:12px;color:var(--text-muted);">${c.email}</div>` : ''}
                      ${c.phone ? `<div style="font-size:12px;color:var(--text-muted);">${c.phone}</div>` : ''}
                    </div>
                  `).join('')}
                </div>` : ''}
                ${client.notes ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;color:var(--text-muted);line-height:1.6;">${client.notes}</div>` : ''}
              </div>

            </div>

          </div>

          <!-- Right: Onboarding Checklist + Team -->
          <div style="display:flex;flex-direction:column;gap:16px;position:sticky;top:24px;align-self:start;">

            <div class="card">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
                <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);">Onboarding</div>
                <span style="font-size:12px;color:var(--text-muted);">${completed}/${total}</span>
              </div>
              <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:${pct}%"></div></div>
              <div id="checklist">
                ${onboardingItems.map(item => `
                  <label class="checklist-item ${item.completed ? 'done' : ''}">
                    <input type="checkbox" data-id="${item.id}" ${item.completed ? 'checked' : ''} onchange="toggleItem(${item.id}, this.checked, this)">
                    ${item.item}
                  </label>
                `).join('')}
              </div>
            </div>

            ${team.length ? `
            <div class="card">
              <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:12px;">Account Team</div>
              <div style="display:flex;flex-direction:column;gap:8px;">
                ${team.map(m => `
                  <div style="display:flex;align-items:center;gap:10px;">
                    <div style="width:30px;height:30px;border-radius:50%;background:${avatarColor(m.name)};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;">${initials(m.name)}</div>
                    <div>
                      <div style="font-size:13px;font-weight:500;">${m.name}</div>
                      ${m.role ? `<div style="font-size:11px;color:var(--text-muted);">${m.role}</div>` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>` : ''}

          </div>

        </div>
      `;

      const completeBtn = document.getElementById('complete-btn');
      if (completeBtn) {
        completeBtn.addEventListener('click', async () => {
          if (!confirm('Mark this client as Active? This completes onboarding.')) return;
          await fetch(`/api/clients/${clientId}/complete-onboarding`, { method: 'POST' });
          load();
        });
      }
    }

    async function toggleItem(itemId, completed, el) {
      await fetch(`/api/clients/${clientId}/checklist/${itemId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      el.closest('.checklist-item').classList.toggle('done', completed);

      // Refresh progress
      const checkboxes = document.querySelectorAll('#checklist input[type=checkbox]');
      const total = checkboxes.length;
      const done = Array.from(checkboxes).filter(c => c.checked).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      document.getElementById('progress-fill').style.width = pct + '%';
      document.querySelector('[style*="flex:1"]')?.nextElementSibling?.removeAttribute('disabled');

      const completeBtn = document.getElementById('complete-btn');
      if (completeBtn) completeBtn.disabled = pct < 100;
    }

    load();
  </script>
</body>
</html>
