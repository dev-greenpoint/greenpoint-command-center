<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Profile — Greenpoint</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .profile-grid { grid-template-columns: 1fr; }
    }
    .detail-row {
      display: flex;
      gap: 6px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label {
      color: var(--text-muted);
      width: 120px;
      flex-shrink: 0;
    }
    .checklist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      cursor: pointer;
    }
    .checklist-item:last-child { border-bottom: none; }
    .checklist-item.done { color: var(--text-muted); text-decoration: line-through; }
    .checklist-item input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
    .category-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-dim);
      padding: 10px 0 4px;
    }
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .task-item:last-child { border-bottom: none; }
    .task-item select {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 11px;
      padding: 2px 6px;
      margin-left: auto;
      flex-shrink: 0;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
    }
    .chip-onboarding { background: #3d2a00; color: var(--warning); }
    .chip-active { background: #0d3323; color: var(--success); }
    .chip-inactive { background: var(--surface-2); color: var(--text-muted); }
    .progress-bar {
      height: 4px;
      background: var(--surface-2);
      border-radius: 2px;
      margin: 8px 0 12px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content" id="page-content">
        <p style="color:var(--text-muted);">Loading…</p>
      </main>
    </div>
  </div>

  <script src="/components/shell.js"></script>
  <script>
    const clientId = location.pathname.split('/').pop();

    function calcEndDate(startDate, months) {
      if (!startDate || !months) return '';
      const d = new Date(startDate);
      d.setMonth(d.getMonth() + parseInt(months));
      return d.toISOString().split('T')[0];
    }

    async function saveEndDate(value) {
      await fetch(`/api/clients/${clientId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ end_date: value })
      });
    }

    async function load() {
      const res = await fetch(`/api/clients/${clientId}/profile`);
      if (!res.ok) { document.getElementById('page-content').innerHTML = '<p style="color:var(--danger);">Client not found.</p>'; return; }
      const { client, checklist, tasks, team, contacts } = await res.json();

      renderShell({ pageId: 'clients', title: client.name });

      const completed = checklist.filter(i => i.completed).length;
      const total = checklist.length;
      const pct = total ? Math.round((completed / total) * 100) : 0;

      // Group checklist by category
      const categories = {};
      checklist.forEach(item => {
        const cat = item.category || 'general';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(item);
      });

      const statusClass = client.status === 'active' ? 'chip-active' : client.status === 'onboarding' ? 'chip-onboarding' : 'chip-inactive';
      const statusLabel = client.status.charAt(0).toUpperCase() + client.status.slice(1);

      document.getElementById('page-content').innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
          <a href="/clients" style="color:var(--text-muted);font-size:13px;text-decoration:none;">← Clients</a>
          <h1 style="font-size:20px;font-weight:700;">${client.name}</h1>
          <span class="status-chip ${statusClass}">${statusLabel}</span>
          ${client.industry ? `<span style="font-size:12px;color:var(--text-muted);">${client.industry}</span>` : ''}
          <div style="flex:1;"></div>
          <a href="/clients/${clientId}/board" class="btn btn-ghost" style="font-size:13px;">View Board</a>
          ${client.status === 'onboarding' ? `<button class="btn btn-primary" id="complete-btn" ${pct < 100 ? 'disabled title="Complete all checklist items first"' : ''}>Mark as Active</button>` : ''}
        </div>

        <div class="profile-grid">

          <!-- Left: Services + Details + Research + Tasks -->
          <div style="display:flex;flex-direction:column;gap:16px;">

            ${client.services ? `
            <div class="card">
              <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:12px;">Services in Scope</div>
              <div style="display:flex;flex-wrap:wrap;gap:8px;">
                ${client.services.split(',').map(s => s.trim()).filter(Boolean).map(s => `
                  <span style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:5px 12px;font-size:13px;font-weight:500;">${s}</span>
                `).join('')}
              </div>
            </div>` : ''}

            ${team.length ? `
            <div class="card">
              <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:12px;">Team</div>
              <div style="display:flex;flex-wrap:wrap;gap:8px;">
                ${team.map(m => `
                  <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px;">
                    <div style="font-size:13px;font-weight:500;">${m.name}</div>
                    ${m.role ? `<div style="font-size:11px;color:var(--text-muted);">${m.role}</div>` : ''}
                  </div>
                `).join('')}
              </div>
            </div>` : ''}

            ${contacts.length ? `
            <div class="card">
              <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:12px;">Client Contacts</div>
              <div style="display:flex;flex-direction:column;gap:10px;">
                ${contacts.map(c => `
                  <div style="display:flex;flex-direction:column;gap:2px;">
                    <div style="font-size:13px;font-weight:600;">${c.name}${c.role ? ` <span style="font-weight:400;color:var(--text-muted);">· ${c.role}</span>` : ''}</div>
                    ${c.email ? `<div style="font-size:12px;color:var(--text-muted);">${c.email}</div>` : ''}
                    ${c.phone ? `<div style="font-size:12px;color:var(--text-muted);">${c.phone}</div>` : ''}
                  </div>
                `).join('<hr style="border:none;border-top:1px solid var(--border);">')}
              </div>
            </div>` : ''}

            <div class="card">
              <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:12px;">Client Details</div>
              ${client.website ? `<div class="detail-row"><span class="detail-label">Website</span><a href="${client.website}" target="_blank" style="color:var(--accent);">${client.website}</a></div>` : ''}
              ${client.contact_name ? `<div class="detail-row"><span class="detail-label">Contact</span>${client.contact_name}</div>` : ''}
              ${client.contact_email ? `<div class="detail-row"><span class="detail-label">Email</span>${client.contact_email}</div>` : ''}
              ${client.contact_phone ? `<div class="detail-row"><span class="detail-label">Phone</span>${client.contact_phone}</div>` : ''}
              ${client.start_date ? `<div class="detail-row"><span class="detail-label">Start Date</span>${client.start_date}</div>` : ''}
              ${client.campaign_length ? `<div class="detail-row"><span class="detail-label">Campaign Length</span>${client.campaign_length} month${client.campaign_length > 1 ? 's' : ''}</div>` : ''}
              <div class="detail-row">
                <span class="detail-label">End Date</span>
                <input type="date" id="end-date-input" value="${client.end_date || calcEndDate(client.start_date, client.campaign_length)}" style="background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:13px;padding:0;cursor:pointer;" onchange="saveEndDate(this.value)">
              </div>
              ${client.notes ? `<div class="detail-row"><span class="detail-label">Notes</span>${client.notes}</div>` : ''}
            </div>

            ${client.research ? `
            <div class="card">
              <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:10px;">Research</div>
              <p style="font-size:13px;line-height:1.7;color:var(--text);">${client.research}</p>
            </div>` : ''}

            ${tasks.length ? `
            <div class="card">
              <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:12px;">Tasks (${tasks.length})</div>
              ${tasks.map(t => `
                <div class="task-item">
                  <span style="font-size:11px;color:var(--text-dim);width:80px;flex-shrink:0;">${t.service || ''}</span>
                  <span>${t.title}</span>
                  <select data-task-id="${t.id}" onchange="updateTask(${t.id}, this.value)">
                    <option value="todo" ${t.status==='todo'?'selected':''}>To Do</option>
                    <option value="in_progress" ${t.status==='in_progress'?'selected':''}>In Progress</option>
                    <option value="done" ${t.status==='done'?'selected':''}>Done</option>
                  </select>
                </div>
              `).join('')}
            </div>` : ''}

          </div>

          <!-- Right: Onboarding Checklist -->
          <div class="card" style="position:sticky;top:24px;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
              <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);">Onboarding</div>
              <span style="font-size:12px;color:var(--text-muted);">${completed}/${total}</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:${pct}%"></div></div>

            <div id="checklist">
              ${Object.entries(categories).map(([cat, items]) => `
                ${cat !== 'general' ? `<div class="category-label">${cat}</div>` : ''}
                ${items.map(item => `
                  <label class="checklist-item ${item.completed ? 'done' : ''}">
                    <input type="checkbox" data-id="${item.id}" ${item.completed ? 'checked' : ''} onchange="toggleItem(${item.id}, this.checked, this)">
                    ${item.item}
                  </label>
                `).join('')}
              `).join('')}
            </div>
          </div>

        </div>
      `;

      const completeBtn = document.getElementById('complete-btn');
      if (completeBtn) {
        completeBtn.addEventListener('click', async () => {
          if (!confirm('Mark this client as Active? This completes onboarding.')) return;
          await fetch(`/api/clients/${clientId}/complete-onboarding`, { method: 'POST' });
          load();
        });
      }
    }

    async function toggleItem(itemId, completed, el) {
      await fetch(`/api/clients/${clientId}/checklist/${itemId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      el.closest('.checklist-item').classList.toggle('done', completed);

      // Refresh progress
      const checkboxes = document.querySelectorAll('#checklist input[type=checkbox]');
      const total = checkboxes.length;
      const done = Array.from(checkboxes).filter(c => c.checked).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      document.getElementById('progress-fill').style.width = pct + '%';
      document.querySelector('[style*="flex:1"]')?.nextElementSibling?.removeAttribute('disabled');

      const completeBtn = document.getElementById('complete-btn');
      if (completeBtn) completeBtn.disabled = pct < 100;
    }

    async function updateTask(taskId, status) {
      await fetch(`/api/tasks/${taskId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
    }

    load();
  </script>
</body>
</html>
