<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strategies — Greenpoint</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .page-title { font-size: 20px; font-weight: 700; }

    /* ── Filter tabs ── */
    .filter-bar {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .filter-btn {
      padding: 8px 18px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      cursor: pointer;
      transition: color 0.15s;
      white-space: nowrap;
    }
    .filter-btn:hover { color: var(--text); }
    .filter-btn.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
    .filter-count {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--surface-2); border-radius: 100px;
      font-size: 10px; font-weight: 700;
      padding: 1px 6px; margin-left: 5px;
      color: var(--text-muted);
    }
    .filter-btn.active .filter-count { background: var(--accent); color: #000; }

    /* ── Strategy cards grid ── */
    .strat-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .strat-card {
      display: flex;
      flex-direction: column;
      padding: 18px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, background 0.15s;
      min-width: 0;
    }
    .strat-card:hover { border-color: var(--accent); background: var(--surface-2); }

    .strat-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .strat-client {
      font-size: 10px; color: var(--text-dim); font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em;
      display: flex; align-items: center; gap: 5px;
    }
    .strat-client-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
    }
    .strat-title {
      font-size: 15px; font-weight: 700; line-height: 1.35;
      margin-bottom: 4px;
    }
    .strat-card-footer {
      margin-top: auto;
      padding-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
    }
    .strat-updated { font-size: 11px; color: var(--text-dim); }
    .strat-open {
      font-size: 11px; color: var(--text-muted);
      display: flex; align-items: center; gap: 3px;
    }
    .strat-open::after { content: '→'; }

    /* ── Status pills ── */
    .status-pill {
      display: inline-flex; align-items: center;
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .05em; padding: 2px 8px; border-radius: 100px;
    }
    .sp-draft     { background: var(--surface-2); color: var(--text-muted); }
    .sp-pending   { background: #3d2a00; color: var(--warning); }
    .sp-approved  { background: #0d3323; color: var(--success); }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 60px 24px;
      color: var(--text-dim); font-size: 13px;
    }
    .empty-icon { font-size: 32px; margin-bottom: 12px; }
    .empty-title { font-size: 15px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      z-index: 200; display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: calc(var(--radius) * 1.5); padding: 28px;
      width: 440px; max-width: 96vw;
    }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
    .form-row { margin-bottom: 16px; }
    .form-label { font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .05em; color: var(--text-muted); margin-bottom: 6px; display: block; }
    .form-input, .form-select {
      width: 100%; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 13px;
      padding: 9px 12px; font-family: var(--font); box-sizing: border-box;
      transition: border-color 0.15s;
    }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--accent); }
    .form-select option { background: var(--surface); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content" id="page-content">
        <p style="color:var(--text-muted);">Loading…</p>
      </main>
    </div>
  </div>

  <!-- New Strategy Modal -->
  <div class="modal-overlay" id="new-strat-overlay">
    <div class="modal">
      <div class="modal-title">New Strategy</div>
      <div class="form-row">
        <label class="form-label">Client</label>
        <select class="form-select" id="ns-client"></select>
      </div>
      <div class="form-row">
        <label class="form-label">Title</label>
        <input class="form-input" id="ns-title" type="text" placeholder="e.g. Q3 2026 Campaign Strategy">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="ns-create-btn" onclick="createStrategy()">Create & Open Builder</button>
      </div>
    </div>
  </div>

  <script src="/components/shell.js"></script>
  <script>
    let allStrategies = [];
    let activeFilter = 'all';

    async function load() {
      renderShell({ pageId: 'strategies', title: 'Strategies' });

      const res = await fetch('/api/strategies');
      allStrategies = res.ok ? await res.json() : [];

      renderPage();
    }

    function renderPage() {
      const el = document.getElementById('page-content');

      const counts = {
        all: allStrategies.length,
        draft: allStrategies.filter(s => s.status === 'draft').length,
        awaiting_approval: allStrategies.filter(s => s.status === 'awaiting_approval').length,
        approved: allStrategies.filter(s => s.status === 'approved').length,
      };

      const filtered = activeFilter === 'all'
        ? allStrategies
        : allStrategies.filter(s => s.status === activeFilter);

      el.innerHTML = `
        <div class="page-header">
          <div class="page-title">Strategies</div>
          <button class="btn btn-primary" onclick="openModal()">+ New Strategy</button>
        </div>

        <div class="filter-bar">
          ${filterBtn('all',               'All',               counts.all)}
          ${filterBtn('draft',             'Draft',             counts.draft)}
          ${filterBtn('awaiting_approval', 'Awaiting Approval', counts.awaiting_approval)}
          ${filterBtn('approved',          'Approved',          counts.approved)}
        </div>

        <div class="strat-list" id="strat-list">
          ${filtered.length ? filtered.map(stratRowHtml).join('') : emptyState()}
        </div>
      `;
    }

    function filterBtn(id, label, count) {
      return `<button class="filter-btn ${activeFilter === id ? 'active' : ''}"
        onclick="setFilter('${id}')">
        ${escHtml(label)}<span class="filter-count">${count}</span>
      </button>`;
    }

    function stratRowHtml(s) {
      const statusMap = {
        draft:             { cls: 'sp-draft',    label: 'Draft' },
        awaiting_approval: { cls: 'sp-pending',  label: 'Awaiting Approval' },
        approved:          { cls: 'sp-approved', label: 'Approved' },
      };
      const { cls, label } = statusMap[s.status] || statusMap.draft;
      const updated = s.updated_at
        ? new Date(s.updated_at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' })
        : '—';

      return `
        <a class="strat-card" href="/strategy/${s.id}">
          <div class="strat-card-top">
            <div class="strat-client">
              <span class="strat-client-dot"></span>
              ${escHtml(s.client_name || 'Unknown Client')}
            </div>
            <span class="status-pill ${cls}">${label}</span>
          </div>
          <div class="strat-title">${escHtml(s.title)}</div>
          <div class="strat-card-footer">
            <span class="strat-updated">Updated ${updated}</span>
            <span class="strat-open">Open</span>
          </div>
        </a>`;
    }

    function emptyState() {
      const msgs = {
        all:               { icon: '◐', title: 'No strategies yet', sub: 'Create your first strategy to get started.' },
        draft:             { icon: '○', title: 'No drafts', sub: 'Strategies in progress will appear here.' },
        awaiting_approval: { icon: '◇', title: 'Nothing awaiting approval', sub: 'Strategies submitted for review will appear here.' },
        approved:          { icon: '◈', title: 'No approved strategies', sub: 'Approved strategies will appear here.' },
      };
      const m = msgs[activeFilter] || msgs.all;
      return `<div class="empty-state" style="grid-column:1/-1;">
        <div class="empty-icon">${m.icon}</div>
        <div class="empty-title">${m.title}</div>
        <div>${m.sub}</div>
      </div>`;
    }

    function setFilter(f) {
      activeFilter = f;
      renderPage();
    }

    // ── Modal ──────────────────────────────────────────────────────────────────

    async function openModal() {
      // Load clients
      const res = await fetch('/api/clients');
      const clients = res.ok ? await res.json() : [];
      const sel = document.getElementById('ns-client');
      sel.innerHTML = clients.length
        ? clients.map(c => `<option value="${c.id}">${escAttr(c.name)}</option>`).join('')
        : '<option value="">No clients yet</option>';
      document.getElementById('ns-title').value = '';
      document.getElementById('new-strat-overlay').classList.add('open');
      document.getElementById('ns-title').focus();
    }

    function closeModal() {
      document.getElementById('new-strat-overlay').classList.remove('open');
    }

    async function createStrategy() {
      const clientId = document.getElementById('ns-client').value;
      const title    = document.getElementById('ns-title').value.trim();
      if (!clientId) return;

      const btn = document.getElementById('ns-create-btn');
      btn.disabled = true;
      btn.textContent = 'Creating…';

      const res = await fetch('/api/strategies', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ client_id: clientId, title: title || 'Untitled Strategy' }),
      });
      const data = await res.json();
      window.location = `/strategy/${data.id}`;
    }

    // Close overlay on backdrop click
    document.getElementById('new-strat-overlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });

    // ── Utils ──────────────────────────────────────────────────────────────────

    function escHtml(str) {
      return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function escAttr(str) {
      return (str || '').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    load();
  </script>
</body>
</html>
