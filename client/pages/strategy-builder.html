<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strategy Builder — Greenpoint</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/strategy-blocks.css">
  <style>
    /* ── Page header ── */
    .strategy-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .strategy-title-input {
      width: 100%;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text);
      font-size: 22px;
      font-weight: 700;
      padding: 2px 0;
      transition: border-color 0.2s;
      font-family: var(--font);
    }
    .strategy-title-input:focus { outline: none; border-bottom-color: var(--accent); }
    .strategy-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .strategy-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .save-indicator { font-size: 11px; color: var(--text-dim); }

    /* ── Status pill ── */
    .status-pill {
      display: inline-flex; align-items: center;
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .05em; padding: 3px 10px; border-radius: 100px;
    }
    .sp-draft     { background: var(--surface-2); color: var(--text-muted); }
    .sp-pending   { background: #3d2a00; color: var(--warning); }
    .sp-published { background: #0d3323; color: var(--success); }

    /* ── Builder layout ── */
    .sb-layout {
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 0;
      align-items: start;
    }

    /* ── Section nav ── */
    .sb-nav {
      border-right: 1px solid var(--border);
      padding: 0 12px 0 0;
      position: sticky;
      top: 0;
      max-height: calc(100vh - 140px);
      overflow-y: auto;
    }
    .sb-nav-section-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: var(--text-dim);
      padding: 12px 10px 6px;
    }
    .sb-nav-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: var(--radius);
      cursor: pointer;
      margin-bottom: 1px;
      border-left: 2px solid transparent;
      transition: background 0.1s;
      position: relative;
    }
    .sb-nav-item:hover { background: var(--surface-2); }
    .sb-nav-item.active {
      background: var(--surface-2);
      border-left-color: var(--accent);
    }
    .sb-nav-item.inactive { opacity: 0.45; }
    .sb-nav-label {
      font-size: 12px; font-weight: 500; flex: 1;
      min-width: 0; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .sb-nav-tick { font-size: 10px; color: var(--success); flex-shrink: 0; }
    .sb-nav-edit {
      display: none; background: none; border: none;
      color: var(--text-dim); cursor: pointer; font-size: 11px;
      padding: 0 2px; line-height: 1; flex-shrink: 0;
    }
    .sb-nav-item:hover .sb-nav-edit,
    .sb-nav-subtab-item:hover .sb-nav-edit { display: block; }
    .sb-nav-rename {
      flex: 1; background: var(--surface);
      border: 1px solid var(--accent); border-radius: 4px;
      color: var(--text); font-size: 12px; padding: 2px 6px;
    }
    .sb-nav-rename:focus { outline: none; }
    .sb-nav-drag {
      color: var(--text-dim); font-size: 12px; cursor: grab; flex-shrink: 0;
      opacity: 0; transition: opacity 0.1s;
    }
    .sb-nav-item:hover .sb-nav-drag,
    .sb-nav-subtab-item:hover .sb-nav-drag { opacity: 1; }

    /* ── Sub-tabs (nav) ── */
    .sb-nav-subtabs { margin: 0 0 4px 18px; border-left: 1px solid var(--border); padding-left: 8px; }
    .sb-nav-subtab-item {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 8px; border-radius: var(--radius);
      cursor: pointer; margin-bottom: 1px; font-size: 12px;
    }
    .sb-nav-subtab-item:hover { background: var(--surface-2); }
    .sb-nav-subtab-item.active { background: var(--surface-2); color: var(--accent); }
    .sb-nav-subtab-item.inactive { opacity: 0.45; }
    .sb-nav-add-subtab {
      font-size: 11px; color: var(--text-dim); cursor: pointer;
      padding: 4px 8px; margin: 2px 0 6px 18px;
    }
    .sb-nav-add-subtab:hover { color: var(--accent); }

    /* ── Section toggle ── */
    .section-toggle {
      width: 28px; height: 16px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 8px; flex-shrink: 0;
      position: relative; cursor: pointer; transition: background 0.2s;
    }
    .section-toggle::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--text-dim); transition: left 0.2s, background 0.2s;
    }
    .section-toggle.on { background: var(--accent); border-color: var(--accent); }
    .section-toggle.on::after { left: 14px; background: #fff; }

    /* ── Section content ── */
    .sb-content { padding: 0 0 60px 28px; }
    .sb-content-title-wrap { margin-bottom: 16px; }
    .sb-content-title {
      font-size: 20px; font-weight: 700; color: var(--text);
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; width: fit-content;
    }
    .sb-content-title:hover .sb-rename-icon { opacity: 1; }
    .sb-rename-icon {
      font-size: 11px; color: var(--text-dim);
      opacity: 0; transition: opacity 0.15s;
    }
    .sb-content-title-input {
      font-size: 20px; font-weight: 700;
      background: none; border: none;
      border-bottom: 2px solid var(--accent);
      color: var(--text); font-family: var(--font);
      padding: 0; width: 100%;
    }
    .sb-content-title-input:focus { outline: none; }
    .sb-hint { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }

    /* ── Sub-tab strip (content area) ── */
    .sb-subtab-strip { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
    .sb-subtab-pill {
      padding: 5px 14px; border-radius: 100px; font-size: 12px; font-weight: 500;
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted);
      cursor: pointer; font-family: var(--font);
    }
    .sb-subtab-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── Textarea / preview ── */
    .section-textarea {
      width: 100%; min-height: 200px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-size: 13px; line-height: 1.7; padding: 14px 16px;
      font-family: var(--font); resize: vertical;
      box-sizing: border-box; transition: border-color 0.15s;
    }
    .section-textarea:focus { outline: none; border-color: var(--accent); }
    .section-textarea::placeholder { color: var(--text-dim); }

    .hidden { display: none !important; }

    .section-preview {
      min-height: 100px; padding: 14px 16px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 13px;
      line-height: 1.75; color: var(--text);
      cursor: text; transition: border-color 0.15s;
    }
    .section-preview:hover { border-color: var(--accent); }
    .section-preview h1,.section-preview h2,.section-preview h3 {
      font-size: 13px; font-weight: 700; margin: 14px 0 5px;
    }
    .section-preview h1:first-child,.section-preview h2:first-child,.section-preview h3:first-child { margin-top: 0; }
    .section-preview p { margin: 0 0 8px; }
    .section-preview p:last-child { margin-bottom: 0; }
    .section-preview ul,.section-preview ol { margin: 0 0 8px; padding-left: 18px; }
    .section-preview li { margin-bottom: 3px; }
    .section-preview strong { font-weight: 700; }
    .section-preview em { font-style: italic; color: var(--text-muted); }

    /* ── Blocks ── */
    .sb-blocks { display: flex; flex-direction: column; gap: 14px; margin-bottom: 14px; }
    .sb-block {
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px 14px 14px; background: var(--surface);
    }
    .sb-block-toolbar {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px; font-size: 11px; color: var(--text-dim);
    }
    .sb-block-drag { cursor: grab; }
    .sb-block-type { flex: 1; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
    .sb-block-remove {
      background: none; border: none; color: var(--text-dim); cursor: pointer;
      font-size: 13px; padding: 2px 4px;
    }
    .sb-block-remove:hover { color: var(--danger); }

    /* ── Add block menu ── */
    .sb-add-block-wrap { position: relative; margin-bottom: 16px; }
    .sb-add-block-menu {
      position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      display: flex; flex-direction: column; min-width: 160px; overflow: hidden;
    }
    .sb-add-block-menu button {
      background: none; border: none; text-align: left; padding: 9px 14px;
      font-size: 13px; color: var(--text); cursor: pointer; font-family: var(--font);
    }
    .sb-add-block-menu button:hover { background: var(--surface-2); color: var(--accent); }

    /* ── Image block editor ── */
    .sb-image-editor-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .sb-image-layout-label { font-size: 11px; color: var(--text-dim); }
    .sb-image-layout {
      background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); font-size: 12px; padding: 4px 8px;
    }
    .sb-image-thumbs { display: flex; flex-wrap: wrap; gap: 10px; }
    .sb-image-thumb { position: relative; width: 100px; height: 72px; }
    .sb-image-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
    .sb-image-thumb button {
      position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
      border-radius: 50%; background: var(--danger); color: #fff; border: none;
      cursor: pointer; font-size: 11px; line-height: 1;
    }
    .sb-empty-note { font-size: 12px; color: var(--text-dim); }

    /* ── Card grid editor ── */
    .sb-cg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .sb-cg-card {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 10px;
      background: var(--surface-2); display: flex; flex-direction: column; gap: 8px;
    }
    .sb-cg-card-toolbar { display: flex; justify-content: space-between; align-items: center; }
    .sb-cg-card-toolbar button {
      background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 12px;
    }
    .sb-cg-card-toolbar button:hover { color: var(--danger); }
    .sb-cg-title-input {
      background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
      color: var(--text); font-size: 13px; font-weight: 600; padding: 6px 8px; font-family: var(--font);
    }
    .sb-cg-body-input {
      background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
      color: var(--text); font-size: 12px; padding: 6px 8px; font-family: var(--font);
      min-height: 70px; resize: vertical;
    }

    /* ── Gantt block editor ── */
    .sb-gantt-rows-editor { display: flex; flex-direction: column; gap: 8px; }
    .sb-gantt-row-editor {
      display: grid; grid-template-columns: 16px 1fr 140px 140px 24px; gap: 8px; align-items: center;
    }
    .sb-gantt-row-editor input[type="text"], .sb-gantt-row-editor input[type="date"] {
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px;
      color: var(--text); font-size: 12px; padding: 6px 8px; font-family: var(--font);
    }
    .sb-gantt-row-editor button {
      background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 12px;
    }
    .sb-gantt-row-editor button:hover { color: var(--danger); }
    .sb-gantt-notes-input {
      grid-column: 2 / 5; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); font-size: 12px; padding: 6px 8px;
      font-family: var(--font); min-height: 40px; resize: vertical;
    }
    .sb-gantt-preview { margin-top: 16px; padding: 16px; background: var(--surface-2); border-radius: var(--radius); }

    /* ── Generate button ── */
    .sb-footer {
      display: flex; align-items: center;
      justify-content: flex-end; margin-top: 10px;
    }
    .btn-generate {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; padding: 6px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text-muted);
      cursor: pointer; transition: border-color 0.15s, color 0.15s;
      font-family: var(--font);
    }
    .btn-generate:hover { border-color: var(--accent); color: var(--text); }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-generate .spinner {
      display: none; width: 12px; height: 12px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    .btn-generate.loading .spinner { display: block; }
    .btn-generate.loading .gen-icon { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty state ── */
    .sb-empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 300px; color: var(--text-dim);
      font-size: 13px; text-align: center; gap: 8px;
    }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 16px;
      font-size: 13px; color: var(--text);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 9999;
      display: flex; align-items: center; gap: 10px;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.25s, transform 0.25s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast-icon { color: var(--success); font-size: 16px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content" id="page-content">
        <p style="color:var(--text-muted);">Loading…</p>
      </main>
    </div>
  </div>

  <div class="toast" id="toast">
    <span class="toast-icon">✓</span>
    <span id="toast-msg"></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script src="/components/shell.js"></script>
  <script src="/components/section-defs.js"></script>
  <script src="/components/strategy-render.js"></script>
  <script>
    const strategyId = location.pathname.split('/')[2];
    let strategy = null;
    let docType = 'strategy';   // 'strategy' | 'workshop' — controls which sections the nav offers
    let sections = {};          // id -> normalized { blocks:[...] } | { subtabs:[...] }
    let sectionLabels = {};
    let activeSections = [];
    let currentSectionId = null;
    let currentSubtabId = null;
    let saveTimer = null;
    let pendingUploadTarget = null;

    const TEMPLATES = {
      overview: `## Background\n_Who is the client, what do they do, and why is this campaign happening now?_\n\n## Situation\n_What's the current landscape — market context, competitors, and timing?_\n\n## Objectives\n_What does success look like? Define 2–3 clear outcomes._\n\n- Objective one\n- Objective two\n- Objective three`,
      strategy: `## Strategic Approach\n_In one paragraph, describe the overarching strategy — the big idea that holds everything together._\n\n## Strategic Pillars\n\n**Pillar One**: Describe the first pillar and why it matters.\n\n**Pillar Two**: Describe the second pillar and why it matters.\n\n**Pillar Three**: Describe the third pillar and why it matters.`,
      audiences: `**Primary Audience**: Describe the primary target — demographics, mindset, what they care about.\n\n**Secondary Audience**: Describe the secondary target — who else are we reaching and why.\n\n**Media Audience**: The journalists, editors, and publications we are trying to influence.`,
      messages: `1. First key message\n   The core idea we want every audience member to walk away with.\n\n2. Second key message\n   Supporting message that reinforces the first.\n\n3. Third key message\n   A proof point, differentiator, or emotional hook.`,
      tactical_plan: `## Channel Mix\n_Overview of the channels we are activating and how they work together._\n\n- PR Campaigns\n- Social Media\n- Content\n- Events\n\n## Phasing\n\n**Phase 1 — Foundation**: Set up, brief, strategy, assets.\n\n**Phase 2 — Launch**: Campaign activation, pitching, posting.\n\n**Phase 3 — Sustain**: Follow-up, monitoring, reporting.`,
      pr: `## Campaign Angle One\n_Describe the story angle, why it's newsworthy, and the hook._\n\n- Target media category / publication type\n- Target media category / publication type\n\n## Campaign Angle Two\n_Describe the second angle._\n\n- Target media category / publication type`,
      social: `## Platforms\n_Which platforms are we active on and why?_\n\n- Platform one — rationale\n- Platform two — rationale\n\n## Content Approach\n_How are we showing up — tone, style, format?_\n\n## Posting Cadence\n\n**Platform One**: X posts per week — content type, timing.\n\n**Platform Two**: X posts per week — content type, timing.`,
      content: `## Content Pillars\n\n### Pillar One — [Name]\n_What is this pillar about and what content does it produce?_\n\n- Content idea\n- Content idea\n\n### Pillar Two — [Name]\n_What is this pillar about?_\n\n- Content idea\n- Content idea\n\n### Pillar Three — [Name]\n_Brand voice / lifestyle / culture content._\n\n- Content idea\n- Content idea`,
      events: `## Events & Activations\n_What events or activations are planned and what is the objective of each?_\n\n**Event One**: Description, format, timing, expected outcomes.\n\n**Event Two**: Description, format, timing, expected outcomes.\n\n## Display Suite / Showroom\n_Is there a permanent or semi-permanent activation space to leverage?_`,
      partnerships: `## Partnership Targets\n\n**Partner One**: Who they are, why they're a fit, what the collaboration looks like.\n\n**Partner Two**: Who they are, why they're a fit, what the collaboration looks like.\n\n## Influencer Strategy\n_Are we working with influencers? What tier, what categories, what brief?_\n\n- Influencer category / tier\n- Content format / brief direction`,
      paid: `## Paid Strategy Overview\n_What role does paid media play in this campaign?_\n\n## Platforms & Budget\n\n**Platform One**: Objective, budget range, targeting approach, ad format.\n\n**Platform Two**: Objective, budget range, targeting approach, ad format.\n\n## Targeting\n\n- Audience segment\n- Retargeting approach\n- Lookalike strategy`,
      design: `## Design Direction\n_Describe the visual direction — mood, aesthetic, references._\n\n## Brand Assets\n_What assets exist and what needs to be created?_\n\n- Asset one\n- Asset two\n\n## Creative Deliverables\n\n**Deliverable One**: Format, specs, usage, timeline.\n\n**Deliverable Two**: Format, specs, usage, timeline.`,
      email: `## Segmentation\n_How is the database segmented?_\n\n## Sequences\n\n**Sequence One**: Trigger, cadence, goal.\n\n**Sequence Two**: Trigger, cadence, goal.`,
      moodboard: `## Visual Direction\n_Describe the mood, aesthetic, and references._\n\n## Colour Palette\n\n## Typography`,
      measurement: `## Key Metrics\n\n**Metric One**: What we're measuring and why.\n\n**Metric Two**: What we're measuring and why.\n\n## Targets\n\n- Target one\n- Target two\n- Target three\n\n## Reporting Cadence\n\n- Monthly PR update — coverage log, metrics, recommendations\n- Quarterly report — full campaign performance review`,
      budget: `## Budget Breakdown\n\n- Line item one: amount — what it covers\n- Line item two: amount — what it covers\n- Line item three: amount — what it covers\n\n## Total\n_Total budget and any assumptions._`,
      agenda: `1. Welcome & Introductions (10 min)\n   Who's in the room and what we're here to do.\n\n2. Agenda Item (X min)\n   What happens and who leads it.\n\n3. Agenda Item (X min)\n   What happens and who leads it.\n\n4. Wrap-up & Next Steps (10 min)`,
      discovery: `## Brand & Positioning\n\n- Question one\n- Question two\n\n## Audience & Market\n\n- Question one\n- Question two\n\n## Goals & Success\n\n- Question one\n- Question two`,
      immersion: `**Stage One — Discover**: What happens and what it uncovers.\n\n**Stage Two — Define**: What happens and what it uncovers.\n\n**Stage Three — Align**: What happens and what it uncovers.`,
      next_steps: `- Action one: owner, due date\n- Action two: owner, due date\n- Action three: owner, due date`,
    };

    function getLabelFor(id) {
      return sectionLabels[id] || SECTION_DEFS.find(d => d.id === id)?.label || id;
    }
    function getHintFor(id) {
      return SECTION_DEFS.find(d => d.id === id)?.hint || '';
    }
    function getSection(id) {
      if (!sections[id]) sections[id] = { blocks: [] };
      return sections[id];
    }
    function hasContentFor(id) {
      return sectionHasContent(sections[id] || { blocks: [] });
    }
    function blockKey(topId, subId, index) {
      return `${topId}::${subId || ''}::${index}`;
    }
    function getBlockRef(topId, subId, index) {
      const sec = getSection(topId);
      const blocks = subId ? (sec.subtabs || []).find(s => s.id === subId)?.blocks : sec.blocks;
      return blocks ? blocks[index] : null;
    }
    function blockTypeLabel(type) {
      return { richtext: 'Text', image: 'Image', 'card-grid': 'Card Grid', gantt: 'Gantt / Timeline' }[type] || type;
    }

    // ── Load ──────────────────────────────────────────────────────────────────

    async function load() {
      const res = await fetch(`/api/strategies/${strategyId}`);
      if (!res.ok) {
        document.getElementById('page-content').innerHTML = '<p style="color:var(--danger);">Strategy not found.</p>';
        return;
      }
      strategy = await res.json();
      docType = strategy.doc_type === 'workshop' ? 'workshop' : 'strategy';
      const rawSections = strategy.sections ? JSON.parse(strategy.sections) : {};
      sectionLabels = rawSections._labels || {};
      sections = {};
      for (const [id, raw] of Object.entries(rawSections)) {
        if (id === '_labels') continue;
        sections[id] = normalizeSection(raw);
      }
      activeSections = strategy.active_sections ? JSON.parse(strategy.active_sections) : [...DEFAULT_ACTIVE];
      currentSectionId = activeSections[0] || sectionDefsForDocType(docType)[0].id;
      currentSubtabId = null;
      renderShell({ pageId: 'clients', title: strategy.title });
      render();
    }

    // ── Render ────────────────────────────────────────────────────────────────

    function render() {
      const chipMap = {
        draft:             { cls: 'sp-draft',    label: 'Draft' },
        awaiting_approval: { cls: 'sp-pending',  label: 'Awaiting Approval' },
        approved:          { cls: 'sp-published', label: 'Approved' },
      };
      const { cls: chipClass, label: chipLabel } = chipMap[strategy.status] || chipMap.draft;
      const statusActions = {
        draft: `<button class="btn btn-primary" style="font-size:12px;" onclick="submitForApproval()">Submit for Approval</button>`,
        awaiting_approval: `
          <button class="btn btn-ghost" style="font-size:12px;" onclick="copyShareLink()">Copy Link</button>
          <button class="btn btn-ghost" style="font-size:12px;" onclick="viewShared()">View</button>
          <button class="btn btn-primary" style="font-size:12px;" onclick="approve()">Mark Approved</button>
          <button class="btn btn-ghost" style="font-size:12px;" onclick="recall()">Recall</button>`,
        approved: `
          <button class="btn btn-ghost" style="font-size:12px;" onclick="copyShareLink()">Copy Link</button>
          <button class="btn btn-ghost" style="font-size:12px;" onclick="viewShared()">View</button>
          <button class="btn btn-ghost" style="font-size:12px;" onclick="recall()">Recall to Draft</button>`,
      };
      const publishBtn = statusActions[strategy.status] || statusActions.draft;

      document.getElementById('page-content').innerHTML = `
        <div class="strategy-header">
          <div style="flex:1;">
            <div style="margin-bottom:8px;">
              <a href="/clients/${strategy.client_id}/board" style="color:var(--text-muted);font-size:13px;text-decoration:none;">← ${strategy.client_name || 'Client'}</a>
            </div>
            <input class="strategy-title-input" id="strategy-title" type="text"
              value="${escAttr(strategy.title)}"
              onchange="saveTitle(this.value)" onblur="saveTitle(this.value)">
            <div class="strategy-meta">${strategy.client_name || ''}</div>
          </div>
          <div class="strategy-actions">
            <span class="save-indicator" id="save-status"></span>
            <span class="status-pill ${chipClass}">${chipLabel}</span>
            ${publishBtn}
            <button class="btn btn-danger" style="font-size:12px;" onclick="deleteStrategy()">Delete</button>
          </div>
        </div>

        <div class="sb-layout">
          <nav class="sb-nav" id="sb-nav"></nav>
          <div class="sb-content" id="sb-content"></div>
        </div>
      `;

      renderNav();
      renderContent();
    }

    // ── Nav ───────────────────────────────────────────────────────────────────

    // Unlike orderSectionsForDisplay (which filters to active-only, for the
    // read-only render surfaces), the builder's nav must keep every section
    // visible so inactive ones can still be toggled on. Within each group,
    // active sections are ordered per activeSections (for drag-reorder),
    // followed by inactive ones in their default SECTION_DEFS order.
    function orderAllSectionsForNav() {
      const byGroup = {};
      for (const def of sectionDefsForDocType(docType)) {
        if (!byGroup[def.group]) byGroup[def.group] = [];
        byGroup[def.group].push(def);
      }
      const result = [];
      for (const group of GROUP_ORDER) {
        const defs = byGroup[group];
        if (!defs) continue;
        const active = defs.filter(d => activeSections.includes(d.id))
          .sort((a, b) => activeSections.indexOf(a.id) - activeSections.indexOf(b.id));
        const inactive = defs.filter(d => !activeSections.includes(d.id));
        result.push(...active, ...inactive);
      }
      return result;
    }

    function renderNav() {
      const el = document.getElementById('sb-nav');
      if (!el) return;
      const ordered = orderAllSectionsForNav();
      let html = '';
      let lastGroup = null;
      for (const def of ordered) {
        if (def.group !== lastGroup) {
          lastGroup = def.group;
          html += `<div class="sb-nav-section-label">${escHtml(def.group)}</div>`;
        }
        html += renderNavItem(def);
      }
      el.innerHTML = html;
      attachNavDragHandlers();
    }

    function renderNavItem(def) {
      const id = def.id;
      const isActive = activeSections.includes(id);
      const secVal = sections[id];
      const isParent = !!(secVal && Array.isArray(secVal.subtabs) && secVal.subtabs.length);
      const hasContent = hasContentFor(id);
      const isCurrent = id === currentSectionId && !currentSubtabId;
      const label = getLabelFor(id);

      let html = `
        <div class="sb-nav-item ${isCurrent ? 'active' : ''} ${!isActive ? 'inactive' : ''}"
             id="nav-item-${id}" data-group="${escAttr(def.group)}" data-id="${id}"
             draggable="true" onclick="selectSection('${id}')">
          <span class="sb-nav-drag">⠿</span>
          <div class="section-toggle ${isActive ? 'on' : ''}"
               onclick="event.stopPropagation(); toggleActive('${id}')"></div>
          <span class="sb-nav-label" id="nav-label-${id}">${escHtml(label)}</span>
          ${hasContent ? '<span class="sb-nav-tick">✓</span>' : ''}
          <button class="sb-nav-edit" onclick="event.stopPropagation(); startNavRename('${id}')" title="Rename">✎</button>
        </div>`;

      if (isActive && isParent) {
        html += `<div class="sb-nav-subtabs">`;
        secVal.subtabs.forEach(st => {
          const isCur = id === currentSectionId && currentSubtabId === st.id;
          html += `
            <div class="sb-nav-subtab-item ${isCur ? 'active' : ''} ${st.active === false ? 'inactive' : ''}"
                 data-parent="${id}" data-subid="${st.id}" draggable="true"
                 onclick="event.stopPropagation(); selectSubtab('${id}','${st.id}')">
              <span class="sb-nav-drag">⠿</span>
              <div class="section-toggle ${st.active !== false ? 'on' : ''}"
                   onclick="event.stopPropagation(); toggleSubtabActive('${id}','${st.id}')"></div>
              <span class="sb-nav-label">${escHtml(st.label)}</span>
              <button class="sb-nav-edit" onclick="event.stopPropagation(); renameSubtab('${id}','${st.id}')" title="Rename">✎</button>
              <button class="sb-nav-edit" onclick="event.stopPropagation(); removeSubtab('${id}','${st.id}')" title="Remove">✕</button>
            </div>`;
        });
        html += `<div class="sb-nav-add-subtab" onclick="event.stopPropagation(); addSubtab('${id}')">+ Add sub-tab</div></div>`;
      } else if (isActive && !isParent) {
        html += `<div class="sb-nav-add-subtab" onclick="event.stopPropagation(); promoteToSubtabs('${id}')">+ Add sub-tab</div>`;
      }

      return html;
    }

    function attachNavDragHandlers() {
      const nav = document.getElementById('sb-nav');
      if (!nav) return;
      let draggedId = null;
      nav.querySelectorAll('.sb-nav-item').forEach(el => {
        el.addEventListener('dragstart', e => { draggedId = el.dataset.id; e.stopPropagation(); });
        el.addEventListener('dragover', e => { e.preventDefault(); });
        el.addEventListener('drop', e => {
          e.preventDefault();
          if (!draggedId) return;
          reorderActiveSections(draggedId, el.dataset.id);
          draggedId = null;
        });
      });

      let draggedSubParent = null, draggedSubId = null;
      nav.querySelectorAll('.sb-nav-subtab-item').forEach(el => {
        el.addEventListener('dragstart', e => {
          draggedSubParent = el.dataset.parent; draggedSubId = el.dataset.subid; e.stopPropagation();
        });
        el.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); });
        el.addEventListener('drop', e => {
          e.preventDefault(); e.stopPropagation();
          if (!draggedSubId || el.dataset.parent !== draggedSubParent) return;
          reorderSubtabs(draggedSubParent, draggedSubId, el.dataset.subid);
          draggedSubId = null;
        });
      });
    }

    function reorderActiveSections(draggedId, targetId) {
      if (draggedId === targetId) return;
      const draggedDef = SECTION_DEFS.find(d => d.id === draggedId);
      const targetDef = SECTION_DEFS.find(d => d.id === targetId);
      if (!draggedDef || !targetDef || draggedDef.group !== targetDef.group) return;
      const from = activeSections.indexOf(draggedId);
      if (from === -1) return;
      activeSections.splice(from, 1);
      const to = activeSections.indexOf(targetId);
      activeSections.splice(to === -1 ? activeSections.length : to, 0, draggedId);
      renderNav();
      scheduleSave();
    }

    function reorderSubtabs(topId, draggedSubId, targetSubId) {
      const sec = getSection(topId);
      if (!Array.isArray(sec.subtabs) || draggedSubId === targetSubId) return;
      const from = sec.subtabs.findIndex(s => s.id === draggedSubId);
      if (from === -1) return;
      const [moved] = sec.subtabs.splice(from, 1);
      const to = sec.subtabs.findIndex(s => s.id === targetSubId);
      sec.subtabs.splice(to === -1 ? sec.subtabs.length : to, 0, moved);
      renderNav();
      scheduleSave();
    }

    function reorderArrayByIndex(arr, fromIndex, toIndex) {
      if (fromIndex === toIndex || fromIndex == null || toIndex == null) return;
      const [moved] = arr.splice(fromIndex, 1);
      arr.splice(toIndex, 0, moved);
    }

    // ── Section select ────────────────────────────────────────────────────────

    function selectSection(id) {
      currentSectionId = id;
      currentSubtabId = null;
      const sec = sections[id];
      if (sec && Array.isArray(sec.subtabs) && sec.subtabs.length) {
        currentSubtabId = (sec.subtabs.find(s => s.active !== false) || sec.subtabs[0]).id;
      }
      renderNav();
      renderContent();
    }

    function selectSubtab(topId, subId) {
      currentSectionId = topId;
      currentSubtabId = subId;
      renderNav();
      renderContent();
    }

    // ── Sub-tab management ───────────────────────────────────────────────────

    function promoteToSubtabs(topId) {
      const sec = getSection(topId);
      const existingBlocks = Array.isArray(sec.blocks) ? sec.blocks : [];
      const def = SECTION_DEFS.find(d => d.id === topId);
      const secondId = 'sub-' + Math.random().toString(36).slice(2, 8);
      sections[topId] = {
        subtabs: [
          { id: 'general', label: def ? def.label : 'General', active: true, blocks: existingBlocks },
          { id: secondId, label: 'New Tab', active: true, blocks: [] },
        ],
      };
      currentSectionId = topId;
      currentSubtabId = secondId;
      renderNav();
      renderContent();
      scheduleSave();
    }

    function addSubtab(topId) {
      const sec = getSection(topId);
      if (!Array.isArray(sec.subtabs)) return;
      const newId = 'sub-' + Math.random().toString(36).slice(2, 8);
      sec.subtabs.push({ id: newId, label: 'New Tab', active: true, blocks: [] });
      currentSectionId = topId;
      currentSubtabId = newId;
      renderNav();
      renderContent();
      scheduleSave();
    }

    function removeSubtab(topId, subId) {
      const sec = getSection(topId);
      if (!Array.isArray(sec.subtabs)) return;
      if (!confirm('Remove this sub-tab? This cannot be undone.')) return;
      sec.subtabs = sec.subtabs.filter(s => s.id !== subId);
      if (!sec.subtabs.length) {
        sections[topId] = { blocks: [] };
        if (currentSectionId === topId) currentSubtabId = null;
      } else if (currentSectionId === topId && currentSubtabId === subId) {
        currentSubtabId = sec.subtabs[0].id;
      }
      renderNav();
      renderContent();
      scheduleSave();
    }

    function renameSubtab(topId, subId) {
      const sec = getSection(topId);
      const st = (sec.subtabs || []).find(s => s.id === subId);
      if (!st) return;
      const val = prompt('Rename sub-tab', st.label);
      if (val && val.trim()) {
        st.label = val.trim();
        renderNav();
        renderContent();
        scheduleSave();
      }
    }

    function toggleSubtabActive(topId, subId) {
      const sec = getSection(topId);
      const st = (sec.subtabs || []).find(s => s.id === subId);
      if (!st) return;
      st.active = st.active === false ? true : false;
      renderNav();
      if (currentSectionId === topId && currentSubtabId === subId) renderContent();
      scheduleSave();
    }

    // ── Content area ──────────────────────────────────────────────────────────

    function renderContent() {
      const el = document.getElementById('sb-content');
      if (!el) return;
      const id = currentSectionId;
      const def = SECTION_DEFS.find(d => d.id === id);
      if (!def) { el.innerHTML = '<div class="sb-empty">Select a section to begin.</div>'; return; }

      const isActive = activeSections.includes(id);
      if (!isActive) {
        el.innerHTML = `
          <div class="sb-empty">
            <div style="font-size:32px;margin-bottom:8px;">○</div>
            <div><strong>${escHtml(getLabelFor(id))}</strong> is turned off.</div>
            <div style="margin-top:8px;"><button class="btn btn-ghost" onclick="toggleActive('${id}')">Turn on</button></div>
          </div>`;
        return;
      }

      const sec = getSection(id);
      const isParent = Array.isArray(sec.subtabs) && sec.subtabs.length > 0;

      let subtab = null, blocks, leafLabel = getLabelFor(id), leafHint = getHintFor(id);
      if (isParent) {
        if (!currentSubtabId || !sec.subtabs.some(s => s.id === currentSubtabId)) {
          currentSubtabId = (sec.subtabs.find(s => s.active !== false) || sec.subtabs[0]).id;
        }
        subtab = sec.subtabs.find(s => s.id === currentSubtabId);
        blocks = subtab.blocks;
        leafLabel = subtab.label;
        leafHint = '';
      } else {
        blocks = sec.blocks;
      }
      const subArg = subtab ? `'${subtab.id}'` : 'null';

      let html = `
        <div class="sb-content-title-wrap">
          <div class="sb-content-title" id="content-title-${id}" ${subtab ? '' : `onclick="startContentRename('${id}')"`}>
            ${escHtml(leafLabel)}
            ${subtab ? '' : '<span class="sb-rename-icon">✎</span>'}
          </div>
        </div>
        ${leafHint ? `<div class="sb-hint">${escHtml(leafHint)}</div>` : ''}
      `;

      if (isParent) {
        html += `<div class="sb-subtab-strip">${sec.subtabs.map(st => `
          <button class="sb-subtab-pill ${st.id === currentSubtabId ? 'active' : ''}" onclick="selectSubtab('${id}','${st.id}')">${escHtml(st.label)}</button>
        `).join('')}</div>`;
      }

      html += `<div class="sb-blocks" id="sb-blocks">`;
      blocks.forEach((block, i) => { html += renderBlockEditor(id, subtab ? subtab.id : null, block, i); });
      html += `</div>`;

      html += `
        <div class="sb-add-block-wrap">
          <button class="btn-generate" onclick="toggleAddBlockMenu()">+ Add Block</button>
          <div class="sb-add-block-menu hidden" id="add-block-menu">
            <button onclick="addBlock('${id}', ${subArg}, 'richtext')">Text</button>
            <button onclick="addBlock('${id}', ${subArg}, 'image-inline')">Image</button>
            <button onclick="addBlock('${id}', ${subArg}, 'image-hero')">Image Section</button>
            <button onclick="addBlock('${id}', ${subArg}, 'card-grid')">Card Grid</button>
            <button onclick="addBlock('${id}', ${subArg}, 'gantt')">Gantt / Timeline</button>
          </div>
        </div>
        <div class="sb-footer">
          <button class="btn-generate" id="gen-${id}" onclick="generateSection('${id}')">
            <span class="spinner"></span><span class="gen-icon">✦</span>Generate with AI
          </button>
        </div>
        <input type="file" id="sb-image-input" accept="image/*" style="display:none;" onchange="handleImageUpload(this)">
      `;

      el.innerHTML = html;
      attachBlockDragHandlers();
    }

    function currentBlocksArray() {
      const sec = getSection(currentSectionId);
      if (Array.isArray(sec.subtabs) && currentSubtabId) {
        const st = sec.subtabs.find(s => s.id === currentSubtabId);
        return st ? st.blocks : null;
      }
      return sec.blocks;
    }

    // ── Block editors ─────────────────────────────────────────────────────────

    function renderBlockEditor(topId, subId, block, index) {
      const key = blockKey(topId, subId, index);
      let inner = '';
      if (block.type === 'richtext') inner = renderRichtextEditor(topId, subId, index, block);
      else if (block.type === 'image') inner = renderImageEditor(topId, subId, index, block);
      else if (block.type === 'card-grid') inner = renderCardGridEditor(topId, subId, index, block);
      else if (block.type === 'gantt') inner = renderGanttEditor(topId, subId, index, block);
      const subArg = subId ? `'${subId}'` : 'null';
      return `
        <div class="sb-block" data-key="${key}" data-index="${index}" draggable="true">
          <div class="sb-block-toolbar">
            <span class="sb-block-drag">⠿</span>
            <span class="sb-block-type">${blockTypeLabel(block.type)}</span>
            <button class="sb-block-remove" onclick="removeBlock('${topId}', ${subArg}, ${index})" title="Remove block">✕</button>
          </div>
          ${inner}
        </div>`;
    }

    function renderRichtextEditor(topId, subId, index, block) {
      const content = block.markdown || '';
      const hasContent = content.trim().length > 0;
      const suffix = `${topId}-${subId || 'x'}-${index}`;
      const subArg = subId ? `'${subId}'` : 'null';
      return `
        <div class="section-preview ${hasContent ? '' : 'hidden'}" id="rt-prev-${suffix}"
             onclick="editRichtext('${topId}', ${subArg}, ${index})" title="Click to edit">${hasContent ? DOMPurify.sanitize(marked.parse(content)) : ''}</div>
        <textarea class="section-textarea ${hasContent ? 'hidden' : ''}" id="rt-ta-${suffix}"
          placeholder="Write here…"
          oninput="onBlockTextInput('${topId}', ${subArg}, ${index}, this)"
          onblur="previewRichtext('${topId}', ${subArg}, ${index})"
        >${escHtml(content)}</textarea>`;
    }

    function onBlockTextInput(topId, subId, index, textareaEl) {
      const block = getBlockRef(topId, subId, index);
      if (block) block.markdown = textareaEl.value;
      scheduleSave();
    }

    function editRichtext(topId, subId, index) {
      const suffix = `${topId}-${subId || 'x'}-${index}`;
      document.getElementById(`rt-prev-${suffix}`)?.classList.add('hidden');
      const ta = document.getElementById(`rt-ta-${suffix}`);
      if (ta) { ta.classList.remove('hidden'); ta.focus(); }
    }

    function previewRichtext(topId, subId, index) {
      const suffix = `${topId}-${subId || 'x'}-${index}`;
      const ta = document.getElementById(`rt-ta-${suffix}`);
      if (!ta) return;
      const content = ta.value.trim();
      const prev = document.getElementById(`rt-prev-${suffix}`);
      if (content && prev) {
        prev.innerHTML = DOMPurify.sanitize(marked.parse(content));
        prev.classList.remove('hidden');
        ta.classList.add('hidden');
      }
      refreshNavItemTick(topId);
    }

    function refreshNavItemTick(topId) {
      renderNav();
    }

    function renderImageEditor(topId, subId, index, block) {
      const images = Array.isArray(block.images) ? block.images : [];
      const subArg = subId ? `'${subId}'` : 'null';
      const thumbs = images.map((img, i) => `
        <div class="sb-image-thumb">
          <img src="${escAttr(img.src)}" alt="">
          <button onclick="removeBlockImage('${topId}', ${subArg}, ${index}, ${i})" title="Remove">✕</button>
        </div>`).join('');
      return `
        <div class="sb-image-editor">
          <div class="sb-image-editor-row">
            <span class="sb-image-layout-label">Layout</span>
            <select class="sb-image-layout" onchange="setImageLayout('${topId}', ${subArg}, ${index}, this.value)">
              <option value="inline" ${block.layout === 'inline' ? 'selected' : ''}>Inline</option>
              <option value="grid" ${block.layout === 'grid' ? 'selected' : ''}>Grid</option>
              <option value="hero" ${block.layout === 'hero' ? 'selected' : ''}>Hero</option>
            </select>
            <button class="btn-generate" onclick="triggerBlockImageUpload('${topId}', ${subArg}, ${index})">🖼 Add Image</button>
          </div>
          ${thumbs ? `<div class="sb-image-thumbs">${thumbs}</div>` : '<div class="sb-empty-note">No images yet — click Add Image above.</div>'}
        </div>`;
    }

    function setImageLayout(topId, subId, index, layout) {
      const block = getBlockRef(topId, subId, index);
      if (block) block.layout = layout;
      scheduleSave();
    }

    function removeBlockImage(topId, subId, index, imgIndex) {
      const block = getBlockRef(topId, subId, index);
      if (block && Array.isArray(block.images)) {
        block.images.splice(imgIndex, 1);
        renderContent();
        scheduleSave();
      }
    }

    function renderCardGridEditor(topId, subId, index, block) {
      const cards = Array.isArray(block.cards) ? block.cards : [];
      const subArg = subId ? `'${subId}'` : 'null';
      const key = blockKey(topId, subId, index);
      const cardsHtml = cards.map((c, ci) => `
        <div class="sb-cg-card" data-ci="${ci}" draggable="true">
          <div class="sb-cg-card-toolbar">
            <span class="sb-block-drag">⠿</span>
            <button onclick="removeCard('${topId}', ${subArg}, ${index}, ${ci})" title="Remove card">✕</button>
          </div>
          ${c.image && c.image.src
            ? `<div class="sb-image-thumb"><img src="${escAttr(c.image.src)}" alt=""><button onclick="removeCardImage('${topId}', ${subArg}, ${index}, ${ci})">✕</button></div>`
            : `<button class="btn-generate" style="font-size:11px;padding:4px 10px;align-self:flex-start;" onclick="triggerCardImageUpload('${topId}', ${subArg}, ${index}, ${ci})">🖼 Add Image</button>`}
          <input class="sb-cg-title-input" type="text" placeholder="Card title" value="${escAttr(c.title || '')}"
            oninput="setCardField('${topId}', ${subArg}, ${index}, ${ci}, 'title', this.value)">
          <textarea class="sb-cg-body-input" placeholder="Card text"
            oninput="setCardField('${topId}', ${subArg}, ${index}, ${ci}, 'body', this.value)">${escHtml(c.body || '')}</textarea>
        </div>`).join('');
      return `
        <div class="sb-card-grid-editor">
          <div class="sb-cg-grid" data-block-key="${key}">${cardsHtml}</div>
          <button class="btn btn-ghost" style="font-size:12px;margin-top:10px;" onclick="addCard('${topId}', ${subArg}, ${index})">+ Add Card</button>
        </div>`;
    }

    function setCardField(topId, subId, index, ci, field, value) {
      const block = getBlockRef(topId, subId, index);
      if (block && block.cards && block.cards[ci]) { block.cards[ci][field] = value; scheduleSave(); }
    }
    function addCard(topId, subId, index) {
      const block = getBlockRef(topId, subId, index);
      if (block) { block.cards = block.cards || []; block.cards.push({ title: '', body: '' }); renderContent(); scheduleSave(); }
    }
    function removeCard(topId, subId, index, ci) {
      const block = getBlockRef(topId, subId, index);
      if (block && block.cards) { block.cards.splice(ci, 1); renderContent(); scheduleSave(); }
    }
    function removeCardImage(topId, subId, index, ci) {
      const block = getBlockRef(topId, subId, index);
      if (block && block.cards && block.cards[ci]) { delete block.cards[ci].image; renderContent(); scheduleSave(); }
    }

    function renderGanttEditor(topId, subId, index, block) {
      const phases = Array.isArray(block.phases) ? block.phases : [];
      const subArg = subId ? `'${subId}'` : 'null';
      const rows = phases.map((p, pi) => `
        <div class="sb-gantt-row-editor" data-pi="${pi}" draggable="true">
          <span class="sb-block-drag">⠿</span>
          <input type="text" placeholder="Phase title" value="${escAttr(p.title || '')}"
            oninput="setPhaseField('${topId}', ${subArg}, ${index}, ${pi}, 'title', this.value)">
          <input type="date" value="${escAttr(p.start || '')}" onchange="setPhaseField('${topId}', ${subArg}, ${index}, ${pi}, 'start', this.value)">
          <input type="date" value="${escAttr(p.end || '')}" onchange="setPhaseField('${topId}', ${subArg}, ${index}, ${pi}, 'end', this.value)">
          <button onclick="removePhase('${topId}', ${subArg}, ${index}, ${pi})" title="Remove phase">✕</button>
          <textarea class="sb-gantt-notes-input" placeholder="Notes (optional)"
            oninput="setPhaseField('${topId}', ${subArg}, ${index}, ${pi}, 'notes', this.value)">${escHtml(p.notes || '')}</textarea>
        </div>`).join('');
      return `
        <div class="sb-gantt-editor">
          <div class="sb-gantt-rows-editor">${rows}</div>
          <button class="btn btn-ghost" style="font-size:12px;margin:10px 0;" onclick="addPhase('${topId}', ${subArg}, ${index})">+ Add Phase</button>
          <div class="sb-gantt-preview">${renderGanttBlock(block)}</div>
        </div>`;
    }

    function setPhaseField(topId, subId, index, pi, field, value) {
      const block = getBlockRef(topId, subId, index);
      if (block && block.phases && block.phases[pi]) {
        block.phases[pi][field] = value;
        scheduleSave();
        refreshGanttPreview(topId, subId, index);
      }
    }
    function addPhase(topId, subId, index) {
      const block = getBlockRef(topId, subId, index);
      if (block) { block.phases = block.phases || []; block.phases.push({ title: 'New Phase', start: '', end: '', notes: '' }); renderContent(); scheduleSave(); }
    }
    function removePhase(topId, subId, index, pi) {
      const block = getBlockRef(topId, subId, index);
      if (block && block.phases) { block.phases.splice(pi, 1); renderContent(); scheduleSave(); }
    }
    function refreshGanttPreview(topId, subId, index) {
      const block = getBlockRef(topId, subId, index);
      if (!block) return;
      const key = blockKey(topId, subId, index);
      const container = document.querySelector(`.sb-block[data-key="${key}"] .sb-gantt-preview`);
      if (container) container.innerHTML = renderGanttBlock(block);
    }

    // ── Add / remove blocks ──────────────────────────────────────────────────

    function toggleAddBlockMenu() {
      document.getElementById('add-block-menu')?.classList.toggle('hidden');
    }

    function addBlock(topId, subId, kind) {
      const blocks = subId ? (getSection(topId).subtabs || []).find(s => s.id === subId)?.blocks : getSection(topId).blocks;
      if (!blocks) return;
      let block;
      if (kind === 'richtext') block = { type: 'richtext', markdown: '' };
      else if (kind === 'image-inline') block = { type: 'image', layout: 'inline', images: [] };
      else if (kind === 'image-hero') block = { type: 'image', layout: 'hero', images: [] };
      else if (kind === 'card-grid') block = { type: 'card-grid', cards: [{ title: '', body: '' }, { title: '', body: '' }] };
      else if (kind === 'gantt') block = { type: 'gantt', phases: [{ title: 'Phase 1', start: '', end: '', notes: '' }] };
      else return;
      blocks.push(block);
      document.getElementById('add-block-menu')?.classList.add('hidden');
      renderContent();
      scheduleSave();
    }

    function removeBlock(topId, subId, index) {
      const blocks = subId ? (getSection(topId).subtabs || []).find(s => s.id === subId)?.blocks : getSection(topId).blocks;
      if (!blocks) return;
      if (!confirm('Remove this block?')) return;
      blocks.splice(index, 1);
      renderContent();
      scheduleSave();
    }

    // ── Drag-reorder: blocks / cards / phases ────────────────────────────────

    function attachBlockDragHandlers() {
      const container = document.getElementById('sb-blocks');
      if (container) {
        let draggedIndex = null;
        container.querySelectorAll(':scope > .sb-block').forEach(el => {
          el.addEventListener('dragstart', e => { draggedIndex = Number(el.dataset.index); e.stopPropagation(); });
          el.addEventListener('dragover', e => { e.preventDefault(); });
          el.addEventListener('drop', e => {
            e.preventDefault();
            if (draggedIndex === null) return;
            const targetIndex = Number(el.dataset.index);
            const blocks = currentBlocksArray();
            if (blocks) { reorderArrayByIndex(blocks, draggedIndex, targetIndex); renderContent(); scheduleSave(); }
            draggedIndex = null;
          });
        });
      }

      document.querySelectorAll('.sb-cg-grid').forEach(grid => {
        let draggedCi = null;
        const [topId, subId, idxStr] = grid.dataset.blockKey.split('::');
        const index = Number(idxStr);
        grid.querySelectorAll(':scope > .sb-cg-card').forEach(el => {
          el.addEventListener('dragstart', e => { draggedCi = Number(el.dataset.ci); e.stopPropagation(); });
          el.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); });
          el.addEventListener('drop', e => {
            e.preventDefault(); e.stopPropagation();
            if (draggedCi === null) return;
            const block = getBlockRef(topId, subId || null, index);
            if (block && block.cards) { reorderArrayByIndex(block.cards, draggedCi, Number(el.dataset.ci)); renderContent(); scheduleSave(); }
            draggedCi = null;
          });
        });
      });

      document.querySelectorAll('.sb-gantt-rows-editor').forEach(wrap => {
        const blockEl = wrap.closest('.sb-block');
        if (!blockEl) return;
        const [topId, subId, idxStr] = blockEl.dataset.key.split('::');
        const index = Number(idxStr);
        let draggedPi = null;
        wrap.querySelectorAll(':scope > .sb-gantt-row-editor').forEach(el => {
          el.addEventListener('dragstart', e => { draggedPi = Number(el.dataset.pi); e.stopPropagation(); });
          el.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); });
          el.addEventListener('drop', e => {
            e.preventDefault(); e.stopPropagation();
            if (draggedPi === null) return;
            const block = getBlockRef(topId, subId || null, index);
            if (block && block.phases) { reorderArrayByIndex(block.phases, draggedPi, Number(el.dataset.pi)); renderContent(); scheduleSave(); }
            draggedPi = null;
          });
        });
      });
    }

    // ── Rename (top-level section only; sub-tabs use renameSubtab) ──────────

    function startNavRename(id) {
      const labelEl = document.getElementById(`nav-label-${id}`);
      if (!labelEl) return;
      const current = getLabelFor(id);
      const input = document.createElement('input');
      input.className = 'sb-nav-rename';
      input.value = current;
      labelEl.replaceWith(input);
      input.focus();
      input.select();
      const commit = () => {
        const val = input.value.trim();
        if (val && val !== (SECTION_DEFS.find(d => d.id === id)?.label)) sectionLabels[id] = val;
        else delete sectionLabels[id];
        renderNav();
        if (id === currentSectionId && !currentSubtabId) {
          const titleEl = document.getElementById(`content-title-${id}`);
          if (titleEl) titleEl.firstChild.textContent = getLabelFor(id);
        }
        scheduleSave();
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.value = current; input.blur(); } });
    }

    function startContentRename(id) {
      const titleEl = document.getElementById(`content-title-${id}`);
      if (!titleEl) return;
      const current = getLabelFor(id);
      const input = document.createElement('input');
      input.className = 'sb-content-title-input';
      input.value = current;
      titleEl.replaceWith(input);
      input.focus();
      input.select();
      const commit = () => {
        const val = input.value.trim();
        if (val && val !== (SECTION_DEFS.find(d => d.id === id)?.label)) sectionLabels[id] = val;
        else delete sectionLabels[id];
        const div = document.createElement('div');
        div.className = 'sb-content-title';
        div.id = `content-title-${id}`;
        div.setAttribute('onclick', `startContentRename('${id}')`);
        div.innerHTML = `${escHtml(getLabelFor(id))} <span class="sb-rename-icon">✎</span>`;
        input.replaceWith(div);
        renderNav();
        scheduleSave();
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.value = current; input.blur(); } });
    }

    // ── Toggle active ─────────────────────────────────────────────────────────

    function toggleActive(id) {
      if (activeSections.includes(id)) {
        activeSections = activeSections.filter(s => s !== id);
      } else {
        activeSections.push(id);
        if (!hasContentFor(id) && TEMPLATES[id]) {
          sections[id] = { blocks: [{ type: 'richtext', markdown: TEMPLATES[id] }] };
        }
      }
      if (currentSectionId === id) currentSubtabId = null;
      renderNav();
      if (currentSectionId === id) renderContent();
      scheduleSave();
    }

    // ── Save ──────────────────────────────────────────────────────────────────

    function scheduleSave() {
      setSaveStatus('Saving…');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 1200);
    }

    async function save() {
      const payload = { ...sections, _labels: sectionLabels };
      await fetch(`/api/strategies/${strategyId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sections: payload, active_sections: activeSections })
      });
      setSaveStatus('Saved');
      setTimeout(() => setSaveStatus(''), 2000);
    }

    function setSaveStatus(msg) {
      const el = document.getElementById('save-status');
      if (el) el.textContent = msg;
    }

    async function saveTitle(val) {
      const title = val.trim() || 'Untitled Strategy';
      if (title === strategy.title) return;
      strategy.title = title;
      await fetch(`/api/strategies/${strategyId}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });
    }

    // ── AI generate ───────────────────────────────────────────────────────────

    async function generateSection(id) {
      const btn = document.getElementById(`gen-${id}`);
      if (btn) { btn.classList.add('loading'); btn.disabled = true; }

      const sec = getSection(id);
      const isParent = Array.isArray(sec.subtabs) && sec.subtabs.length > 0;
      const subtabId = isParent ? currentSubtabId : null;

      try {
        const res = await fetch(`/api/strategies/${strategyId}/generate`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ section_id: id, subtab_id: subtabId, sections })
        });
        const data = await res.json();
        if (data.content) {
          const blocks = isParent ? sec.subtabs.find(s => s.id === subtabId).blocks : sec.blocks;
          blocks.length = 0;
          blocks.push({ type: 'richtext', markdown: data.content });
          renderContent();
          scheduleSave();
        } else {
          showToast('AI generation failed — please try again', true);
        }
      } catch {
        showToast('AI generation failed — please try again', true);
      }

      if (btn) { btn.classList.remove('loading'); btn.disabled = false; }
    }

    // ── Approval flow ─────────────────────────────────────────────────────────

    async function submitForApproval() {
      await save();
      const res = await fetch(`/api/strategies/${strategyId}/submit`, { method: 'POST' });
      const data = await res.json();
      strategy.status = 'awaiting_approval';
      strategy.share_token = data.token;
      render();
      await copyShareLink();
      showToast('Submitted for approval — link copied');
    }

    async function approve() {
      await fetch(`/api/strategies/${strategyId}/approve`, { method: 'POST' });
      strategy.status = 'approved';
      render();
      showToast('Strategy marked as approved');
    }

    async function recall() {
      await fetch(`/api/strategies/${strategyId}/recall`, { method: 'POST' });
      strategy.status = 'draft';
      render();
    }

    async function viewShared() {
      window.open(`/s/${strategy.share_token}`, '_blank');
    }

    async function copyShareLink() {
      const link = `${location.origin}/s/${strategy.share_token}`;
      try {
        await navigator.clipboard.writeText(link);
        showToast('Link copied to clipboard');
      } catch { prompt('Copy this link:', link); }
    }

    // ── Delete ────────────────────────────────────────────────────────────────

    async function deleteStrategy() {
      if (!confirm('Delete this strategy? This cannot be undone.')) return;
      await fetch(`/api/strategies/${strategyId}`, { method: 'DELETE' });
      window.location = `/clients/${strategy.client_id}/board`;
    }

    // ── Toast ─────────────────────────────────────────────────────────────────

    function showToast(msg, isError = false) {
      const el = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      el.querySelector('.toast-icon').textContent = isError ? '✕' : '✓';
      el.querySelector('.toast-icon').style.color = isError ? 'var(--danger)' : 'var(--success)';
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    // ── Image upload ──────────────────────────────────────────────────────────

    function triggerBlockImageUpload(topId, subId, index) {
      pendingUploadTarget = { topId, subId, index };
      document.getElementById('sb-image-input').click();
    }

    function triggerCardImageUpload(topId, subId, index, cardIndex) {
      pendingUploadTarget = { topId, subId, index, cardIndex };
      document.getElementById('sb-image-input').click();
    }

    async function handleImageUpload(input) {
      if (!input.files.length || !pendingUploadTarget) return;
      const file = input.files[0];
      input.value = '';
      const target = pendingUploadTarget;
      pendingUploadTarget = null;

      const formData = new FormData();
      formData.append('file', file);

      showToast('Uploading image…');
      const res = await fetch('/api/upload', { method: 'POST', body: formData });
      if (!res.ok) { showToast('Upload failed', true); return; }
      const { url } = await res.json();

      const block = getBlockRef(target.topId, target.subId, target.index);
      if (!block) return;
      if (target.cardIndex != null) {
        block.cards = block.cards || [];
        if (block.cards[target.cardIndex]) block.cards[target.cardIndex].image = { src: url, alt: '' };
      } else {
        block.images = block.images || [];
        block.images.push({ src: url, alt: '' });
      }
      renderContent();
      scheduleSave();
      showToast('Image added');
    }

    // ── Utils ─────────────────────────────────────────────────────────────────

    function escHtml(str) {
      return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function escAttr(str) {
      return (str || '').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    load();
  </script>
</body>
</html>
