<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approvals — Greenpoint</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content">

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
          <div style="display:flex;gap:8px;">
            <button class="btn btn-ghost">Pending</button>
            <button class="btn btn-ghost">Approved</button>
            <button class="btn btn-ghost">Rejected</button>
          </div>
          <button class="btn btn-primary">+ Submit for Approval</button>
        </div>

        <div class="card">
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Client</th>
                <th>Type</th>
                <th>Status</th>
                <th>Submitted</th>
                <th>Reviewer</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="6" style="color:var(--text-muted);text-align:center;padding:32px;">No approvals pending</td>
              </tr>
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>
  <script src="/components/shell.js"></script>
  <script>renderShell({ pageId: 'approvals', title: 'Approvals' });</script>
</body>
</html>
