<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social — Greenpoint</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content">

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
          <div style="display:flex;gap:8px;">
            <button class="btn btn-ghost">All</button>
            <button class="btn btn-ghost">Scheduled</button>
            <button class="btn btn-ghost">Published</button>
            <button class="btn btn-ghost">Draft</button>
          </div>
          <button class="btn btn-primary">+ New Post</button>
        </div>

        <div class="card">
          <table>
            <thead>
              <tr>
                <th>Post</th>
                <th>Client</th>
                <th>Platform</th>
                <th>Status</th>
                <th>Scheduled</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="5" style="color:var(--text-muted);text-align:center;padding:32px;">No posts yet</td>
              </tr>
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>
  <script src="/components/shell.js"></script>
  <script>renderShell({ pageId: 'social', title: 'Social' });</script>
</body>
</html>
