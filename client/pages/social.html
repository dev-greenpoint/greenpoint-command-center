<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social — Greenpoint</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/main.css">
  <script src="/components/theme.js"></script>
  <style>
    .social-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .social-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      cursor: pointer;
      transition: border-color 0.15s;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .social-card:hover { border-color: var(--accent); }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .card-client { font-size: 15px; font-weight: 600; color: var(--text); }
    .card-name { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .status-chip {
      display: inline-flex; align-items: center;
      padding: 2px 9px; border-radius: 100px;
      font-size: 11px; font-weight: 600; flex-shrink: 0;
    }
    .chip-active    { background: #0d3323; color: var(--success); }
    .chip-draft     { background: var(--surface-2); color: var(--text-muted); }
    .chip-paused    { background: #3d2a00; color: var(--warning); }
    .chip-completed { background: #1a1a2e; color: #8888cc; }
    .platform-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .platform-chip {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 4px; padding: 2px 7px;
      font-size: 11px; color: var(--text-muted); font-weight: 500;
    }
    .task-bar-wrap {
      height: 4px; background: var(--surface-2);
      border-radius: 2px; overflow: hidden;
    }
    .task-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; }
    .card-meta { font-size: 11px; color: var(--text-dim); display: flex; justify-content: space-between; }
    .empty-state {
      text-align: center; padding: 64px 20px;
      color: var(--text-muted); font-size: 14px;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
    .form-group textarea { resize: vertical; min-height: 70px; }
    .check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .service-check { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text); cursor: pointer; }
    .platform-posts { display: flex; flex-direction: column; gap: 6px; }
    .platform-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .platform-row input[type=number] {
      width: 60px; padding: 4px 8px; text-align: center;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 12px;
    }
    .section-divider {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; color: var(--text-muted); padding-top: 6px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content" id="page-content">

        <div style="margin-bottom:20px;">
          <div id="social-count" style="font-size:13px;color:var(--text-muted);">Loading…</div>
        </div>

        <div id="social-grid" class="social-grid">
          <div style="color:var(--text-muted);font-size:13px;">Loading…</div>
        </div>

      </main>
    </div>
  </div>

  <script src="/components/shell.js"></script>
  <script>
    renderShell({ pageId: 'social', title: 'Social' });

    async function load() {
      const [campRes] = await Promise.all([
        fetch('/api/campaigns'),
      ]);
      const allCampaigns = await campRes.json();

      const social = allCampaigns.filter(c => c.type === 'Social Media');
      document.getElementById('social-count').textContent =
        social.length === 1 ? '1 social campaign' : `${social.length} social campaigns`;

      renderCards(social);
    }

    function renderCards(campaigns) {
      const grid = document.getElementById('social-grid');
      if (!campaigns.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">No social campaigns yet.</div>`;
        return;
      }

      grid.innerHTML = campaigns.map(c => {
        const scope = c.scope ? JSON.parse(c.scope) : {};
        const platforms = scope.platforms || [];
        const totalPosts = platforms.reduce((sum, p) => sum + (p.posts || 0), 0);
        const statusClass = { active:'chip-active', draft:'chip-draft', paused:'chip-paused', completed:'chip-completed' }[c.status] || 'chip-draft';
        const statusLabel = c.status.charAt(0).toUpperCase() + c.status.slice(1);

        return `
          <a class="social-card" href="/social/${c.id}">
            <div class="card-top">
              <div>
                <div class="card-client">${c.client_name || 'No client'}</div>
                <div class="card-name">${c.name}</div>
              </div>
              <span class="status-chip ${statusClass}">${statusLabel}</span>
            </div>
            ${platforms.length ? `
            <div class="platform-chips">
              ${platforms.map(p => `<span class="platform-chip">${p.name}${p.posts ? ' · ' + p.posts + '/mo' : ''}</span>`).join('')}
            </div>` : ''}
            ${scope.contentTypes && scope.contentTypes.length ? `
            <div style="font-size:11px;color:var(--text-dim);">${scope.contentTypes.join(' · ')}</div>` : ''}
          </a>`;
      }).join('');
    }

    load();
  </script>
</body>
</html>
