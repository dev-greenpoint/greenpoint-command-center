<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — Greenpoint</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content" id="page-content">

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
          <div style="display:flex;gap:8px;">
            <button class="btn btn-ghost">All</button>
            <button class="btn btn-ghost">This Month</button>
            <button class="btn btn-ghost">Last Month</button>
          </div>
          <button class="btn btn-primary">+ New Report</button>
        </div>

        <div class="card">
          <table>
            <thead>
              <tr>
                <th>Report</th>
                <th>Client</th>
                <th>Campaign</th>
                <th>Period</th>
                <th>Created</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="5" style="color:var(--text-muted);text-align:center;padding:32px;">No reports yet</td>
              </tr>
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>
  <script src="/components/shell.js"></script>
  <script>
    renderShell({ pageId: 'reports', title: 'Reports' });
    if (!IS_LOCALHOST) {
      document.getElementById('page-content').innerHTML = `
        <div style="max-width:420px;margin:80px auto;text-align:center;">
          <div style="font-size:32px;margin-bottom:12px;">🔒</div>
          <div style="font-size:15px;font-weight:600;margin-bottom:6px;">Available on localhost only</div>
          <div style="font-size:13px;color:var(--text-muted);">This section isn't open in production yet.</div>
        </div>`;
    }
  </script>
</body>
</html>
