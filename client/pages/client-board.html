    async function toggleServiceItem(itemId, completed, el, sectionLabel) {
      // Update checklist data in memory
      const item = clientChecklist.find(i => i.id === itemId);
      if (item) item.completed = completed;

      await fetch(`/api/clients/${clientId}/checklist/${itemId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      const label = el.closest('label');
      if (label) {
        label.style.color = completed ? 'var(--text-muted)' : '';
        label.style.textDecoration = completed ? 'line-through' : '';
      }
      // Update done/total count and "+ New" button state for this section
      if (sectionLabel) {
        const sectionEl = document.querySelector(`.section-setup[data-section="${sectionLabel}"]`);
        if (sectionEl) {
          const total = sectionEl.querySelectorAll('input[type=checkbox]').length;
          const done = sectionEl.querySelectorAll('input[type=checkbox]:checked').length;
          const countEl = document.getElementById(`setup-count-${sectionLabel.replace(/\s/g,'-')}`);
          if (countEl) countEl.textContent = `${done}/${total}`;
        }
        const cats = SECTION_CHECKLIST_CATEGORIES[sectionLabel] || [];
        const sectionItems = clientChecklist.filter(i => cats.includes(i.category));
        const allDone = sectionItems.every(i => i.completed);
        const btnId = `camp-new-btn-${sectionLabel.replace(/[^a-zA-Z0-9]/g,'-')}`;
        const btn = document.getElementById(btnId);
        if (btn) {
          btn.disabled = !allDone;
          btn.className = allDone ? 'btn btn-primary' : 'btn btn-ghost';
          btn.style.opacity = allDone ? '' : '0.4';
          btn.style.cursor = allDone ? '' : 'not-allowed';
          btn.title = allDone ? '' : 'Complete setup before adding campaigns';
          if (allDone) {
            const dbType = SECTION_DB_TYPE[sectionLabel] || sectionLabel;
            btn.onclick = () => openCampDrawer(dbType);
          }
        }
      }
    }

    // ── Mark all setup done ────────────────────────────────────────────────────

    async function markAllSetupDone(sectionLabel, btn) {
      if (btn) btn.style.display = 'none';
      const sectionEl = document.querySelector(`.section-setup[data-section="${sectionLabel}"]`);
      if (!sectionEl) return;
      const unchecked = [...sectionEl.querySelectorAll('input[type=checkbox]:not(:checked)')];
      unchecked.forEach(cb => {
        const itemId = parseInt(cb.dataset.itemId);
        cb.checked = true;
        const label = cb.closest('label');
        if (label) { label.style.color = 'var(--text-muted)'; label.style.textDecoration = 'line-through'; }
        const item = clientChecklist.find(i => i.id === itemId);
        if (item) item.completed = true;
      });

      await Promise.all(unchecked.map(cb => {
        const itemId = parseInt(cb.dataset.itemId);
        return fetch(`/api/clients/${clientId}/checklist/${itemId}`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed: true })
        });
      }));
      const total = sectionEl.querySelectorAll('input[type=checkbox]').length;
      const countEl = document.getElementById(`setup-count-${sectionLabel.replace(/\s/g,'-')}`);
      if (countEl) countEl.textContent = `${total}/${total}`;
      const btnId = `camp-new-btn-${sectionLabel.replace(/[^a-zA-Z0-9]/g,'-')}`;
      const newBtn = document.getElementById(btnId);
      if (newBtn) {
        newBtn.disabled = false;
        newBtn.className = 'btn btn-primary';
        newBtn.style.opacity = '';
        newBtn.style.cursor = '';
        newBtn.title = '';
        const dbType = SECTION_DB_TYPE[sectionLabel] || sectionLabel;
        newBtn.onclick = () => openCampDrawer(dbType);
      }
    }

    function updateClientTaskCount() {
      const tabTasks = clientTasksAll.filter(t => (t.service || 'General') === activeTaskTab);
      const done = tabTasks.filter(t => t.status === 'done').length;
      const total = tabTasks.length;
      const countEl = document.getElementById('client-task-count');
      if (countEl) countEl.textContent = `${done}/${total} done`;
      const bar = document.getElementById('task-progress-bar');
      if (bar) bar.style.width = total ? `${Math.round((done / total) * 100)}%` : '0%';

    function showClientAddForm() {
      document.getElementById('client-add-trigger')?.style.setProperty('display', 'none');
      document.getElementById('client-add-form')?.classList.add('open');
      document.getElementById('client-task-input')?.focus();
    }

    function hideClientAddForm() {
      document.getElementById('client-add-form')?.classList.remove('open');
      const t = document.getElementById('client-add-trigger');
      if (t) t.style.removeProperty('display');

    async function addClientTask() {
      const input = document.getElementById('client-task-input');
      const title = input?.value.trim();
      if (!title) return;
      const assignee = document.getElementById('client-task-assignee')?.value.trim();
      const due_date = document.getElementById('client-task-due')?.value;
      const service = activeTaskTab && activeTaskTab !== 'General' ? activeTaskTab : null;
      if (input) input.value = '';
      if (document.getElementById('client-task-assignee')) document.getElementById('client-task-assignee').value = '';
      if (document.getElementById('client-task-due')) document.getElementById('client-task-due').value = '';
      const res = await fetch('/api/tasks', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ client_id: clientId, title, service, assignee: assignee || null, due_date: due_date || null })
      });
      if (!res.ok) {
        console.error('Failed to create task');
        return;
      }
      const { id } = await res.json();
      clientTasksAll.push({ id, title, status: 'todo', service: service || 'General', assignee: assignee || null, due_date: due_date || null });
      renderTasksTab();
    }

          </div>
        </div>`;
      overlay.addEventListener('click', e => { if (e.target === overlay) closeMeetingModal(); });
      document.body.appendChild(overlay);
    }

    function closeMeetingModal() {
      document.getElementById('meeting-modal-overlay')?.remove();
    }

    async function saveMeeting(existingId) {
      const date = document.getElementById('mtg-date').value;
      const type = document.querySelector('input[name="mtg-type"]:checked')?.value || 'online';
      const notes = document.getElementById('mtg-notes').value.trim();

      if (existingId !== null) {
        await fetch(`/api/clients/${clientId}/meetings/${existingId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scheduled_date: date || null, meeting_type: type, notes: notes || null })
        });
        const m = clientMeetings.find(x => x.id === existingId);
        if (m) { m.scheduled_date = date || null; m.meeting_type = type; m.notes = notes || null; }
      } else {
        const res = await fetch(`/api/clients/${clientId}/meetings`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: 'Internal Brief', scheduled_date: date || null, meeting_type: type, notes: notes || null })
        });
        const m = await res.json();
        clientMeetings.push(m);
      }

      closeMeetingModal();
      const qcg = document.querySelector('.quick-cards-grid');
      if (qcg) qcg.innerHTML = quickCardsHtml();
    }

    // ── AI Research modal ─────────────────────────────────────────────────────

    async function openCbResearch(campId) {
      let overlay = document.getElementById('cb-research-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'cb-research-overlay';
        overlay.style.cssText = 'display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;align-items:center;justify-content:center;';
        overlay.innerHTML = `
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px;width:560px;max-width:95vw;max-height:80vh;display:flex;flex-direction:column;gap:16px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div style="font-size:15px;font-weight:700;">✦ Campaign Research Brief</div>
              <button onclick="document.getElementById('cb-research-overlay').style.display='none'" style="background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;line-height:1;">×</button>
            </div>
            <div id="cb-research-body" style="flex:1;overflow-y:auto;font-size:13px;line-height:1.7;color:var(--text);"></div>
            <div style="display:flex;justify-content:flex-end;">
              <button class="btn btn-ghost" onclick="document.getElementById('cb-research-overlay').style.display='none'">Close</button>
            </div>
          </div>`;
        overlay.addEventListener('click', e => { if (e.target === overlay) overlay.style.display = 'none'; });
        document.body.appendChild(overlay);
      }
      const body = document.getElementById('cb-research-body');
      body.innerHTML = '<p style="color:var(--text-muted);">Generating research brief…</p>';
      overlay.style.display = 'flex';
      try {
        const res = await fetch(`/api/pitch-lists/campaign/${campId}/research`, { method: 'POST' });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        body.innerHTML = data.brief
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/^- (.+)$/gm, '<div style="padding:2px 0 2px 12px;border-left:2px solid var(--border);margin-bottom:3px;">$1</div>')
          .replace(/\n\n/g, '<br><br>')
          .replace(/\n/g, '<br>');
      } catch (err) {
        body.innerHTML = `<p style="color:var(--danger);">Failed: ${escHtml(err.message)}</p>`;
      }
    }

    // ── Brain ──────────────────────────────────────────────────────────────────

    const TYPE_COLORS = {
      'Meeting Notes':             '#60a5fa',
      'Client Feedback':           '#f59e0b',
      'Coverage Win':              '#22c55e',
      'General Note':              '#94a3b8',
      'Link / Resource':           '#c084fc',
      'Newsroom Research':         '#22d3ee',
      'Client / Project Research': '#22d3ee',
      'Angles':                    '#fbbf24',
      'Publication Research':      '#22d3ee',
      'Strategy Summary':          '#a78bfa',
      'Campaign Update':           '#34d399',
    };

    const ALL_TYPES = [
      ['Meeting Notes'],['Client Feedback'],['Coverage Win'],['General Note'],['Link / Resource'],
      ['Newsroom Research'],['Client / Project Research'],['Angles'],['Publication Research'],
      ['Strategy Summary'],['Campaign Update'],
    ];

    function typeOptions(selected) {
      return ALL_TYPES.map(([v]) =>
        `<option value="${escAttr(v)}"${v === selected ? ' selected' : ''}>${escHtml(v)}</option>`
      ).join('');
    }

    function fmtBrainDate(iso) {
      const d = new Date(iso), now = new Date();
      const h = (now - d) / 3600000;
      if (h < 1) return 'Just now';
      if (h < 24) return `${Math.floor(h)}h ago`;
      if (h < 48) return 'Yesterday';
      return d.toLocaleDateString('en-AU', { day:'numeric', month:'short', ...(d.getFullYear()!==now.getFullYear()?{year:'numeric'}:{}) });
    }

    let brainCache = [];
    let brainSearchTimer;

    function renderBrainEntry(e) {
      const col = TYPE_COLORS[e.type] || '#94a3b8';
      return `
        <div class="brain-entry${e.pinned ? ' pinned' : ''}" id="entry-${e.id}">
          <div class="brain-entry-meta">
            <span class="type-chip" style="color:${col};background:${col}22;">${escHtml(e.type)}</span>
            ${e.campaign_name ? `<span class="camp-chip">${escHtml(e.campaign_name)}</span>` : ''}
            <span class="brain-ts">${fmtBrainDate(e.created_at)}</span>
            <div class="brain-entry-actions">
              <button class="icon-btn${e.pinned ? ' pin-on' : ''}" onclick="brainTogglePin(${e.id},${!!e.pinned})" title="${e.pinned?'Unpin':'Pin'}">📌</button>
              <button class="icon-btn" onclick="brainStartEdit(${e.id})" title="Edit">✎</button>
              <button class="icon-btn" onclick="brainDeleteEntry(${e.id})" title="Delete">✕</button>
            </div>
          </div>
          <div class="brain-entry-body">${escHtml(e.body)}</div>
        </div>`;
    }

    async function fetchAndRenderEntries() {
      const type = document.getElementById('filter-type')?.value || '';
      const camp = document.getElementById('filter-campaign')?.value || '';
      const q    = document.getElementById('brain-search')?.value || '';
      const params = new URLSearchParams();
      if (type) params.set('type', type);
      if (camp) params.set('campaign_id', camp);
      if (q)    params.set('q', q);
      const entries = await fetch(`/api/clients/${clientId}/brain?${params}`).then(r=>r.json()).catch(()=>[]);
      brainCache = entries;
      const el  = document.getElementById('brain-feed');
      const btn = document.getElementById('brain-summarise-btn');
      if (btn) btn.style.display = entries.length ? 'inline-flex' : 'none';
      if (!el) return;
      if (!entries.length) { el.innerHTML = '<p style="color:var(--text-dim);font-size:13px;margin-top:8px;">No entries yet.</p>'; return; }
      el.innerHTML = renderGroupedFeed(entries, renderBrainEntry);
    }

    function groupEntries(entries) {
      const now = new Date();
      const todayStart = new Date(now); todayStart.setHours(0,0,0,0);
      const weekStart  = new Date(todayStart); weekStart.setDate(weekStart.getDate() - 7);
      const groups = { pinned: [], today: [], week: [], older: [] };
      entries.forEach(e => {
        if (e.pinned) { groups.pinned.push(e); return; }
        const d = new Date(e.created_at);
        if (d >= todayStart)      groups.today.push(e);
        else if (d >= weekStart)  groups.week.push(e);
        else                      groups.older.push(e);
      });
      return groups;
    }

    function renderGroupedFeed(entries, renderFn) {
      const { pinned, today, week, older } = groupEntries(entries);
      let html = '';
      if (pinned.length) html += `
        <div class="brain-group">
          <div class="brain-group-header">📌 Pinned</div>
          ${pinned.map(renderFn).join('')}
        </div>`;
      if (today.length) html += `
        <div class="brain-group">
          <div class="brain-group-header">Today</div>
          ${today.map(renderFn).join('')}
        </div>`;
      if (week.length) html += `
        <div class="brain-group">
          <div class="brain-group-header clickable" onclick="toggleBrainGroup(this)">
            This Week <span class="brain-group-count">(${week.length})</span>
            <span class="brain-group-toggle">▴</span>
          </div>
          <div class="brain-group-body">${week.map(renderFn).join('')}</div>
        </div>`;
      if (older.length) html += `
        <div class="brain-group">
          <div class="brain-group-header clickable" onclick="toggleBrainGroup(this)">
            Older <span class="brain-group-count">(${older.length})</span>
            <span class="brain-group-toggle">▾</span>
          </div>
          <div class="brain-group-body" style="display:none;">${older.map(renderFn).join('')}</div>
        </div>`;
      return html;
    }

    function toggleBrainGroup(header) {
      const body = header.nextElementSibling;
      const open = body.style.display !== 'none';
      body.style.display = open ? 'none' : '';
      header.querySelector('.brain-group-toggle').textContent = open ? '▾' : '▴';
    }

    function toggleAddForm() {
      const form = document.getElementById('brain-add-form');
      const visible = form.style.display !== 'none';
      form.style.display = visible ? 'none' : '';
      if (!visible) document.getElementById('add-body').focus();
    }

    async function submitAddForm() {
      const type        = document.getElementById('add-type').value;
      const body        = document.getElementById('add-body').value.trim();
      const campaign_id = document.getElementById('add-campaign').value || null;
      if (!body) return;
      await fetch(`/api/clients/${clientId}/brain`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, body, campaign_id })
      });
      document.getElementById('add-body').value = '';
      document.getElementById('brain-add-form').style.display = 'none';
      fetchAndRenderEntries();
      const btn = document.getElementById('brain-summarise-btn');
      if (btn && btn.textContent === 'Regenerate') {
        btn.textContent = 'Update Summary';
        btn.style.background = 'var(--accent)';
        btn.style.color = '#fff';
      }
    }

    function brainStartEdit(id) {
      const e = brainCache.find(x => x.id === id);
      if (!e) return;
      document.getElementById(`entry-${id}`).innerHTML = `
        <div style="display:flex;gap:8px;margin-bottom:10px;">
          <select id="edit-type-${id}" style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;padding:5px 8px;">
            ${typeOptions(e.type)}
          </select>
        </div>
        <textarea id="edit-body-${id}" style="width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;padding:10px;resize:vertical;min-height:80px;font-family:inherit;box-sizing:border-box;">${escHtml(e.body)}</textarea>
        <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end;">
          <button class="btn btn-ghost" onclick="brainCancelEdit(${id})">Cancel</button>
          <button class="btn btn-primary" onclick="brainSaveEdit(${id})">Save</button>
        </div>`;
    }

    async function brainSaveEdit(id) {
      const body = document.getElementById(`edit-body-${id}`)?.value?.trim();
      const type = document.getElementById(`edit-type-${id}`)?.value;
      if (!body) return;
      await fetch(`/api/brain/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ body, type })
      });
      fetchAndRenderEntries();
    }

    function brainCancelEdit(id) {
      const e = brainCache.find(x => x.id === id);
      if (!e) return fetchAndRenderEntries();
      document.getElementById(`entry-${id}`).outerHTML = renderBrainEntry(e);
    }

    async function brainDeleteEntry(id) {
      if (!confirm('Delete this entry?')) return;
      await fetch(`/api/brain/${id}`, { method: 'DELETE' });
      fetchAndRenderEntries();
    }

    async function brainTogglePin(id, currentPinned) {
      await fetch(`/api/brain/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pinned: !currentPinned })
      });
      fetchAndRenderEntries();
    }

    function debouncedSearch() {
      clearTimeout(brainSearchTimer);
      brainSearchTimer = setTimeout(fetchAndRenderEntries, 300);
    }

    function renderBrainOverview({ summary, updates = [], action_items = [] }) {
      const s = document.getElementById('brain-card-summary');
      const u = document.getElementById('brain-card-updates');
      const a = document.getElementById('brain-card-actions');
      if (s) s.innerHTML = `<div class="brain-overview-label">Summary</div>
        ${summary
          ? `<p style="font-size:13px;line-height:1.7;margin:0;">${escHtml(summary)}</p>`
          : '<p style="color:var(--text-dim);font-size:13px;margin:0;">No summary yet.</p>'}`;
      if (u) u.innerHTML = `<div class="brain-overview-label">Updates</div>
        ${updates.length
          ? `<ul class="brain-overview-list">${updates.map(x => `<li>${escHtml(x)}</li>`).join('')}</ul>`
          : '<p style="color:var(--text-dim);font-size:13px;margin:0;">No updates yet.</p>'}`;
      if (a) a.innerHTML = `<div class="brain-overview-label">Action Items</div>
        ${action_items.length
          ? `<div class="brain-overview-actions">${action_items.map(x => `
              <div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px;font-size:13px;">
                ${x.who ? `<span style="background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 8px;font-size:11px;font-weight:600;white-space:nowrap;">${escHtml(x.who)}</span>` : ''}
                ${x.what ? `<span>${escHtml(x.what)}</span>` : ''}
                ${x.where ? `<span style="color:var(--text-muted);">@ ${escHtml(x.where)}</span>` : ''}
              </div>`).join('')}</div>`
          : '<p style="color:var(--text-dim);font-size:13px;margin:0;">No action items yet.</p>'}`;
    }

    async function loadBrainOverview(regenerate = false) {
      const btn = document.getElementById('brain-summarise-btn');
      if (btn) btn.disabled = true;
      try {
        const url = `/api/clients/${clientId}/brain/summary${regenerate ? '?regenerate=true' : ''}`;
        const data = await fetch(url).then(r => r.json());
        renderBrainOverview(data);
        if (btn) {
          btn.style.background = '';
          btn.style.color = '';
          btn.textContent = regenerate ? '✓ Updated' : 'Regenerate';
          btn.disabled = false;
          if (regenerate) setTimeout(() => { btn.textContent = 'Regenerate'; }, 2000);
        }
      } catch {
        if (btn) { btn.style.background = ''; btn.style.color = ''; btn.disabled = false; }
      }
    }

    function loadBrainSummary() { loadBrainOverview(true); }

    async function loadBrainFeed() {
      loadBrainOverview(false);
      const filterSel = document.getElementById('filter-campaign');
      const addSel    = document.getElementById('add-campaign');
      if (filterSel && addSel) {
        campaigns.forEach(c => {
          const opt = `<option value="${c.id}">${escHtml(c.name)}</option>`;
          filterSel.insertAdjacentHTML('beforeend', opt);
          addSel.insertAdjacentHTML('beforeend', opt);
        });
      }
      await fetchAndRenderEntries();
    }

    load();

  </script>
</body>
</html>
