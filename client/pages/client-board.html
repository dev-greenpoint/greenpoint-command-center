<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Board — Greenpoint</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    .board-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab-bar {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 7px 18px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      background: none;
      border: none;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      transition: color .15s, background .15s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text); background: var(--surface-2); }
    .tab-btn.active { background: var(--accent); color: #fff; font-weight: 600; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Collapsible sections */
    .brief-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .brief-toggle .toggle-icon {
      font-size: 11px;
      color: var(--text-dim);
      transition: transform 0.2s;
    }
    .brief-toggle.collapsed .toggle-icon { transform: rotate(-90deg); }
    .brief-body {
      overflow: hidden;
      transition: max-height 0.25s ease, opacity 0.2s ease;
      max-height: 2000px;
      opacity: 1;
    }
    .brief-body.collapsed { max-height: 0; opacity: 0; }

    /* Status chips */
    .status-chip { display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:600; }
    .chip-active    { background:#0d3323;color:var(--success); }
    .chip-draft     { background:var(--surface-2);color:var(--text-muted); }
    .chip-paused    { background:#3d2a00;color:var(--warning); }
    .chip-completed { background:#1a1a2e;color:#8888cc; }
    .chip-onboarding{ background:#3d2a00;color:var(--warning); }
    .chip-inactive  { background:var(--surface-2);color:var(--text-muted); }
    .chip-setup     { background:#0a1a2e;color:#5599dd; }

    /* Campaign status dropdown */
    .camp-status-wrap { position:relative; }
    .camp-status-chip { cursor:pointer; }
    .camp-status-drop { display:none;position:absolute;top:calc(100% + 4px);right:0;z-index:300;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 6px 16px rgba(0,0,0,0.35);padding:4px;min-width:150px; }
    .camp-status-drop.open { display:block; }
    .camp-status-opt { padding:6px 10px;border-radius:4px;font-size:12px;cursor:pointer;white-space:nowrap; }
    .camp-status-opt:hover { background:var(--surface-2); }

    .camp-tab {
      padding: 7px 18px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      background: none;
      border: none;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      transition: color .15s, background .15s;
      white-space: nowrap;
    }
    .camp-tab:hover { color: var(--text); background: var(--surface-2); }
    .camp-tab.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .service-group { margin-bottom: 16px; }
    .service-group:last-child { margin-bottom: 0; }
    .service-group-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .05em; color: var(--text-dim); padding: 6px 0 4px;
    }

    /* Shared compact task rows */
    .cb-task-cols,
    .cb-task-row {
      display: grid;
      grid-template-columns: 18px 1fr 120px 95px 85px 22px;
      gap: 0 8px;
      align-items: center;
    }
    .cb-task-cols {
      padding: 0 4px 5px;
      border-bottom: 1px solid var(--border);
      font-size: 10px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: .06em;
    }
    .cb-task-row {
      padding: 0 4px; min-height: 34px;
      border-bottom: 1px solid var(--border);
    }
    .cb-task-row:last-child { border-bottom: none; }
    .cb-task-row:hover { background: var(--surface-2); }
    .cb-task-row.done .cb-cell-title > span { text-decoration: line-through; color: var(--text-dim); }
    .cb-task-row input[type=checkbox] { width: 13px; height: 13px; cursor: pointer; accent-color: var(--accent); }
    .cb-cell { position: relative; cursor: text; min-width: 0; }
    .cb-cell > span { display: block; font-size: 13px; line-height: 1; padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cb-cell-assignee > span, .cb-cell-due > span { font-size: 12px; color: var(--text-muted); }
    .cb-cell input, .cb-cell select {
      display: none; width: 100%; box-sizing: border-box;
      background: var(--surface); border: 1px solid var(--accent);
      border-radius: 4px; color: var(--text); font-size: 12px; padding: 3px 6px;
    }
    .cb-cell select { font-size: 11px; padding: 3px 4px; }
    .cb-cell input:focus, .cb-cell select:focus { outline: none; }
    .cb-cell.editing > span { display: none; }
    .cb-cell.editing input, .cb-cell.editing select { display: block; }
    .cb-del { background: none; border: none; color: transparent; cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }
    .cb-task-row:hover .cb-del { color: var(--text-dim); }
    .cb-del:hover { color: var(--danger) !important; }

    /* Progress chips */
    .progress-chip { display: inline-block; padding: 2px 7px; border-radius: 100px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
    .pc-not-assigned { background: var(--surface-2); color: var(--text-dim); }
    .pc-planned      { background: #0d1f33; color: #6699cc; }
    .pc-in-progress  { background: #2a1800; color: #cc8800; }
    .pc-in-review    { background: #1a0a2e; color: #9966cc; }
    .pc-complete     { background: #0d3323; color: var(--success); }

    /* Assignee avatar */
    .av { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 700; flex-shrink: 0; vertical-align: middle; color: #fff; }
    .cb-cell-assignee { cursor: pointer; overflow: visible !important; }
    .cb-cell-assignee > span { display: flex; align-items: center; gap: 5px; }
    .av-dropdown { display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 300; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 6px 16px rgba(0,0,0,0.35); padding: 4px; min-width: 150px; }
    .av-dropdown.open { display: block; }
    .av-option { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .av-option:hover { background: var(--surface-2); }

    /* Campaign timeline bar */
    .campaign-bar {
      height: 6px;
      background: var(--surface-2);
      border-radius: 3px;
      overflow: hidden;
      margin: 8px 0;
    }
    .campaign-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    /* Campaign items */
    .camp-item { border-bottom: 1px solid var(--border); }
    .camp-item:last-child { border-bottom: none; }
    .camp-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      cursor: pointer;
    }

    /* Embedded stage list */
    .camp-stage-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 7px;
      border-radius: var(--radius);
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s;
    }
    .camp-stage-row:hover { background: var(--surface-2); }
    .camp-stage-row.active { background: var(--surface-2); border-color: var(--accent); }
    .camp-stage-row.done .camp-stage-num { background: var(--success); color: #000; border-color: var(--success); }
    .camp-stage-num {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--surface-2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 700; flex-shrink: 0; color: var(--text-muted);
    }
    .camp-stage-row.active .camp-stage-num { background: var(--accent); color: #000; border-color: var(--accent); }
    .camp-stage-name { font-size: 11px; font-weight: 500; flex: 1; }
    .camp-stage-tick { font-size: 10px; color: var(--success); opacity: 0; }
    .camp-stage-row.done .camp-stage-tick { opacity: 1; }

    /* Add task inline form */
    .cb-add-trigger { font-size: 12px; color: var(--text-dim); cursor: pointer; padding: 6px 4px; }
    .cb-add-trigger:hover { color: var(--accent); }
    .cb-add-form { display: none; }
    .cb-add-form.open { display: grid; grid-template-columns: 1fr 90px 80px auto auto; gap: 5px; align-items: center; padding: 6px 4px; }
    .cb-add-form input { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 12px; padding: 4px 7px; width: 100%; box-sizing: border-box; }
    .cb-add-form input:focus { outline: none; border-color: var(--accent); }

    /* Drawer */
    .drawer-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200; }
    .drawer-overlay.open { display:block; }
    .drawer { position:fixed;top:0;right:-440px;width:440px;height:100%;background:var(--surface);border-left:1px solid var(--border);z-index:201;display:flex;flex-direction:column;transition:right 0.25s ease; }
    .drawer.open { right:0; }
    .drawer-wide { width:600px;right:-600px; }
    .drawer-wide.open { right:0; }

    /* Strategy drawer content */
    .strat-section { border-bottom:1px solid var(--border);padding:16px 0; }
    .strat-section:last-child { border-bottom:none; }
    .strat-section-label { font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);margin-bottom:10px; }
    .strat-section-body { font-size:13px;line-height:1.75;color:var(--text); }
    .strat-section-body h1,.strat-section-body h2,.strat-section-body h3 { font-size:13px;font-weight:700;margin:12px 0 4px; }
    .strat-section-body h1:first-child,.strat-section-body h2:first-child,.strat-section-body h3:first-child { margin-top:0; }
    .strat-section-body p { margin:0 0 8px; }
    .strat-section-body p:last-child { margin-bottom:0; }
    .strat-section-body ul,.strat-section-body ol { margin:0 0 8px;padding-left:18px; }
    .strat-section-body li { margin-bottom:3px; }
    .strat-section-body strong { font-weight:700; }
    .drawer-header { display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border); }
    .drawer-header h2 { font-size:15px;font-weight:600; }
    .drawer-close { background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:20px;line-height:1; }
    .drawer-body { flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px; }
    .drawer-footer { padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px; }

    .placeholder-section {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content" id="page-content">
        <p style="color:var(--text-muted);">Loading…</p>
      </main>
    </div>
  </div>

  <!-- Campaign drawer -->
  <div class="drawer-overlay" id="camp-overlay"></div>
  <div class="drawer" id="camp-drawer">
    <div class="drawer-header">
      <h2>New Campaign</h2>
      <button class="drawer-close" onclick="closeCampDrawer()">×</button>
    </div>
    <div class="drawer-body">
      <div class="form-group">
        <label>Type</label>
        <select id="cd-type" onchange="updateCampDrawerSetup()">
          <option value="">Select type</option>
          <option value="PR">PR</option>
          <option value="PR Light">PR Light</option>
          <option value="Social Media">Social Media</option>
          <option value="Content">Content</option>
          <option value="Events & Partnerships">Events & Partnerships</option>
          <option value="Awards">Awards</option>
          <option value="Paid Media">Paid Media</option>
          <option value="Design">Design</option>
        </select>
      </div>
      <div class="form-group">
        <label>Campaign Name</label>
        <input type="text" id="cd-name" placeholder="e.g. Spring Launch PR">
      </div>
      <div id="cd-setup-items" style="display:none;border-top:1px solid var(--border);padding-top:16px;margin-top:4px;"></div>
    </div>
    <div class="drawer-footer">
      <button class="btn btn-primary" id="cd-save">Create Campaign</button>
      <button class="btn btn-ghost" onclick="closeCampDrawer()">Cancel</button>
    </div>
  </div>

  <!-- Strategy drawer -->
  <div class="drawer-overlay" id="strat-overlay" onclick="closeStrategyDrawer()"></div>
  <div class="drawer drawer-wide" id="strat-drawer">
    <div class="drawer-header">
      <div>
        <h2 id="strat-drawer-title" style="margin:0;">Strategy</h2>
        <div id="strat-drawer-meta" style="font-size:11px;color:var(--text-muted);margin-top:2px;"></div>
      </div>
      <button class="drawer-close" onclick="closeStrategyDrawer()">×</button>
    </div>
    <div class="drawer-body" id="strat-drawer-body">
      <p style="font-size:13px;color:var(--text-muted);">Loading…</p>
    </div>
    <div class="drawer-footer" id="strat-drawer-footer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/components/shell.js"></script>
  <script>
    const clientId = location.pathname.split('/')[2];

    const STAGES = {
      'PR':                                       ['Campaign Prep','Campaign Development','Awaiting Approval','Set up Public Address','Pitch!','Campaign Complete'],
      'PR Light':                                 ['Campaign Prep','Campaign Development','Awaiting Approval','Set up Public Address','Pitch!','Campaign Complete'],
      'Social Media':                             ['Schedule Prep','Content Creation','Content Scheduling & Boosting'],
      'Content':                                  ['Schedule Prep','Content Creation','Content Scheduling & Boosting'],
      'Events & Partnerships':                    ['Event Deck & Budget','Event Planning','Event Day'],
      'Awards':                                   ['Submission'],
      'Paid Media':                               ['Planning','In Progress','Review','Wrap-up'],
      'Design':                                   ['Briefing','Design','Revisions','Final Delivery'],
      default:                                    ['Planning','In Progress','Review','Wrap-up'],
    };

    // Map client service names → campaign section labels
    const SERVICE_TYPE_MAP = {
      'PR':                                    'PR',
      'PR Light':                              'PR Light',
      'Content - Social':                      'Social',
      'Content - eDM':                         'Other',
      'Content - Web/Blogs/Other Copy':        'Other',
      'Content - Influencer':                  'Other',
      'Content - Shortform Capture':           'Other',
      'Content - Video Production':            'Other',
      'Brand Activation - Events & Partnerships': 'Events & Partnerships',
      'Awards':                                'Awards',
      'Paid Media':                            'Paid Media',
      'Design':                                'Design',
    };

    // Board URL per type
    function campBoardUrl(c) {
      return c.type === 'Social Media' ? `/social/${c.id}` : `/campaigns/${c.id}`;
    }

    // Section label → campaign type stored in DB
    const SECTION_DB_TYPE = {
      'PR':                  'PR',
      'PR Light':            'PR Light',
      'Social':              'Social Media',
      'Other':               'Content',
      'Events & Partnerships': 'Events & Partnerships',
      'Awards':              'Awards',
      'Paid Media':          'Paid Media',
      'Design':              'Design',
    };

    let campaigns = [];
    let clientStrategies = [];
    let client = null;
    let clientChecklist = [];
    let allTeamMembers = [];
    const selectedStages = {};
    const expandedCamps = new Set();
    const campTasksData = {};
    let clientTeam = [];
    let activeCampTypeTab = null;
    let clientTasksAll = [];
    let activeTaskTab = null;

    // Maps section label → which checklist categories belong in it
    const SECTION_CHECKLIST_CATEGORIES = {
      'PR':                    ['PR'],
      'PR Light':              ['PR Light'],
      'Social':                ['Content - Social'],
      'Other':                 ['Content - eDM','Content - Web/Blogs/Other Copy','Content - Influencer','Content - Shortform Capture','Content - Video Production'],
      'Events & Partnerships': ['Brand Activation - Events & Partnerships'],
      'Awards':                ['Awards'],
      'Paid Media':            ['Paid Media'],
      'Design':                ['Design'],
    };

    // ── Helpers ────────────────────────────────────────────────────────────────

    function avatarColor(name) {
      const palette = ['#5b5fcf','#2e7d32','#8e3a7a','#d4870a','#0277bd','#6a4f00','#00695c','#b71c1c'];
      let h = 0;
      for (let i = 0; i < (name||'').length; i++) h = (name.charCodeAt(i) + ((h << 5) - h)) | 0;
      return palette[Math.abs(h) % palette.length];
    }
    function avatarHtml(name, size=20) {
      if (!name) return '';
      const initials = name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
      return `<span class="av" style="width:${size}px;height:${size}px;background:${avatarColor(name)};font-size:${Math.round(size*.42)}px">${initials}</span>`;
    }
    function assigneeDisplay(name) {
      return name ? `${avatarHtml(name)} ${name}` : '<span style="color:var(--text-dim)">—</span>';
    }
    function openCbAssigneeSelector(event, taskId, prefix) {
      event.stopPropagation();
      const drop = document.getElementById(`av-drop-${prefix}-${taskId}`);
      const isOpen = drop && drop.classList.contains('open');
      document.querySelectorAll('.av-dropdown.open').forEach(d => d.classList.remove('open'));
      if (!isOpen && drop) drop.classList.add('open');
    }
    document.addEventListener('click', () => {
      document.querySelectorAll('.av-dropdown.open, .camp-status-drop.open').forEach(d => d.classList.remove('open'));
    });

    function progressClass(p) {
      return { 'Not Assigned':'pc-not-assigned','Planned':'pc-planned','In Progress':'pc-in-progress','In Review':'pc-in-review','Complete':'pc-complete' }[p] || 'pc-not-assigned';
    }
    function taskStatusClass(s) {
      return { 'todo':'pc-not-assigned','in_progress':'pc-in-progress','done':'pc-complete' }[s] || 'pc-not-assigned';
    }
    function taskStatusLabel(s) {
      return { 'todo':'To Do','in_progress':'In Progress','done':'Done' }[s] || 'To Do';
    }

    function avDropdownHtml(dropId, callPrefix) {
      // callPrefix e.g. "selectClientAssignee(5," or "selectCampAssignee(7,5,"
      return `<div class="av-dropdown" id="${dropId}">
        <div class="av-option" onclick="event.stopPropagation();${callPrefix}null)">
          <span style="font-size:11px;color:var(--text-dim)">— Unassign</span>
        </div>
        ${clientTeam.map(name => `<div class="av-option" onclick="event.stopPropagation();${callPrefix}'${name.replace(/'/g,"\\'")}')">
          ${avatarHtml(name)} ${name}</div>`).join('')}
      </div>`;
    }
    async function selectClientAssignee(taskId, name) {
      document.querySelectorAll('.av-dropdown.open').forEach(d => d.classList.remove('open'));
      await cbSaveClientField(taskId, 'assignee', name);
    }
    async function selectCampAssignee(campId, taskId, name) {
      document.querySelectorAll('.av-dropdown.open').forEach(d => d.classList.remove('open'));
      await cbSaveCampField(campId, taskId, 'assignee', name);
    }

    // ── Shared cell edit ───────────────────────────────────────────────────────

    function cbEditCell(cell) {
      cell.classList.add('editing');
      const el = cell.querySelector('input, select');
      if (!el) return;
      el.focus();
      if (el.type === 'text') el.select();
    }
    function cbCancelCell(cell) { cell.classList.remove('editing'); }

    // ── Main load ──────────────────────────────────────────────────────────────

    async function load() {
      const [profileRes, campaignsRes, strategiesRes, teamMembersRes] = await Promise.all([
        fetch(`/api/clients/${clientId}/profile`),
        fetch(`/api/campaigns/client/${clientId}`),
        fetch(`/api/strategies/client/${clientId}`),
        fetch('/api/team-members')
      ]);
      allTeamMembers = teamMembersRes.ok ? await teamMembersRes.json() : [];
      if (!profileRes.ok) {
        document.getElementById('page-content').innerHTML = '<p style="color:var(--danger);">Client not found.</p>';
        return;
      }
      campaigns = campaignsRes.ok ? await campaignsRes.json() : [];
      campaigns.forEach(c => expandedCamps.add(c.id));
      clientStrategies = strategiesRes.ok ? await strategiesRes.json() : [];
      const { client: clientData, checklist, tasks, team, contacts } = await profileRes.json();
      client = clientData;
      clientChecklist = checklist || [];
      clientTasksAll = tasks || [];
      clientTeam = (team || []).map(m => m.name).filter(Boolean);
      renderShell({ pageId: 'client-' + clientId, title: client.name });

      const statusClass = client.status === 'active' ? 'chip-active' : client.status === 'onboarding' ? 'chip-onboarding' : 'chip-inactive';
      const statusLabel = client.status.charAt(0).toUpperCase() + client.status.slice(1);

      const today = new Date();
      const start = client.start_date ? new Date(client.start_date) : null;
      const end = client.end_date ? new Date(client.end_date) : null;
      let campaignPct = 0, campaignStatus = '';
      if (start && end) {
        const total = end - start;
        const elapsed = today - start;
        campaignPct = Math.min(100, Math.max(0, Math.round((elapsed / total) * 100)));
        const daysLeft = Math.max(0, Math.round((end - today) / (1000 * 60 * 60 * 24)));
        campaignStatus = daysLeft > 0 ? `${daysLeft} days remaining` : 'Campaign ended';
      }

      const totalTasks = tasks.length;
      const doneTasks = tasks.filter(t => t.status === 'done').length;
      const taskPct = totalTasks ? Math.round((doneTasks / totalTasks) * 100) : 0;

      const grouped = {};
      tasks.forEach(t => {
        const svc = t.service || 'General';
        if (!grouped[svc]) grouped[svc] = [];
        grouped[svc].push(t);
      });

      document.getElementById('page-content').innerHTML = `
        <div class="board-header">
          <h1 style="font-size:20px;font-weight:700;">${client.name}</h1>
          <span class="status-chip ${statusClass}">${statusLabel}</span>
          ${client.industry ? `<span style="font-size:12px;color:var(--text-muted);">${client.industry}</span>` : ''}
          <div style="flex:1;"></div>
          ${client.status === 'onboarding' ? `<button class="btn btn-primary" style="font-size:12px;" id="complete-onboarding-btn" onclick="completeOnboarding()">Complete Onboarding</button>` : ''}
          <a href="/clients/${clientId}" class="btn btn-ghost" style="font-size:12px;">Edit Profile</a>
        </div>

        <div class="tab-bar" style="align-items:flex-end;">
          <button class="tab-btn active" onclick="switchTab('one', this)">Campaigns</button>
          <button class="tab-btn" onclick="switchTab('two', this)">Client Info</button>
          <button class="tab-btn" onclick="switchTab('three', this)">Tasks</button>
        </div>

        <!-- Tab One — 2-column layout -->
        <div class="tab-panel active" id="tab-one">
          <div style="display:grid;grid-template-columns:3fr 1fr;gap:16px;align-items:start;">
            <!-- Column 1 — Campaigns -->
            <div>
              <div id="campaigns-sections"></div>
            </div>
            <!-- Column 2 — Documents -->
            <div id="tab-one-col2">
              <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);margin-bottom:12px;">Documents</div>
              <!-- Strategy card -->
              <div class="card" style="margin-bottom:16px;" id="strategy-card">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
                  <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);">Strategy</div>
                  <button class="btn btn-ghost" style="font-size:11px;padding:3px 10px;" id="strategy-new-btn" onclick="newStrategy()">+ New</button>
                </div>
                <div id="strategy-list">
                  <p style="font-size:13px;color:var(--text-dim);">Loading…</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Tab Two — Client Info -->
        <div class="tab-panel" id="tab-two">
          <div style="display:grid;grid-template-columns:3fr 1fr;gap:16px;align-items:start;">

            <!-- Left — tabbed info -->
            <div>
              <div style="display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;">
                <button class="camp-tab active" id="info-tab-brief" onclick="switchInfoTab('brief', this)">Brief</button>
                <button class="camp-tab" id="info-tab-scope" onclick="switchInfoTab('scope', this)">Scope</button>
                <button class="camp-tab" id="info-tab-team" onclick="switchInfoTab('team', this)">Team</button>
              </div>

              <!-- Brief -->
              <div class="info-panel" id="info-panel-brief">
                <div class="card">
                  <p style="font-size:13px;line-height:1.8;color:var(--text);margin:0;">${client.research || '<span style="color:var(--text-muted);">No brief added yet.</span>'}</p>
                </div>
              </div>

              <!-- Scope -->
              <div class="info-panel" id="info-panel-scope" style="display:none;">
                <div class="card">
                  ${start ? `
                  <div style="margin-bottom:16px;">
                    <div style="font-size:11px;color:var(--text-dim);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;">Campaign Period</div>
                    <div class="stat-row"><span>${client.start_date}</span><span>${client.end_date || '—'}</span></div>
                    ${start && end ? `
                    <div class="campaign-bar"><div class="campaign-bar-fill" style="width:${campaignPct}%"></div></div>
                    <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">${campaignPct}% through · ${campaignStatus}</div>
                    ` : ''}
                  </div>` : ''}

                  ${client.monthly_hours ? `
                  <div style="margin-bottom:16px;">
                    <div style="font-size:11px;color:var(--text-dim);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;">Monthly Hours</div>
                    <div style="font-size:15px;font-weight:600;">${client.monthly_hours} hrs</div>
                  </div>` : ''}

                  ${client.services ? `
                  <div style="margin-bottom:16px;">
                    <div style="font-size:11px;color:var(--text-dim);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;">Services</div>
                    <div style="display:flex;flex-wrap:wrap;gap:6px;">
                      ${client.services.split(',').map(s => `<span style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:3px 10px;font-size:12px;font-weight:500;">${s.trim()}</span>`).join('')}
                    </div>
                  </div>` : ''}

                  ${contacts.length ? `
                  <div style="margin-bottom:16px;">
                    <div style="font-size:11px;color:var(--text-dim);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;">Contacts</div>
                    ${contacts.map(c => `
                      <div style="padding:6px 0;border-bottom:1px solid var(--border);">
                        <div style="font-size:13px;font-weight:600;">${c.name}${c.role ? ` <span style="font-weight:400;color:var(--text-muted);">· ${c.role}</span>` : ''}</div>
                        ${c.email ? `<div style="font-size:12px;color:var(--text-muted);">${c.email}</div>` : ''}
                        ${c.phone ? `<div style="font-size:12px;color:var(--text-muted);">${c.phone}</div>` : ''}
                      </div>`).join('')}
                  </div>` : ''}

                  ${client.website ? `
                  <div style="margin-bottom:16px;">
                    <div style="font-size:11px;color:var(--text-dim);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;">Website</div>
                    <a href="${client.website}" target="_blank" style="font-size:13px;color:var(--accent);">${client.website}</a>
                  </div>` : ''}

                  ${client.platforms ? `
                  <div style="margin-bottom:16px;">
                    <div style="font-size:11px;color:var(--text-dim);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;">Platforms</div>
                    <div style="display:flex;flex-wrap:wrap;gap:6px;">
                      ${client.platforms.split(',').map(p => `<span style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:3px 10px;font-size:12px;font-weight:500;">${p.trim()}</span>`).join('')}
                    </div>
                  </div>` : ''}

                  ${client.notes ? `
                  <div>
                    <div style="font-size:11px;color:var(--text-dim);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;">Notes</div>
                    <p style="font-size:13px;line-height:1.7;color:var(--text);margin:0;">${client.notes}</p>
                  </div>` : ''}
                </div>
              </div>

              <!-- Team -->
              <div class="info-panel" id="info-panel-team" style="display:none;">
                <div class="card" id="team-card"></div>
              </div>

            </div>

            <!-- Right — placeholder cards -->
            <div style="display:flex;flex-direction:column;gap:16px;">
              <div class="card" style="min-height:120px;"></div>
              <div class="card" style="min-height:120px;"></div>
            </div>

          </div>
        </div>

        <!-- Tab Three — Tasks -->
        <div class="tab-panel" id="tab-three">
          <div id="tasks-tab-container"></div>
        </div>
      `;

      renderCampaigns();
      renderStrategyCard(clientStrategies);
      renderTeamCard(team);
      renderTasksTab();
    }

    function switchTab(name, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + name).classList.add('active');
    }

    function switchInfoTab(name, btn) {
      document.querySelectorAll('#tab-two .camp-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('#tab-two .info-panel').forEach(p => p.style.display = 'none');
      btn.classList.add('active');
      document.getElementById('info-panel-' + name).style.display = 'block';
    }

    function renderTasksTab() {
      const container = document.getElementById('tasks-tab-container');
      if (!container) return;

      const grouped = {};
      clientTasksAll.forEach(t => {
        const svc = (t.service || 'General').replace(/^Content - /, '');
        if (!grouped[svc]) grouped[svc] = [];
        grouped[svc].push(t);
      });

      const svcs = Object.keys(grouped);
      if (!svcs.length) {
        container.innerHTML = `<div class="card"><p style="font-size:13px;color:var(--text-muted);margin:0;">No tasks yet.</p></div>`;
        return;
      }

      if (!activeTaskTab || !svcs.includes(activeTaskTab)) activeTaskTab = svcs[0];

      const tabTasks = grouped[activeTaskTab] || [];
      const done = tabTasks.filter(t => t.status === 'done').length;
      const pct = tabTasks.length ? Math.round((done / tabTasks.length) * 100) : 0;

      const tabBar = `<div style="display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;">
        ${svcs.map(s => `<button class="camp-tab ${s === activeTaskTab ? 'active' : ''}" onclick="switchTaskTab('${s.replace(/'/g,"\\'")}')">
          ${s}
        </button>`).join('')}
      </div>`;

      const rows = tabTasks.map(t => clientTaskRowHtml(t)).join('');
      const empty = !tabTasks.length ? `<p style="font-size:13px;color:var(--text-muted);">No tasks yet.</p>` : '';

      container.innerHTML = `
        ${tabBar}
        <div class="card" id="client-tasks-card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
            <span style="font-size:12px;color:var(--text-muted);" id="client-task-count">${done}/${tabTasks.length} done</span>
          </div>
          <div class="campaign-bar" style="margin-bottom:12px;">
            <div class="campaign-bar-fill" id="task-progress-bar" style="width:${pct}%"></div>
          </div>
          ${empty}
          <div class="cb-task-cols" ${!tabTasks.length ? 'style="display:none;"' : ''}><div></div><div>Task</div><div>Status</div><div>Assignee</div><div>Due</div><div></div></div>
          <div id="client-tasks-list">${rows}</div>
          <div class="cb-add-trigger" id="client-add-trigger" onclick="showClientAddForm()">+ Add task</div>
          <div class="cb-add-form" id="client-add-form">
            <input id="client-task-input" placeholder="Task title…"
              onkeydown="if(event.key==='Enter')addClientTask();if(event.key==='Escape')hideClientAddForm()">
            <input id="client-task-assignee" placeholder="Assignee">
            <input type="date" id="client-task-due">
            <button class="btn btn-primary" style="font-size:11px;padding:4px 10px;" onclick="addClientTask()">Add</button>
            <button class="btn btn-ghost" style="font-size:11px;padding:4px 8px;" onclick="hideClientAddForm()">✕</button>
          </div>
        </div>`;
    }

    function switchTaskTab(svc) {
      activeTaskTab = svc;
      renderTasksTab();
    }

    // ── Section setup checklist ────────────────────────────────────────────────

    function sectionSetupHtml(sectionLabel) {
      const cats = SECTION_CHECKLIST_CATEGORIES[sectionLabel] || [];
      const items = clientChecklist.filter(i => cats.includes(i.category));
      if (!items.length) return '';
      const total = items.length;
      const done = items.filter(i => i.completed).length;
      // Group by category (relevant for Content - Other which spans multiple)
      const grouped = {};
      items.forEach(i => { if (!grouped[i.category]) grouped[i.category] = []; grouped[i.category].push(i); });
      const showCatLabel = Object.keys(grouped).length > 1;
      return `
        <div class="section-setup" data-section="${sectionLabel}" style="border-top:1px solid var(--border);margin-top:8px;padding-top:10px;margin-bottom:12px;">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
            <span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);">Setup</span>
            <span style="font-size:10px;color:var(--text-muted);" id="setup-count-${sectionLabel.replace(/\s/g,'-')}">${done}/${total}</span>
            ${done < total ? `<button class="mark-all-btn" onclick="markAllSetupDone('${sectionLabel.replace(/'/g,"\\'")}',this)" style="margin-left:auto;font-size:10px;background:none;border:none;color:var(--text-dim);cursor:pointer;padding:0;" title="Mark all done">Mark all done</button>` : ''}
          </div>
          ${Object.entries(grouped).map(([cat, catItems]) => `
            ${showCatLabel ? `<div style="font-size:10px;color:var(--text-dim);font-style:italic;padding:2px 0 4px;">${cat}</div>` : ''}
            ${catItems.map(item => `
              <label style="display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer;${item.completed ? 'color:var(--text-muted);text-decoration:line-through;' : ''}">
                <input type="checkbox" data-item-id="${item.id}" ${item.completed ? 'checked' : ''} style="width:13px;height:13px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;"
                  onchange="toggleServiceItem(${item.id}, this.checked, this, '${sectionLabel.replace(/'/g,"\\'")}')">
                ${item.item}
              </label>
            `).join('')}
          `).join('')}
        </div>`;
    }

    // ── Campaign rendering ─────────────────────────────────────────────────────

    function renderCampaigns() {
      const container = document.getElementById('campaigns-sections');
      if (!container) return;

      // Build tab list from client services + any existing campaign types
      const clientServices = (client && client.services) ? client.services.split(',').map(s => s.trim()) : [];
      const serviceTypes = [...new Set(clientServices.map(s => SERVICE_TYPE_MAP[s]).filter(Boolean))];
      campaigns.forEach(c => {
        const entry = Object.entries(SECTION_DB_TYPE).find(([, v]) => v === c.type);
        const label = entry ? entry[0] : c.type;
        if (label && !serviceTypes.includes(label)) serviceTypes.push(label);
      });

      if (!serviceTypes.length && !campaigns.length) {
        container.innerHTML = `<p style="font-size:13px;color:var(--text-muted);">No campaigns yet.</p>`;
        return;
      }

      const tabs = serviceTypes.length ? serviceTypes : ['All'];

      // Default active tab
      if (!activeCampTypeTab || !tabs.includes(activeCampTypeTab)) {
        activeCampTypeTab = tabs[0];
      }

      const dbType = SECTION_DB_TYPE[activeCampTypeTab] || activeCampTypeTab;
      const tabCampaigns = activeCampTypeTab === 'All' ? campaigns : campaigns.filter(c => c.type === dbType);
      const items = tabCampaigns.map(c => `<div id="camp-card-${c.id}">${renderCampItem(c)}</div>`).join('');
      const empty = tabCampaigns.length === 0
        ? `<p style="font-size:13px;color:var(--text-muted);padding:8px 0;">No ${activeCampTypeTab} campaigns yet.</p>`
        : '';

      const tabBar = `
        <div style="display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;">
          ${tabs.map(t => `
            <button class="camp-tab ${t === activeCampTypeTab ? 'active' : ''}"
              onclick="switchCampTypeTab('${t.replace(/'/g,"\\'")}')">
              ${t}
            </button>`).join('')}
          <div style="flex:1;"></div>
          <button class="btn btn-primary" style="font-size:11px;padding:4px 10px;margin:0 0 6px;" onclick="openCampDrawer('${dbType}')">+ New</button>
        </div>`;

      container.innerHTML = tabBar + empty + items;

      expandedCamps.forEach(id => loadCampTasks(id));
    }

    function renderCampCard(campId) {
      const el = document.getElementById(`camp-card-${campId}`);
      if (!el) return;
      const c = campaigns.find(x => x.id === campId);
      if (!c) return;
      el.innerHTML = renderCampItem(c);
      if (expandedCamps.has(campId)) loadCampTasks(campId);
    }

    function switchCampTypeTab(label) {
      activeCampTypeTab = label;
      const dbType = SECTION_DB_TYPE[label] || label;
      campaigns.filter(c => c.type === dbType).forEach(c => expandedCamps.add(c.id));
      renderCampaigns();
    }

    function renderCampItem(c) {
      const stages = STAGES[c.type] || STAGES.default;
      const currentStage = c.current_stage || 0;
      const selStage = selectedStages[c.id] !== undefined ? selectedStages[c.id] : currentStage;
      const isExpanded = expandedCamps.has(c.id);
      const CAMP_STATUSES = [
        { value: 'to_be_set_up', label: 'To Be Set Up', chip: 'chip-setup' },
        { value: 'draft',        label: 'Draft',         chip: 'chip-draft' },
        { value: 'active',       label: 'Active',        chip: 'chip-active' },
        { value: 'paused',       label: 'Paused',        chip: 'chip-paused' },
        { value: 'completed',    label: 'Completed',     chip: 'chip-completed' },
      ];
      const statusDef = CAMP_STATUSES.find(s => s.value === c.status) || CAMP_STATUSES[1];
      const chipClass = statusDef.chip;
      const statusLabel = statusDef.label;
      const currentStageName = stages[currentStage] || 'Complete';

      const backBtn = selStage > 0
        ? `<button class="btn btn-ghost" style="font-size:11px;padding:3px 8px;" onclick="advanceCampStage(${c.id},${selStage - 1},event)">← Back</button>`
        : '';
      const isLastStage = selStage + 1 === stages.length;
      const pastEnd = selStage >= stages.length;
      const advBtn = pastEnd
        ? `<a href="/pages/reports.html?campaign=${c.id}" class="btn btn-primary" style="font-size:11px;padding:3px 8px;">View Report →</a>`
        : `<button class="btn btn-primary" style="font-size:11px;padding:3px 8px;" onclick="${isLastStage ? `completeCampaign(${c.id},event)` : `advanceCampStage(${c.id},${selStage + 1},event)`}">${isLastStage ? 'Complete →' : 'Advance →'}</button>`;

      const setup = c.setup ? (typeof c.setup === 'string' ? JSON.parse(c.setup) : c.setup) : null;
      const setupHtml = setup ? (() => {
        const parts = [];
        if (setup.angle) parts.push(`<div style="margin-bottom:12px;"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:5px;">Campaign Angle</div><div style="font-size:13px;line-height:1.6;">${setup.angle}</div></div>`);
        if (setup.keyMessages?.length) parts.push(`<div style="margin-bottom:12px;"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:5px;">Key Messages</div>${setup.keyMessages.map(m=>`<div style="font-size:13px;padding:3px 0;border-bottom:1px solid var(--border);">${m}</div>`).join('')}</div>`);
        if (setup.spokespeople?.length) parts.push(`<div style="margin-bottom:4px;"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:5px;">Spokespeople</div>${setup.spokespeople.map(s=>`<div style="font-size:13px;padding:3px 0;border-bottom:1px solid var(--border);">${s}</div>`).join('')}</div>`);
        return parts.length ? `<div style="background:var(--surface-2);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;">${parts.join('')}</div>` : '';
      })() : '';

      const stageTabs = stages.map((s, i) => {
        const done = i < currentStage;
        const active = i === selStage;
        return `<button class="tab-btn ${active ? 'active' : ''}"
          style="${done ? 'color:var(--success);' : ''}"
          onclick="event.stopPropagation();selectCampStage(${c.id},${i})">
          ${s}${done ? ' ✓' : ''}
        </button>`;
      }).join('');

      const expandedHtml = isExpanded ? `
        <div style="padding-bottom:14px;">
          ${setupHtml}
          <!-- Stage tabs -->
          <div style="display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto;">
            ${stageTabs}
          </div>
          <!-- Task panel — fixed height so card doesn't shift cards below -->
          <div style="height:240px;overflow-y:auto;display:flex;flex-direction:column;">
            <div id="camp-tasks-${c.id}" style="flex:1;">
              <p style="font-size:12px;color:var(--text-muted);">Loading…</p>
            </div>
            <div id="cb-add-trigger-${c.id}" class="cb-add-trigger" onclick="showCbAddForm(${c.id})">+ Add task</div>
            <div class="cb-add-form" id="cb-add-form-${c.id}">
              <input id="camp-task-input-${c.id}" placeholder="Task title…"
                onkeydown="if(event.key==='Enter')addCampTask(${c.id});if(event.key==='Escape')hideCbAddForm(${c.id})">
              <input id="camp-task-assignee-${c.id}" placeholder="Assignee">
              <input type="date" id="camp-task-due-${c.id}">
              <button class="btn btn-primary" style="font-size:11px;padding:4px 10px;" onclick="addCampTask(${c.id})">Add</button>
              <button class="btn btn-ghost" style="font-size:11px;padding:4px 8px;" onclick="hideCbAddForm(${c.id})">✕</button>
            </div>
          </div>
          <!-- Footer -->
          <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;">
            <div style="display:flex;gap:6px;">${backBtn}${advBtn}</div>
            <a href="${campBoardUrl(c)}" style="font-size:11px;color:var(--accent);">Open full board →</a>
          </div>
        </div>
      ` : '';

      return `
        <div class="camp-item" data-camp-id="${c.id}">
          <div class="camp-summary" onclick="toggleCamp(${c.id}, ${currentStage})">
            <div>
              <div style="font-size:13px;font-weight:600;">${c.name}</div>
              ${c.type ? `<div style="font-size:11px;color:var(--text-muted);margin-top:1px;">${c.type} · ${currentStageName}</div>` : ''}
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <div class="camp-status-wrap" onclick="event.stopPropagation()">
                <span class="status-chip ${chipClass} camp-status-chip" onclick="toggleCampStatusDrop(${c.id}, this)">${statusLabel}</span>
                <div class="camp-status-drop" id="camp-status-drop-${c.id}">
                  ${CAMP_STATUSES.map(s => `<div class="camp-status-opt" onclick="setCampStatus(${c.id}, '${s.value}')">${s.label}</div>`).join('')}
                </div>
              </div>
              <span class="camp-item-arrow" style="font-size:11px;color:var(--text-dim);">${isExpanded ? '▲' : '▼'}</span>
            </div>
          </div>
          ${expandedHtml}
        </div>
      `;
    }

    // ── Campaign expand / stage / task actions ─────────────────────────────────

    function toggleCamp(campId, currentStage) {
      if (expandedCamps.has(campId)) {
        expandedCamps.delete(campId);
      } else {
        expandedCamps.add(campId);
        if (selectedStages[campId] === undefined) selectedStages[campId] = currentStage;
      }
      renderCampCard(campId);
    }

    function selectCampStage(campId, stageIndex) {
      selectedStages[campId] = stageIndex;
      renderCampCard(campId);
    }

    async function advanceCampStage(campId, newStageIndex, event) {
      if (event) event.stopPropagation();
      const camp = campaigns.find(c => c.id == campId);
      if (!camp) return;
      const stages = STAGES[camp.type] || STAGES.default;
      const clamped = Math.max(0, Math.min(stages.length, newStageIndex));
      await fetch(`/api/campaigns/${campId}/stage`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stage: clamped })
      });
      camp.current_stage = clamped;
      selectedStages[campId] = clamped;
      renderCampCard(campId);
    }

    async function completeCampaign(campId, event) {
      if (event) event.stopPropagation();
      const camp = campaigns.find(c => c.id == campId);
      if (!camp) return;
      const stages = STAGES[camp.type] || STAGES.default;
      await Promise.all([
        fetch(`/api/campaigns/${campId}/stage`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stage: stages.length })
        }),
        fetch(`/api/campaigns/${campId}/status`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'completed' })
        }),
      ]);
      window.location.href = `/pages/reports.html?campaign=${campId}`;
    }

          <div class="cb-task-row ${t.done ? 'done' : ''}" id="camp-task-${t.id}">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleCampTask(${campId}, ${t.id}, this.checked)">

              <select onchange="cbSaveCampField(${campId},${t.id},'progress',this.value)" onblur="cbCancelCell(this.parentElement)">
                ${['Not Assigned','Planned','In Progress','In Review','Complete'].map(o=>`<option${o===prog?' selected':''}>${o}</option>`).join('')}

    async function cbSaveCampField(campId, taskId, field, value) {
      const sanitized = (value && value.trim) ? value.trim() : value;
      if (field === 'title' && !sanitized) { cbCancelCell(document.querySelector(`#camp-task-${taskId} .cb-cell-title`)); return; }
      const row = document.getElementById(`camp-task-${taskId}`);
      if (row) {
        row.querySelectorAll('.cb-cell').forEach(c => c.classList.remove('editing'));
        const cellMap = { title:'title', assignee:'assignee', due_date:'due', progress:'progress' };
        const span = row.querySelector(`.cb-cell-${cellMap[field]} > span`);
        if (span) {
        if (field === 'progress') span.innerHTML = `<span class="progress-chip ${progressClass(sanitized||'Not Assigned')}">${sanitized||'Not Assigned'}</span>`;
        else if (field === 'assignee') span.innerHTML = assigneeDisplay(sanitized);
        else span.innerHTML = sanitized || '<span style=color:var(--text-dim)>—</span>';
      }
      }
      const tasks = campTasksData[campId] || [];
      const task = tasks.find(t => t.id === taskId);
      if (task) task[field] = sanitized || null;
      await fetch(`/api/campaigns/${campId}/tasks/${taskId}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [field]: sanitized || null })
      });
    }

    async function cbSaveClientField(taskId, field, value) {
      const sanitized = (value && value.trim) ? value.trim() : value;
      if (field === 'title' && !sanitized) { cbCancelCell(document.querySelector(`#client-task-${taskId} .cb-cell-title`)); return; }
      const row = document.getElementById(`client-task-${taskId}`);
      if (row) {
        row.querySelectorAll('.cb-cell').forEach(c => c.classList.remove('editing'));
        const cellMap = { title:'title', assignee:'assignee', due_date:'due', status:'progress' };
        const span = row.querySelector(`.cb-cell-${cellMap[field]} > span`);
        if (span) {
          if (field === 'status') {
            span.innerHTML = `<span class="progress-chip ${taskStatusClass(sanitized)}">${taskStatusLabel(sanitized)}</span>`;
            row.classList.toggle('done', sanitized === 'done');
            const cb = row.querySelector('input[type=checkbox]');
            if (cb) cb.checked = sanitized === 'done';
            const t = clientTasksAll.find(x => x.id === taskId);
            if (t) t.status = sanitized;
            updateClientTaskCount();
          } else if (field === 'assignee') {
            span.innerHTML = assigneeDisplay(sanitized);
          } else {
            span.innerHTML = sanitized || '<span style=color:var(--text-dim)>—</span>';
          }
        }
      }
      await fetch(`/api/tasks/${taskId}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [field]: sanitized || null })
      });
    }

    async function toggleServiceItem(itemId, completed, el, sectionLabel) {
      // Update checklist data in memory
      const item = clientChecklist.find(i => i.id === itemId);
      if (item) item.completed = completed;

      await fetch(`/api/clients/${clientId}/checklist/${itemId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      const label = el.closest('label');
      if (label) {
        label.style.color = completed ? 'var(--text-muted)' : '';
        label.style.textDecoration = completed ? 'line-through' : '';
      }
      // Update done/total count and "+ New" button state for this section
      if (sectionLabel) {
        const sectionEl = document.querySelector(`.section-setup[data-section="${sectionLabel}"]`);
        if (sectionEl) {
          const total = sectionEl.querySelectorAll('input[type=checkbox]').length;
          const done = sectionEl.querySelectorAll('input[type=checkbox]:checked').length;
          const countEl = document.getElementById(`setup-count-${sectionLabel.replace(/\s/g,'-')}`);
          if (countEl) countEl.textContent = `${done}/${total}`;
        }
        const cats = SECTION_CHECKLIST_CATEGORIES[sectionLabel] || [];
        const sectionItems = clientChecklist.filter(i => cats.includes(i.category));
        const allDone = sectionItems.every(i => i.completed);
        const btnId = `camp-new-btn-${sectionLabel.replace(/[^a-zA-Z0-9]/g,'-')}`;
        const btn = document.getElementById(btnId);
        if (btn) {
          btn.disabled = !allDone;
          btn.className = allDone ? 'btn btn-primary' : 'btn btn-ghost';
          btn.style.opacity = allDone ? '' : '0.4';
          btn.style.cursor = allDone ? '' : 'not-allowed';
          btn.title = allDone ? '' : 'Complete setup before adding campaigns';
          if (allDone) {
            const dbType = SECTION_DB_TYPE[sectionLabel] || sectionLabel;
            btn.onclick = () => openCampDrawer(dbType);
          }
        }
      }
    }

    // ── Complete onboarding ────────────────────────────────────────────────────

    async function completeOnboarding() {
      if (!confirm('Mark onboarding complete? The client status will change to Active.')) return;
      await fetch(`/api/clients/${clientId}/complete-onboarding`, { method: 'POST' });
      client.status = 'active';
      const chip = document.querySelector('.board-header .status-chip');
      if (chip) { chip.className = 'status-chip chip-active'; chip.textContent = 'Active'; }
      document.getElementById('complete-onboarding-btn')?.remove();
    }

    // ── Mark all setup done ────────────────────────────────────────────────────

    async function markAllSetupDone(sectionLabel, btn) {
      if (btn) btn.style.display = 'none';
      const sectionEl = document.querySelector(`.section-setup[data-section="${sectionLabel}"]`);
      if (!sectionEl) return;
      const unchecked = [...sectionEl.querySelectorAll('input[type=checkbox]:not(:checked)')];
      for (const cb of unchecked) {
        const itemId = parseInt(cb.dataset.itemId);
        cb.checked = true;
        const label = cb.closest('label');
        if (label) { label.style.color = 'var(--text-muted)'; label.style.textDecoration = 'line-through'; }
        const item = clientChecklist.find(i => i.id === itemId);
        if (item) item.completed = true;
        await fetch(`/api/clients/${clientId}/checklist/${itemId}`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed: true })
        });
      }
      const total = sectionEl.querySelectorAll('input[type=checkbox]').length;
      const countEl = document.getElementById(`setup-count-${sectionLabel.replace(/\s/g,'-')}`);
      if (countEl) countEl.textContent = `${total}/${total}`;
      const btnId = `camp-new-btn-${sectionLabel.replace(/[^a-zA-Z0-9]/g,'-')}`;
      const newBtn = document.getElementById(btnId);
      if (newBtn) {
        newBtn.disabled = false;
        newBtn.className = 'btn btn-primary';
        newBtn.style.opacity = '';
        newBtn.style.cursor = '';
        newBtn.title = '';
        const dbType = SECTION_DB_TYPE[sectionLabel] || sectionLabel;
        newBtn.onclick = () => openCampDrawer(dbType);
      }
    }

    // ── Team card ──────────────────────────────────────────────────────────────

    function renderTeamCard(teamData) {
      const el = document.getElementById('team-card');
      if (!el) return;
      const wasOpen = el.querySelector('.brief-body') && !el.querySelector('.brief-body').classList.contains('collapsed');
      const memberRows = teamData.length
        ? teamData.map(m => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;" id="team-row-${m.id}">
              <div>
                <span style="font-weight:500;">${m.name}</span>
                ${m.role ? `<span style="font-size:11px;color:var(--text-muted);margin-left:6px;">· ${m.role}</span>` : ''}
              </div>
              <button onclick="removeTeamMember(${m.id})" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;line-height:1;padding:0 2px;" title="Remove">×</button>
            </div>`).join('')
        : '<p style="font-size:13px;color:var(--text-muted);margin:0 0 10px;">No team members assigned yet.</p>';
      const alreadyIn = new Set(teamData.map(m => m.name));
      const selectOpts = allTeamMembers.filter(m => !alreadyIn.has(m.name))
        .map(m => `<option value="${m.id}" data-name="${m.name.replace(/"/g,'&quot;')}" data-role="${(m.role||'').replace(/"/g,'&quot;')}">${m.name}${m.role ? ` · ${m.role}` : ''}</option>`)
        .join('');
      el.innerHTML = `
        <div class="brief-toggle collapsed section-label" style="margin-bottom:0;" onclick="toggleBrief(this)">
          Team
          <span class="toggle-icon">▼</span>
        </div>
        <div class="brief-body collapsed" style="margin-top:12px;">
          <div id="team-member-list">${memberRows}</div>
          <div style="display:flex;gap:6px;align-items:center;margin-top:10px;">
            <select id="team-add-select" style="flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:12px;padding:5px 8px;">
              <option value="">Add team member…</option>
              ${selectOpts}
            </select>
            <button class="btn btn-ghost" style="font-size:11px;padding:4px 10px;" onclick="addTeamMember()">Add</button>
          </div>
        </div>`;
      if (wasOpen) {
        el.querySelector('.brief-toggle')?.classList.remove('collapsed');
        el.querySelector('.brief-body')?.classList.remove('collapsed');
      }
    }

    async function addTeamMember() {
      const sel = document.getElementById('team-add-select');
      const opt = sel && sel.options[sel.selectedIndex];
      if (!opt || !opt.value) return;
      const name = opt.dataset.name;
      const role = opt.dataset.role || null;
      await fetch(`/api/clients/${clientId}/team`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, role })
      });
      const fresh = await fetch(`/api/clients/${clientId}/team`).then(r => r.json());
      clientTeam = fresh.map(m => m.name).filter(Boolean);
      renderTeamCard(fresh);
    }

    async function removeTeamMember(memberId) {
      await fetch(`/api/clients/${clientId}/team/${memberId}`, { method: 'DELETE' });
      const fresh = await fetch(`/api/clients/${clientId}/team`).then(r => r.json());
      clientTeam = fresh.map(m => m.name).filter(Boolean);
      renderTeamCard(fresh);
    }

    // ── Client task helpers ────────────────────────────────────────────────────

    function clientTaskRowHtml(t) {
      const sc = taskStatusClass(t.status);
      const sl = taskStatusLabel(t.status);
      return `
        <div class="cb-task-row ${t.status === 'done' ? 'done' : ''}" id="client-task-${t.id}">
          <input type="checkbox" ${t.status === 'done' ? 'checked' : ''} onchange="toggleClientTask(${t.id}, this.checked)">
          <div class="cb-cell cb-cell-title" onclick="cbEditCell(this)">
            <span>${t.title}</span>
            <input type="text" value="${(t.title||'').replace(/"/g,'&quot;')}"
              onblur="cbSaveClientField(${t.id},'title',this.value)"
              onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape')cbCancelCell(this.parentElement)">
          </div>
          <div class="cb-cell cb-cell-progress" onclick="cbEditCell(this)">
            <span><span class="progress-chip ${sc}">${sl}</span></span>
            <select onchange="cbSaveClientField(${t.id},'status',this.value)" onblur="cbCancelCell(this.parentElement)">
              <option value="todo"${t.status==='todo'?' selected':''}>To Do</option>
              <option value="in_progress"${t.status==='in_progress'?' selected':''}>In Progress</option>
              <option value="done"${t.status==='done'?' selected':''}>Done</option>
            </select>
          </div>
          <div class="cb-cell cb-cell-assignee" onclick="openCbAssigneeSelector(event,${t.id},'ct')">
            <span>${assigneeDisplay(t.assignee)}</span>
            ${avDropdownHtml(`av-drop-ct-${t.id}`, `selectClientAssignee(${t.id},`)}
          </div>
          <div class="cb-cell cb-cell-due" onclick="cbEditCell(this)">
            <span>${t.due_date||'<span style=color:var(--text-dim)>—</span>'}</span>
            <input type="date" value="${t.due_date||''}"
              onchange="cbSaveClientField(${t.id},'due_date',this.value)"
              onblur="cbSaveClientField(${t.id},'due_date',this.value)"
              onkeydown="if(event.key==='Escape')cbCancelCell(this.parentElement)">
          </div>
          <button class="cb-del" onclick="deleteClientTask(${t.id})" title="Delete">×</button>
        </div>`;
    }

    function updateClientTaskCount() {
      const tabTasks = clientTasksAll.filter(t => (t.service || 'General') === activeTaskTab);
      const done = tabTasks.filter(t => t.status === 'done').length;
      const total = tabTasks.length;
      const countEl = document.getElementById('client-task-count');
      if (countEl) countEl.textContent = `${done}/${total} done`;
      const bar = document.getElementById('task-progress-bar');
      if (bar) bar.style.width = total ? `${Math.round((done / total) * 100)}%` : '0%';
    }

    function showClientAddForm() {
      document.getElementById('client-add-trigger')?.style.setProperty('display', 'none');
      document.getElementById('client-add-form')?.classList.add('open');
      document.getElementById('client-task-input')?.focus();
    }

    function hideClientAddForm() {
      document.getElementById('client-add-form')?.classList.remove('open');
      const t = document.getElementById('client-add-trigger');
      if (t) t.style.removeProperty('display');
    }

    async function addClientTask() {
      const input = document.getElementById('client-task-input');
      const title = input?.value.trim();
      if (!title) return;
      const assignee = document.getElementById('client-task-assignee')?.value.trim();
      const due_date = document.getElementById('client-task-due')?.value;
      const service = activeTaskTab && activeTaskTab !== 'General' ? activeTaskTab : null;
      if (input) input.value = '';
      if (document.getElementById('client-task-assignee')) document.getElementById('client-task-assignee').value = '';
      if (document.getElementById('client-task-due')) document.getElementById('client-task-due').value = '';
      const res = await fetch('/api/tasks', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ client_id: clientId, title, service, assignee: assignee || null, due_date: due_date || null })
      });
      const { id } = await res.json();
      clientTasksAll.push({ id, title, status: 'todo', service: service || 'General', assignee: assignee || null, due_date: due_date || null });
      renderTasksTab();
    }

    load();
  </script>
</body>
</html>
