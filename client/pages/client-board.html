<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Board — Greenpoint</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/strategy-blocks.css">
  <style>
    .board-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab-bar {
      display: flex;
      gap: 2px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      background: none;
      border: none;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      transition: color .15s, background .15s;
      white-space: nowrap;
      margin-bottom: -1px;
    }
    .tab-btn:hover:not(.active) { color: var(--text); background: var(--surface-2); }
    .tab-btn.active { background: var(--accent); color: #fff; font-weight: 600; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; padding-top: 16px; }
    #campaigns-sections { padding: 0 4px; }

    /* Collapsible sections */
    .brief-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .brief-toggle .toggle-icon {
      font-size: 11px;
      color: var(--text-dim);
      transition: transform 0.2s;
    }
    .brief-toggle.collapsed .toggle-icon { transform: rotate(-90deg); }
    .brief-body {
      overflow: hidden;
      transition: max-height 0.25s ease, opacity 0.2s ease;
      max-height: 2000px;
      opacity: 1;
    }
    .brief-body.collapsed { max-height: 0; opacity: 0; }

    /* Status chips */
    .status-chip { display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:600; }
    .chip-active    { background:#0d3323;color:var(--success); }
    .chip-draft     { background:var(--surface-2);color:var(--text-muted); }
    .chip-paused    { background:#3d2a00;color:var(--warning); }
    .chip-completed { background:#1a1a2e;color:#8888cc; }
    .chip-onboarding{ background:#3d2a00;color:var(--warning); }
    .chip-inactive  { background:var(--surface-2);color:var(--text-muted); }
    .chip-setup     { background:#0a1a2e;color:#5599dd; }

    /* Campaign status dropdown */
    .camp-status-wrap { position:relative; }
    .camp-status-chip { cursor:pointer; }
    .camp-status-drop { display:none;position:absolute;top:calc(100% + 4px);right:0;z-index:300;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 6px 16px rgba(0,0,0,0.35);padding:4px;min-width:150px; }
    .camp-status-drop.open { display:block; }
    .camp-status-opt { padding:6px 10px;border-radius:4px;font-size:12px;cursor:pointer;white-space:nowrap; }
    .camp-status-opt:hover { background:var(--surface-2); }

    .camp-tab {
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 100px;
      cursor: pointer;
      transition: color .15s, background .15s, border-color .15s;
      white-space: nowrap;
    }
    .camp-tab:hover:not(.active) { color: var(--text); border-color: var(--text-dim); }
    .camp-tab.active { background: var(--accent); color: #fff; font-weight: 600; border-color: var(--accent); }

    /* ── Onboarding panel ── */
    .ob-stage { margin-bottom: 12px; }
    .ob-stage-head {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); cursor: pointer; user-select: none;
      transition: background .15s;
    }
    .ob-stage-head:hover { background: var(--surface-2); }
    .ob-stage-head.open { border-radius: var(--radius) var(--radius) 0 0; border-bottom-color: transparent; }
    .ob-stage-num { font-size: 11px; font-weight: 700; color: var(--text-dim); width: 18px; flex-shrink: 0; }
    .ob-stage-name { font-size: 13px; font-weight: 600; flex: 1; }
    .ob-stage-prog { font-size: 11px; color: var(--text-muted); }
    .ob-stage-prog.done { color: var(--success); font-weight: 600; }
    .ob-stage-arrow { font-size: 10px; color: var(--text-dim); transition: transform .2s; }
    .ob-stage-head.open .ob-stage-arrow { transform: rotate(90deg); }
    .ob-body {
      display: none; border: 1px solid var(--border); border-top: none;
      border-radius: 0 0 var(--radius) var(--radius);
      background: var(--surface);
    }
    .ob-body.open { display: block; }
    .ob-task {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .ob-task:last-child { border-bottom: none; }
    .ob-task.done { color: var(--text-muted); text-decoration: line-through; }
    .ob-task input[type=checkbox] { width: 14px; height: 14px; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; }
    .ob-auto-badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      padding: 2px 7px; border-radius: 100px; margin-left: auto; flex-shrink: 0;
    }
    .badge-slack   { background: #3d1f5a; color: #cc88ff; }
    .badge-drive   { background: #0d2a1a; color: #3ecf8e; }
    .badge-email   { background: #3d2a00; color: var(--warning); }
    .badge-research{ background: #0a1a2e; color: #5599dd; }
    .ob-action-btn {
      margin-left: auto; flex-shrink: 0;
      padding: 3px 10px; font-size: 11px; font-weight: 600;
      border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text); cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .ob-action-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .ob-action-btn.done { background: none; border-color: transparent; color: var(--success); cursor: default; pointer-events: none; }
    .ob-progress-bar { height: 4px; background: var(--surface-2); border-radius: 2px; margin-bottom: 20px; overflow: hidden; }
    .ob-progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
    .ob-info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .ob-info-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
    .ob-info-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); margin-bottom: 5px; }
    .ob-info-val { font-size: 13px; font-weight: 500; line-height: 1.5; }

    /* 9-column onboarding task table */
    .ob-tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; }
    .ob-tbl-hdr,
    .ob-tbl-row {
      display: grid;
      grid-template-columns: 26px 1fr 65px 95px 85px 90px 110px 75px 115px;
      gap: 0 6px;
      align-items: flex-start;
      min-width: 820px;
      padding: 0 10px;
    }
    .ob-tbl-hdr {
      padding-top: 7px; padding-bottom: 7px;
      border-bottom: 1px solid var(--border);
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-dim); background: var(--surface-2);
      align-items: center;
    }
    .ob-parent-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; min-width: 870px;
      background: var(--surface-2); border-bottom: 1px solid var(--border);
      cursor: pointer; user-select: none;
    }
    .ob-parent-row:hover { background: var(--surface); }
    .ob-parent-expand { font-size: 9px; color: var(--text-dim); transition: transform .2s; width: 14px; flex-shrink: 0; }
    .ob-parent-row.open .ob-parent-expand { transform: rotate(90deg); }
    .ob-parent-name { font-size: 12px; font-weight: 600; flex: 1; }
    .ob-parent-prog { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
    .ob-parent-prog.done { color: var(--success); font-weight: 600; }
    .ob-tbl-row { border-bottom: 1px solid var(--border); min-height: 36px; }
    .ob-tbl-row:last-child { border-bottom: none; }
    .ob-tbl-row:hover { background: var(--surface-2); }
    .ob-tbl-row.ob-done .ob-tbl-name { text-decoration: line-through; color: var(--text-dim); }
    .ob-tbl-row input[type=checkbox] { width: 13px; height: 13px; cursor: pointer; accent-color: var(--accent); }
    .ob-tbl-cell { font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ob-tbl-name { font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 6px; min-width: 0; }
    .ob-tbl-name > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 1; }
    .ob-children { display: none; }
    .ob-children.open { display: block; }
    /* Editable cells inside onboarding table */
    .ob-cell { position: relative; cursor: text; min-width: 0; }
    .ob-cell > span { display: block; font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ob-cell input, .ob-cell select {
      display: none; width: 100%; box-sizing: border-box;
      background: var(--surface); border: 1px solid var(--accent);
      border-radius: 4px; color: var(--text); font-size: 12px; padding: 3px 6px;
    }
    .ob-cell select { font-size: 11px; padding: 3px 4px; }
    .ob-cell input:focus, .ob-cell select:focus { outline: none; }
    .ob-cell.editing > span { display: none; }
    .ob-cell.editing input, .ob-cell.editing select { display: block; }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .service-group { margin-bottom: 16px; }
    .service-group:last-child { margin-bottom: 0; }
    .service-group-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .05em; color: var(--text-dim); padding: 6px 0 4px;
    }

    /* Shared compact task rows — 9-column layout (notes embedded under task name) */
    .cb-task-cols,
    .cb-task-row {
      display: grid;
      grid-template-columns: 18px 65px 1fr 95px 85px 90px 110px 75px 115px 22px;
      gap: 0 6px;
      align-items: flex-start;
      min-width: 850px;
    }
    .cb-task-cols {
      padding: 0 6px 6px;
      border-bottom: 1px solid var(--border);
      font-size: 10px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: .06em;
      align-items: center;
    }
    .cb-task-row {
      padding: 8px 6px 12px;
      border-bottom: 1px solid var(--border);
    }
    .cb-task-row input[type=checkbox] { margin-top: 3px; }
    /* Title col wrapper — stacks title input + notes textarea */
    .cb-title-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    /* Notes textarea embedded under task name */
    .cb-task-desc {
      width: 100%; height: 68px; resize: none;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text-muted); font-size: 11px;
      padding: 4px 6px; box-sizing: border-box; font-family: inherit; line-height: 1.5;
    }
    .cb-task-desc:focus { outline: none; border-color: var(--accent); color: var(--text); background: var(--surface); }
    .cb-task-desc::placeholder { color: var(--text-dim); font-style: italic; }
    .cb-task-wrap { overflow-x: auto; }
    .cb-task-row:last-child { border-bottom: none; }
    .cb-task-row:hover { background: var(--surface-2); }
    .cb-task-row.done .cb-cell-title > span { text-decoration: line-through; color: var(--text-dim); }
    .cb-task-row input[type=checkbox] { width: 13px; height: 13px; cursor: pointer; accent-color: var(--accent); }
    .cb-cell { position: relative; cursor: text; min-width: 0; }
    .cb-cell > span { display: block; font-size: 13px; line-height: 1; padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cb-cell-assignee > span, .cb-cell-due > span { font-size: 12px; color: var(--text-muted); }
    .cb-cell input, .cb-cell select {
      display: none; width: 100%; box-sizing: border-box;
      background: var(--surface); border: 1px solid var(--accent);
      border-radius: 4px; color: var(--text); font-size: 12px; padding: 3px 6px;
    }
    .cb-cell select { font-size: 11px; padding: 3px 4px; }
    .cb-cell input:focus, .cb-cell select:focus { outline: none; }
    .cb-cell.editing > span { display: none; }
    .cb-cell.editing input, .cb-cell.editing select { display: block; }
    .cb-del { background: none; border: none; color: transparent; cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }
    .cb-task-row:hover .cb-del { color: var(--text-dim); }
    .cb-del:hover { color: var(--danger) !important; }

    /* Campaign task buttons */
    .cb-task-btn {
      display: flex; flex-direction: column; gap: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px;
      min-width: 140px; max-width: 220px;
      cursor: pointer; text-align: left;
      transition: border-color .15s, background .15s;
    }
    .cb-task-btn:hover { border-color: var(--accent); background: var(--surface-2); }
    .cb-task-btn.done { background: rgba(72,187,120,0.07); border-color: rgba(72,187,120,0.3); }
    .cb-task-btn.done span { color: var(--text-muted); text-decoration: line-through; }
    .cb-task-check {
      width: 13px; height: 13px; border-radius: 50%;
      border: 1.5px solid var(--border); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 8px; color: #fff;
    }
    .cb-task-btn.done .cb-task-check { background: var(--success); border-color: var(--success); }

    /* Progress chips */
    .progress-chip { display: inline-block; padding: 2px 7px; border-radius: 100px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
    .pc-not-assigned { background: var(--surface-2); color: var(--text-dim); }
    .pc-planned      { background: #0d1f33; color: #6699cc; }
    .pc-in-progress  { background: #2a1800; color: #cc8800; }
    .pc-in-review    { background: #1a0a2e; color: #9966cc; }
    .pc-complete     { background: #0d3323; color: var(--success); }

    /* Assignee avatar */
    .av { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 700; flex-shrink: 0; vertical-align: middle; color: #fff; }
    .cb-cell-assignee { cursor: pointer; overflow: visible !important; }
    .cb-cell-assignee > span { display: flex; align-items: center; gap: 5px; }
    .av-dropdown { display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 300; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 6px 16px rgba(0,0,0,0.35); padding: 4px; min-width: 150px; }
    .av-dropdown.open { display: block; }
    .av-option { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .av-option:hover { background: var(--surface-2); }

    /* Campaign timeline bar */
    .campaign-bar {
      height: 6px;
      background: var(--surface-2);
      border-radius: 3px;
      overflow: hidden;
      margin: 8px 0;
    }
    .campaign-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    /* Campaign items */
    [id^="camp-card-"] { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
    [id^="camp-card-"]:last-child { margin-bottom: 0; }
    .camp-item { }
    .camp-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      cursor: pointer;
    }

    /* Embedded stage list */
    .camp-stage-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 7px;
      border-radius: var(--radius);
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s;
    }
    .camp-stage-row:hover { background: var(--surface-2); }
    .camp-stage-row.active { background: var(--surface-2); border-color: var(--accent); }
    .camp-stage-row.done .camp-stage-num { background: var(--success); color: #000; border-color: var(--success); }
    .camp-stage-num {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--surface-2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 700; flex-shrink: 0; color: var(--text-muted);
    }
    .camp-stage-row.active .camp-stage-num { background: var(--accent); color: #000; border-color: var(--accent); }
    .camp-stage-name { font-size: 11px; font-weight: 500; flex: 1; }
    .camp-stage-tick { font-size: 10px; color: var(--success); opacity: 0; }
    .camp-stage-row.done .camp-stage-tick { opacity: 1; }

    /* Add task inline form */
    .cb-add-trigger { font-size: 12px; color: var(--text-dim); cursor: pointer; padding: 6px 4px; }
    .cb-add-trigger:hover { color: var(--accent); }
    .cb-add-form { display: none; }
    .cb-add-form.open { display: grid; grid-template-columns: 1fr 90px 80px auto auto; gap: 5px; align-items: center; padding: 6px 4px; }
    .cb-add-form input { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 12px; padding: 4px 7px; width: 100%; box-sizing: border-box; }
    .cb-add-form input:focus { outline: none; border-color: var(--accent); }

    /* Drawer */
    .drawer-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200; }
    .drawer-overlay.open { display:block; }
    .drawer { position:fixed;top:0;right:-440px;width:440px;height:100%;background:var(--surface);border-left:1px solid var(--border);z-index:201;display:flex;flex-direction:column;transition:right 0.25s ease; }
    .drawer.open { right:0; }
    .drawer-wide { width:600px;right:-600px; }
    .drawer-wide.open { right:0; }

    /* Strategy drawer content */
    .strat-section { border-bottom:1px solid var(--border);padding:16px 0; }
    .strat-section:last-child { border-bottom:none; }
    .strat-section-label { font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);margin-bottom:10px; }
    .drawer-header { display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border); }
    .drawer-header h2 { font-size:15px;font-weight:600; }
    .drawer-close { background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:20px;line-height:1; }
    .drawer-body { flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px; }
    .drawer-footer { padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px; }

    .placeholder-section {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
    }

    /* Snapshot */
    .snapshot-card { display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;padding:12px 16px;margin-bottom:20px; }
    .snapshot-section { display:flex;flex-direction:column;gap:4px; }
    .snapshot-label { font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim); }
    .snapshot-value { font-size:13px;color:var(--text); }

    /* Brain overview cards */
    .brain-overview-row { display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px; }
    .brain-overview-card { min-height:90px; }
    .brain-overview-label { font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:8px; }
    .brain-overview-list { margin:0;padding-left:16px;font-size:12px;line-height:1.8;max-height:180px;overflow-y:auto; }
    .brain-overview-actions { max-height:180px;overflow-y:auto; }
    @media (max-width:900px) { .brain-overview-row { grid-template-columns:1fr; } }

    /* Brain groups */
    .brain-group { margin-bottom:4px; }
    .brain-group-header { display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);padding:10px 0 6px;border-bottom:1px solid var(--border);margin-bottom:8px; }
    .brain-group-header.clickable { cursor:pointer; }
    .brain-group-header.clickable:hover { color:var(--text); }
    .brain-group-count { font-weight:400;opacity:.7; }
    .brain-group-toggle { margin-left:auto;font-size:10px; }

    /* Brain feed */
    .brain-controls { display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap; }
    .brain-controls select, .brain-controls input[type=text] { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;padding:6px 10px; }
    .brain-controls input[type=text] { flex:1;min-width:160px; }
    .brain-controls select { min-width:130px; }
    .brain-add-form { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px; }
    .brain-add-form .form-row { display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap; }
    .brain-add-form select { background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;padding:6px 10px;min-width:160px; }
    .brain-add-form textarea { width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;padding:10px 12px;resize:vertical;min-height:80px;font-family:inherit;box-sizing:border-box; }
    .brain-entry { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px; }
    .brain-entry.pinned { border-left:3px solid var(--accent); }
    .brain-entry-meta { display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap; }
    .brain-entry-actions { margin-left:auto;display:flex;align-items:center;gap:2px;flex-shrink:0; }
    .brain-entry-body { font-size:13px;line-height:1.65;color:var(--text);white-space:pre-wrap;word-break:break-word; }
    .type-chip { display:inline-flex;align-items:center;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:600; }
    .camp-chip { display:inline-flex;align-items:center;padding:2px 9px;border-radius:100px;font-size:11px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted); }
    .brain-ts { font-size:11px;color:var(--text-dim); }
    .icon-btn { background:none;border:none;cursor:pointer;color:var(--text-dim);padding:4px 6px;border-radius:4px;font-size:13px;line-height:1; }
    .icon-btn:hover { background:var(--surface-2);color:var(--text); }
    .icon-btn.pin-on { color:var(--accent); }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content" id="page-content">
        <p style="color:var(--text-muted);">Loading…</p>
      </main>
    </div>
  </div>

  <!-- Campaign drawer -->
  <div class="drawer-overlay" id="camp-overlay"></div>
  <div class="drawer" id="camp-drawer">
    <div class="drawer-header">
      <h2>New Campaign</h2>
      <button class="drawer-close" onclick="closeCampDrawer()">×</button>
    </div>
    <div class="drawer-body">
      <div class="form-group">
        <label>Type</label>
        <select id="cd-type" onchange="updateCampDrawerSetup()">
          <option value="">Select type</option>
          <option value="PR">PR</option>
          <option value="PR Light">PR Light</option>
          <option value="Social Media">Social Media</option>
          <option value="Content">Content</option>
          <option value="Events & Partnerships">Events & Partnerships</option>
          <option value="Design">Design</option>
        </select>
      </div>
      <div class="form-group">
        <label>Campaign Name</label>
        <input type="text" id="cd-name" placeholder="e.g. Spring Launch PR">
      </div>
      <div id="cd-setup-items" style="display:none;border-top:1px solid var(--border);padding-top:16px;margin-top:4px;"></div>
    </div>
    <div class="drawer-footer">
      <button class="btn btn-primary" id="cd-save">Create Campaign</button>
      <button class="btn btn-ghost" onclick="closeCampDrawer()">Cancel</button>
    </div>
  </div>

  <!-- Strategy drawer -->
  <div class="drawer-overlay" id="strat-overlay" onclick="closeStrategyDrawer()"></div>
  <div class="drawer drawer-wide" id="strat-drawer">
    <div class="drawer-header">
      <div>
        <h2 id="strat-drawer-title" style="margin:0;">Strategy</h2>
        <div id="strat-drawer-meta" style="font-size:11px;color:var(--text-muted);margin-top:2px;"></div>
      </div>
      <button class="drawer-close" onclick="closeStrategyDrawer()">×</button>
    </div>
    <div class="drawer-body" id="strat-drawer-body">
      <p style="font-size:13px;color:var(--text-muted);">Loading…</p>
    </div>
    <div class="drawer-footer" id="strat-drawer-footer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script src="/components/shell.js"></script>
  <script src="/components/section-defs.js"></script>
  <script src="/components/card-icons.js"></script>
  <script src="/components/strategy-render.js"></script>
  <script>
    const clientId = location.pathname.split('/')[2];

    function escHtml(s) { if(s==null)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function escAttr(s) { if(s==null)return''; return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    const STAGES = {
      'PR':                                       ['Campaign Prep','Campaign Development','Awaiting Approval','Set up Public Address','Pitch!','Campaign Complete'],
      'PR Light':                                 ['Campaign Prep','Campaign Development','Awaiting Approval','Set up Public Address','Pitch!','Campaign Complete'],
      'Social Media':                             ['Schedule Prep','Content Creation','Content Scheduling & Boosting'],
      'Content':                                  ['Schedule Prep','Content Creation','Content Scheduling & Boosting'],
      'Events & Partnerships':                    ['Event Deck & Budget','Event Planning','Event Day'],
      'Awards':                                   ['Submission'],
      'Paid Media':                               ['Planning','In Progress','Review','Wrap-up'],
      'Design':                                   ['Briefing','Design','Revisions','Final Delivery'],
      default:                                    ['Planning','In Progress','Review','Wrap-up'],
    };

    // Map client service names → campaign section labels
    const SERVICE_TYPE_MAP = {
      'PR':                                       'PR',
      'PR Light':                                 'PR Light',
      'Social Media':                             'Social Media',
      'Brand Activation - Events & Partnerships': 'Events & Partnerships',
      'Design':                                   'Design',
    };

    // Board URL per type
    function campBoardUrl(c) {
      return c.type === 'Social Media' ? `/social/${c.id}` : `/campaigns/${c.id}`;
    }

    // Section label → campaign type stored in DB
    const SECTION_DB_TYPE = {
      'PR':                    'PR',
      'PR Light':              'PR Light',
      'Social Media':          'Social Media',
      'Events & Partnerships': 'Events & Partnerships',
      'Awards':                'Awards',
      'Paid Media':            'Paid Media',
      'Design':                'Design',
    };

    let campaigns = [];
    let clientStrategies = [];
    let client = null;
    let clientChecklist = [];
    let allTeamMembers = [];
    const selectedStages = {};
    const expandedCamps = new Set();
    const campTasksData = {};
    let clientTeam = [];
    let activeCampTypeTab = null;
    let clientTasksAll = [];
    let activeTaskTab = null;
    let clientMeetings = [];

    // Maps section label → which checklist categories belong in it
    const SECTION_CHECKLIST_CATEGORIES = {
      'PR':                    ['PR'],
      'PR Light':              ['PR Light'],
      'Social Media':          ['Social Media'],
      'Events & Partnerships': ['Brand Activation - Events & Partnerships'],
      'Design':                ['Design'],
    };

    // ── Helpers ────────────────────────────────────────────────────────────────

    function avatarColor(name) {
      const palette = ['#5b5fcf','#2e7d32','#8e3a7a','#d4870a','#0277bd','#6a4f00','#00695c','#b71c1c'];
      let h = 0;
      for (let i = 0; i < (name||'').length; i++) h = (name.charCodeAt(i) + ((h << 5) - h)) | 0;
      return palette[Math.abs(h) % palette.length];
    }
    function avatarHtml(name, size=20) {
      if (!name) return '';
      const initials = name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
      return `<span class="av" style="width:${size}px;height:${size}px;background:${avatarColor(name)};font-size:${Math.round(size*.42)}px">${initials}</span>`;
    }
    function assigneeDisplay(name) {
      return name ? `${avatarHtml(name)} ${name}` : '<span style="color:var(--text-dim)">—</span>';
    }
    function openCbAssigneeSelector(event, taskId, prefix) {
      event.stopPropagation();
      const drop = document.getElementById(`av-drop-${prefix}-${taskId}`);
      const isOpen = drop && drop.classList.contains('open');
      document.querySelectorAll('.av-dropdown.open').forEach(d => d.classList.remove('open'));
      if (!isOpen && drop) drop.classList.add('open');
    }
    function openCbApproverSelector(event, taskId, prefix) {
      event.stopPropagation();
      const drop = document.getElementById(`av-drop-ap-${prefix}-${taskId}`);
      const isOpen = drop && drop.classList.contains('open');
      document.querySelectorAll('.av-dropdown.open').forEach(d => d.classList.remove('open'));
      if (!isOpen && drop) drop.classList.add('open');
    }
    document.addEventListener('click', () => {
      document.querySelectorAll('.av-dropdown.open, .camp-status-drop.open').forEach(d => d.classList.remove('open'));
    });

    function progressClass(p) {
      return { 'Not Assigned':'pc-not-assigned','Planned':'pc-planned','In Progress':'pc-in-progress','In Review':'pc-in-review','Complete':'pc-complete' }[p] || 'pc-not-assigned';
    }
    function taskStatusClass(s) {
      return { 'todo':'pc-not-assigned','in_progress':'pc-in-progress','done':'pc-complete' }[s] || 'pc-not-assigned';
    }
    function taskStatusLabel(s) {
      return { 'todo':'To Do','in_progress':'In Progress','done':'Done' }[s] || 'To Do';
    }

    function avDropdownHtml(dropId, callPrefix) {
      return `<div class="av-dropdown" id="${escAttr(dropId)}">
        <div class="av-option" onclick="event.stopPropagation();${callPrefix}null)">
          <span style="font-size:11px;color:var(--text-dim)">— Unassign</span>
        </div>
        ${clientTeam.map(name => `<div class="av-option" onclick="event.stopPropagation();${callPrefix}${JSON.stringify(name)})">
          ${avatarHtml(name)} ${escHtml(name)}</div>`).join('')}
      </div>`;
    }
    async function selectClientAssignee(taskId, name) {
      document.querySelectorAll('.av-dropdown.open').forEach(d => d.classList.remove('open'));
      await cbSaveClientField(taskId, 'assignee', name);
    }
    async function selectClientApprover(taskId, name) {
      document.querySelectorAll('.av-dropdown.open').forEach(d => d.classList.remove('open'));
      await cbSaveClientField(taskId, 'approver', name);
    }
    async function selectCampAssignee(campId, taskId, name) {
      document.querySelectorAll('.av-dropdown.open').forEach(d => d.classList.remove('open'));
      await cbSaveCampField(campId, taskId, 'assignee', name);
    }
    async function selectCampApprover(campId, taskId, name) {
      document.querySelectorAll('.av-dropdown.open').forEach(d => d.classList.remove('open'));
      await cbSaveCampField(campId, taskId, 'approver', name);
    }

    // ── Shared cell edit ───────────────────────────────────────────────────────

    function cbEditCell(cell) {
      cell.classList.add('editing');
      const el = cell.querySelector('input, select');
      if (!el) return;
      el.focus();
      if (el.type === 'text') el.select();
    }
    function cbCancelCell(cell) { cell.classList.remove('editing'); }

    // ── Quick content cards ────────────────────────────────────────────────────

    function quickCard(label, title, sub, chipHtml, actionHtml) {
      return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 12px;display:flex;flex-direction:column;gap:5px;min-height:100px;">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);">${label}</div>
        <div style="font-size:13px;font-weight:600;flex:1;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${title}</div>
        ${sub ? `<div style="font-size:11px;color:var(--text-muted);">${sub}</div>` : ''}
        ${chipHtml ? `<div>${chipHtml}</div>` : ''}
        ${actionHtml ? `<div style="margin-top:4px;">${actionHtml}</div>` : ''}
      </div>`;
    }

    function quickCardsHtml() {
      const stratChipMap = { draft:'background:var(--surface-2);color:var(--text-muted)', awaiting_approval:'background:#3d2a00;color:#f5a623', approved:'background:#0d3323;color:#3ecf6e' };
      const stratLabelMap = { draft:'Draft', awaiting_approval:'Awaiting Approval', approved:'Approved' };

      // 1 — Strategy
      const strat = clientStrategies[0] || null;
      const stratCard = strat
        ? quickCard('Strategy', escHtml(strat.title),
            strat.updated_at ? `Updated ${new Date(strat.updated_at).toLocaleDateString('en-AU',{day:'numeric',month:'short'})}` : '',
            `<span style="${stratChipMap[strat.status]||stratChipMap.draft};font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:100px;">${stratLabelMap[strat.status]||strat.status}</span>`,
            `<a href="/strategy/${strat.id}" style="font-size:11px;color:var(--accent);font-weight:500;">Edit →</a>`)
        : quickCard('Strategy', '<span style="color:var(--text-dim);">No strategy yet</span>', '', '',
            `<button onclick="newStrategy()" style="font-size:11px;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;font-weight:500;">+ Create →</button>`);

      // 2 — Press Releases (PR campaigns)
      const prCamps = campaigns.filter(c => c.type === 'PR' || c.type === 'PR Light');
      const activePr = prCamps.filter(c => c.status === 'active');
      const prCard = quickCard('Press Releases',
        prCamps.length ? `${prCamps.length} campaign${prCamps.length>1?'s':''}` : '<span style="color:var(--text-dim);">No PR campaigns</span>',
        activePr.length ? `${activePr.length} active` : prCamps.length ? 'None active' : '',
        '', prCamps.length
          ? `<a onclick="switchTab('one',document.querySelector('.tab-btn'));switchCampTypeTab('PR')" href="#" style="font-size:11px;color:var(--accent);font-weight:500;">View →</a>`
          : `<a onclick="switchTab('one',document.querySelector('.tab-btn'));openCampDrawer('PR')" href="#" style="font-size:11px;color:var(--accent);font-weight:500;">+ New →</a>`);

      const clientServices = (client.services||'').split(',').map(s=>s.trim()).filter(Boolean);
      const hasSocial = clientServices.includes('Social Media');

      // 3 — Social (only if Social Media is in scope)
      const socialCamps = campaigns.filter(c => c.type === 'Social Media');
      const activeSocial = socialCamps.filter(c => c.status === 'active');
      const socialCard = hasSocial ? quickCard('Social Content',
        socialCamps.length ? `${socialCamps.length} campaign${socialCamps.length>1?'s':''}` : '<span style="color:var(--text-dim);">No social campaigns</span>',
        activeSocial.length ? `${activeSocial.length} active` : socialCamps.length ? 'None active' : '',
        '', socialCamps.length
          ? `<a onclick="switchTab('one',document.querySelector('.tab-btn'));switchCampTypeTab('Social Media')" href="#" style="font-size:11px;color:var(--accent);font-weight:500;">View →</a>`
          : '') : '';

      // 4 — Media Hub
      const hasPR = clientServices.some(s => s === 'PR' || s === 'PR Light');
      const mediaCard = quickCard('Media Hub',
        hasPR ? `${escHtml(client.code||client.name)} Coverage` : '<span style="color:var(--text-dim);">Not available</span>',
        hasPR ? new Date().getFullYear() + ' media coverage' : 'Add PR service to enable',
        '', hasPR ? `<a href="/media-hub/${clientId}" style="font-size:11px;color:var(--accent);font-weight:500;">Open →</a>` : '');

      // 7 — Meetings
      const internalBrief = clientMeetings.find(m => m.title === 'Internal Brief') || null;
      const mtgDate = internalBrief?.scheduled_date
        ? new Date(internalBrief.scheduled_date).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' })
        : null;
      const mtgType = internalBrief?.meeting_type === 'in-person' ? 'In Person' : 'Online';
      const obCard = quickCard('Meetings',
        'Internal Brief',
        mtgDate ? `${mtgDate} · ${mtgType}` : 'Not scheduled',
        mtgDate ? `<span style="background:#0d3323;color:#3ecf6e;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:100px;">Booked</span>` : '',
        `<a href="#" onclick="openMeetingModal(${internalBrief ? internalBrief.id : 'null'})" style="font-size:11px;color:var(--accent);font-weight:500;">${internalBrief ? 'Edit →' : 'Book →'}</a>`);

      return [stratCard, prCard, socialCard, mediaCard, obCard].filter(Boolean).join('');
    }

    // ── Main load ──────────────────────────────────────────────────────────────

    async function load() {
      const [profileRes, campaignsRes, strategiesRes, teamMembersRes, onboardingRes, meetingsRes] = await Promise.all([
        fetch(`/api/clients/${clientId}/profile`),
        fetch(`/api/campaigns/client/${clientId}`),
        fetch(`/api/strategies/client/${clientId}`),
        fetch('/api/team-members'),
        fetch(`/api/onboarding/${clientId}`),
        fetch(`/api/clients/${clientId}/meetings`)
      ]);
      allTeamMembers = teamMembersRes.ok ? await teamMembersRes.json() : [];
      if (!profileRes.ok) {
        document.getElementById('page-content').innerHTML = '<p style="color:var(--danger);">Client not found.</p>';
        return;
      }
      campaigns = campaignsRes.ok ? await campaignsRes.json() : [];
      campaigns.forEach(c => expandedCamps.add(c.id));
      clientStrategies = strategiesRes.ok ? await strategiesRes.json() : [];
      onboardingData = onboardingRes.ok ? await onboardingRes.json() : null;
      clientMeetings = meetingsRes.ok ? await meetingsRes.json() : [];
      const { client: clientData, checklist, tasks, team, contacts } = await profileRes.json();
      client = clientData;
      clientChecklist = checklist || [];
      clientTasksAll = tasks || [];
      clientTeam = (team || []).map(m => m.name).filter(Boolean);
      renderShell({ pageId: 'client-' + clientId, title: client.name });

      const statusClass = client.status === 'active' ? 'chip-active' : client.status === 'onboarding' ? 'chip-onboarding' : 'chip-inactive';
      const statusLabel = client.status.charAt(0).toUpperCase() + client.status.slice(1);

      const today = new Date();
      const start = client.start_date ? new Date(client.start_date) : null;
      const end = client.end_date ? new Date(client.end_date) : null;
      let campaignPct = 0, campaignStatus = '';
      if (start && end) {
        const total = end - start;
        const elapsed = today - start;
        campaignPct = Math.min(100, Math.max(0, Math.round((elapsed / total) * 100)));
        const daysLeft = Math.max(0, Math.round((end - today) / (1000 * 60 * 60 * 24)));
        campaignStatus = daysLeft > 0 ? `${daysLeft} days remaining` : 'Campaign ended';
      }

      const totalTasks = tasks.length;
      const doneTasks = tasks.filter(t => t.status === 'done').length;
      const taskPct = totalTasks ? Math.round((doneTasks / totalTasks) * 100) : 0;

      const grouped = {};
      tasks.forEach(t => {
        const svc = t.service || 'General';
        if (!grouped[svc]) grouped[svc] = [];
        grouped[svc].push(t);
      });

      const snapshotEndDate = client.end_date || '';
      const snapshotContact = contacts[0] || null;
      const snapshotServices = (client.services || '').split(',').map(s => s.trim()).filter(Boolean);

      document.getElementById('page-content').innerHTML = `
        <div class="board-header">
          <h1 style="font-size:20px;font-weight:700;">
            ${client.code ? `<span style="font-size:13px;font-weight:700;color:var(--text-dim);letter-spacing:.08em;margin-right:6px;">${escHtml(client.code)}</span><span style="color:var(--text-dim);font-weight:400;margin-right:6px;">—</span>` : ''}${escHtml(client.name)}
          </h1>
          <span class="status-chip ${statusClass}">${statusLabel}</span>
          ${client.industry ? `<span style="font-size:12px;color:var(--text-muted);">${escHtml(client.industry)}</span>` : ''}
          <div style="flex:1;"></div>
          <a href="/clients/${clientId}" class="btn btn-ghost" style="font-size:12px;">Edit Profile</a>
        </div>

        ${snapshotServices.length || snapshotEndDate || snapshotContact || client.slack_channel || client.drive_folder_url ? `
        <div class="card snapshot-card">
          ${snapshotServices.length ? `<div class="snapshot-section">
            <div class="snapshot-label">Services</div>
            <div style="display:flex;gap:5px;flex-wrap:wrap;">
              ${snapshotServices.map(s => `<span style="background:var(--surface-2);border:1px solid var(--border);border-radius:100px;padding:2px 10px;font-size:12px;">${escHtml(s)}</span>`).join('')}
            </div>
          </div>` : ''}
          ${snapshotEndDate ? `<div class="snapshot-section">
            <div class="snapshot-label">Retainer Ends</div>
            <div class="snapshot-value">${escHtml(snapshotEndDate)}</div>
          </div>` : ''}
          ${snapshotContact ? `<div class="snapshot-section">
            <div class="snapshot-label">Primary Contact</div>
            <div class="snapshot-value" style="font-weight:500;">${escHtml(snapshotContact.name)}</div>
            ${snapshotContact.email ? `<div style="font-size:12px;"><a href="mailto:${escAttr(snapshotContact.email)}" style="color:var(--accent);text-decoration:none;">${escHtml(snapshotContact.email)}</a></div>` : ''}
          </div>` : ''}
          ${client.slack_channel ? `<div class="snapshot-section">
            <div class="snapshot-label">Slack</div>
            <div class="snapshot-value">${client.slack_channel.startsWith('http') ? `<a href="${escAttr(client.slack_channel)}" target="_blank" style="color:var(--accent);text-decoration:none;">${escHtml(client.slack_channel)} ↗</a>` : `<span style="color:var(--text-muted);">#${escHtml(client.slack_channel)}</span>`}</div>
          </div>` : ''}
          ${client.drive_folder_url ? `<div class="snapshot-section">
            <div class="snapshot-label">Drive</div>
            <div class="snapshot-value"><a href="${escAttr(client.drive_folder_url)}" target="_blank" style="color:var(--accent);text-decoration:none;">Open folder ↗</a></div>
          </div>` : ''}
        </div>` : ''}

        <div class="brain-overview-row">
          <div class="card brain-overview-card" id="brain-card-summary">
            <div class="brain-overview-label">Summary</div>
            <p style="color:var(--text-dim);font-size:13px;margin:0;">Add brain entries to generate.</p>
          </div>
          <div class="card brain-overview-card" id="brain-card-updates">
            <div class="brain-overview-label">Updates</div>
            <p style="color:var(--text-dim);font-size:13px;margin:0;">No updates yet.</p>
          </div>
          <div class="card brain-overview-card" id="brain-card-actions">
            <div class="brain-overview-label">Action Items</div>
            <p style="color:var(--text-dim);font-size:13px;margin:0;">No action items yet.</p>
          </div>
        </div>

        <div class="tab-bar" style="align-items:flex-end;">
          <button class="tab-btn active" onclick="switchTab('two', this)">Brain</button>
          <button class="tab-btn" onclick="switchTab('one', this)">Campaigns</button>
          <button class="tab-btn" onclick="switchTab('brief', this)">Brief</button>
          <button class="tab-btn" onclick="switchTab('scope', this)">Scope</button>
          <button class="tab-btn" onclick="switchTab('team', this)">Team</button>
        </div>

        <!-- Main 2-column layout — persists across both tabs -->
        <div style="display:grid;grid-template-columns:3fr 1fr;gap:16px;align-items:start;">

          <!-- Left: tab panels -->
          <div>
            <!-- Tab One — Campaigns -->
            <div class="tab-panel" id="tab-one">
              <div id="campaigns-sections"></div>
            </div>

            <!-- Tab Two — Brain -->
            <div class="tab-panel active" id="tab-two">
              <div class="brain-controls">
                <select id="filter-type" onchange="fetchAndRenderEntries()">

      } else if (task.auto_type === 'drive') {
        autoHtml = isDone
          ? `<span class="ob-auto-badge badge-drive" style="font-size:9px;padding:1px 5px;flex-shrink:0;">✓ Drive</span>`
          : `<button class="ob-action-btn" onclick="event.stopPropagation();doDrive(${task.id},'${escAttr(driveName)}')" style="font-size:10px;padding:2px 7px;flex-shrink:0;">Create Folder</button>`;

        autoHtml = isDone

          : `<button class="ob-action-btn" style="opacity:.5;cursor:not-allowed;font-size:10px;padding:2px 7px;flex-shrink:0;" disabled>Send Email</button>`;

        <div class="ob-tbl-row${isDone ? ' ob-done' : ''}" id="ob-task-${task.id}">

              onblur="saveObTaskField(${task.id},'estimated_time',this.value)"
              onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){obCancelCell(this.parentElement);}">
          </div>
          <div class="ob-tbl-cell ob-cell" onclick="obEditCell(this)">
            <span>${task.due_date ? escHtml(task.due_date) : '—'}</span>
            <input type="date" value="${task.due_date||''}"
              onchange="saveObTaskField(${task.id},'due_date',this.value)"
              onblur="obCancelCell(this.parentElement)"
              onkeydown="if(event.key==='Escape'){obCancelCell(this.parentElement);}">
          </div>
          <div class="ob-tbl-cell ob-cell" onclick="obEditCell(this)">
            <span>${escHtml(task.approver || '—')}</span>
            <input type="text" value="${(task.approver||'').replace(/"/g,'&quot;')}" placeholder="Approver"
              onblur="saveObTaskField(${task.id},'approver',this.value)"
              onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){obCancelCell(this.parentElement);}">
          </div>
          <div class="ob-tbl-cell ob-cell" onclick="obEditCell(this)">
            <span>${escHtml(task.assignee || '—')}</span>

            <span>${escHtml(task.priority || 'Medium')}</span>

    function toggleObParent(parentId) {
      const row = document.getElementById(`ob-par-${parentId}`);
      const children = document.getElementById(`ob-children-${parentId}`);
      row.classList.toggle('open');
      children.classList.toggle('open');
    }

    function obEditCell(cell) {
      cell.classList.add('editing');
      const el = cell.querySelector('input, select');
      if (!el) return;
      el.focus();
      if (el.tagName === 'INPUT' && el.type === 'text') el.select();
    }
    function obCancelCell(cell) { cell?.classList.remove('editing'); }

    async function saveObTaskField(itemId, field, value) {
      const sanitized = (value && value.trim) ? value.trim() : value;
      const item = onboardingData?.items.find(i => i.id === itemId);
      if (item) {
        item[field] = sanitized || null;
        if (field === 'progress') item.completed = sanitized === 'Complete' ? 1 : 0;
      }
      const payload = { [field]: sanitized || null };
      if (field === 'progress') payload.completed = sanitized === 'Complete';
      await fetch(`/api/onboarding/${clientId}/items/${itemId}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      renderOnboardingPanel();
    }

    async function toggleObTask(itemId, checked) {
      await fetch(`/api/onboarding/${clientId}/items/${itemId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed: checked })
      });
      const item = onboardingData.items.find(i => i.id === itemId);
      if (item) item.completed = checked ? 1 : 0;
      renderOnboardingPanel();
    }

    async function doSlack(itemId, channelName) {
      const res = await fetch(`/api/onboarding/${clientId}/slack`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slack_channel: channelName })
      });
      if (res.ok) {
        onboardingData.slack_channel = channelName;
        const item = onboardingData.items.find(i => i.id === itemId);
        if (item) item.completed = 1;
        renderOnboardingPanel();
      }
    }

    async function doDrive(itemId, folderName) {
      // Placeholder — prompt user to paste the Drive folder URL they create
      const url = prompt(`Paste the Google Drive folder URL for "${folderName}":`);
      if (!url) return;
      const res = await fetch(`/api/onboarding/${clientId}/drive`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ drive_folder_url: url })
      });
      if (res.ok) {
        onboardingData.drive_folder_url = url;
        const item = onboardingData.items.find(i => i.id === itemId);
        if (item) item.completed = 1;
        renderOnboardingPanel();
      }
    }

    async function saveObField(taskId, field, value) {
      const sanitized = (value && value.trim) ? value.trim() : value;
      const row = document.getElementById(`ob-task-${taskId}`);
      if (row) {
        row.querySelectorAll('.cb-cell').forEach(c => c.classList.remove('editing'));
        const cellCls = { estimated_time:'time', due_date:'due', approver:'approver', assignee:'assignee', task_type:'type', priority:'priority', progress:'progress' };
        const span = cellCls[field] ? row.querySelector(`.cb-cell-${cellCls[field]} > span`) : null;
        if (span) {
          if (field === 'progress') span.innerHTML = `<span class="progress-chip ${progressClass(sanitized||'Not Assigned')}">${escHtml(sanitized||'Not Assigned')}</span>`;
          else if (field === 'assignee' || field === 'approver') span.innerHTML = assigneeDisplay(sanitized);
          else span.innerHTML = escHtml(sanitized) || '<span style=color:var(--text-dim)>—</span>';
        }
        if (field === 'progress') {
          const isDone = sanitized === 'Complete';
          row.classList.toggle('done', isDone);
          const cb = row.querySelector('input[type=checkbox]');
          if (cb) cb.checked = isDone;
        }
      }
      const item = onboardingData?.items.find(i => i.id === taskId);
      if (item) {
        item[field] = sanitized || null;
        if (field === 'progress') item.completed = sanitized === 'Complete' ? 1 : 0;
      }
      const body = { [field]: sanitized || null };
      if (field === 'progress') body.completed = sanitized === 'Complete';
      await fetch(`/api/onboarding/${clientId}/items/${taskId}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    async function toggleObRow(taskId, checked) {
      const row = document.getElementById(`ob-task-${taskId}`);
      if (row) row.classList.toggle('done', checked);
      const item = onboardingData?.items.find(i => i.id === taskId);
      if (item) item.completed = checked ? 1 : 0;
      await fetch(`/api/onboarding/${clientId}/items/${taskId}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed: checked })
      });
    }

    async function selectObAssignee(taskId, name) {
      document.querySelectorAll('.av-dropdown.open').forEach(d => d.classList.remove('open'));
      await saveObField(taskId, 'assignee', name);
    }
    async function selectObApprover(taskId, name) {
      document.querySelectorAll('.av-dropdown.open').forEach(d => d.classList.remove('open'));
      await saveObField(taskId, 'approver', name);
    }

      const total = items.length;
      const done = items.filter(i => i.completed).length;
      // Group by category (relevant for Content - Other which spans multiple)

    function renderCampItem(c) {
      const stages = STAGES[c.type] || STAGES.default;
      const currentStage = c.current_stage || 0;
      const selStage = selectedStages[c.id] !== undefined ? selectedStages[c.id] : currentStage;
      const isExpanded = expandedCamps.has(c.id);
      const CAMP_STATUSES = [
        { value: 'to_be_set_up', label: 'To Be Set Up', chip: 'chip-setup' },
        { value: 'draft',        label: 'Draft',         chip: 'chip-draft' },
        { value: 'active',       label: 'Active',        chip: 'chip-active' },
        { value: 'paused',       label: 'Paused',        chip: 'chip-paused' },
        { value: 'completed',    label: 'Completed',     chip: 'chip-completed' },
      ];
      const statusDef = CAMP_STATUSES.find(s => s.value === c.status) || CAMP_STATUSES[1];
      const chipClass = statusDef.chip;
      const statusLabel = statusDef.label;
      const currentStageName = stages[currentStage] || 'Complete';

      const backBtn = selStage > 0
        ? `<button class="btn btn-ghost" style="font-size:11px;padding:3px 8px;" onclick="advanceCampStage(${c.id},${selStage - 1},event)">← Back</button>`
        : '';
      const isLastStage = selStage + 1 === stages.length;
      const pastEnd = selStage >= stages.length;
      const advBtn = pastEnd
        ? `<a href="/pages/reports.html?campaign=${c.id}" class="btn btn-primary" style="font-size:11px;padding:3px 8px;">View Report →</a>`
        : `<button class="btn btn-primary" style="font-size:11px;padding:3px 8px;" onclick="${isLastStage ? `completeCampaign(${c.id},event)` : `advanceCampStage(${c.id},${selStage + 1},event)`}">${isLastStage ? 'Complete →' : 'Advance →'}</button>`;

      let setup = null;
      if (c.setup) {
        try {
          setup = typeof c.setup === 'string' ? JSON.parse(c.setup) : c.setup;
        } catch (e) {
          console.warn('Failed to parse campaign setup:', e);
        }
      }
      const setupHtml = setup ? (() => {
        const parts = [];
        if (setup.angle) parts.push(`<div style="margin-bottom:12px;"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:5px;">Campaign Angle</div><div style="font-size:13px;line-height:1.6;">${setup.angle}</div></div>`);
        if (setup.keyMessages?.length) parts.push(`<div style="margin-bottom:12px;"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:5px;">Key Messages</div>${setup.keyMessages.map(m=>`<div style="font-size:13px;padding:3px 0;border-bottom:1px solid var(--border);">${m}</div>`).join('')}</div>`);
        if (setup.spokespeople?.length) parts.push(`<div style="margin-bottom:4px;"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:5px;">Spokespeople</div>${setup.spokespeople.map(s=>`<div style="font-size:13px;padding:3px 0;border-bottom:1px solid var(--border);">${s}</div>`).join('')}</div>`);
        return parts.length ? `<div style="background:var(--surface-2);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;">${parts.join('')}</div>` : '';
      })() : '';

      const stageTabs = stages.map((s, i) => {
        const done = i < currentStage;
        const active = i === selStage;
        return `<button class="tab-btn ${active ? 'active' : ''}"
          style="${done ? 'color:var(--success);' : ''}"

      const ALL_PLATFORMS = ['Instagram','Facebook','TikTok','LinkedIn','YouTube','Pinterest','Threads','X'];
      const FREQ_OPTIONS  = ['Daily','2x / week','3x / week','4x / week','5x / week','Weekly','Fortnightly','Monthly'];

      const socialSetupHtml = isSocial ? `
        <div style="padding-bottom:14px;">
          <div style="background:var(--surface-2);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;">

            <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:10px;">Platforms</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;">

            <div style="display:flex;flex-direction:column;gap:8px;">

                  <span style="font-size:13px;font-weight:500;width:100px;flex-shrink:0;">${p}</span>
                  <select onchange="saveSocialFrequency(${c.id},'${p}',this.value)" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:12px;padding:4px 8px;flex:1;">
                    <option value="">— select —</option>

      const expandedHtml = isExpanded ? (isSocial ? socialSetupHtml : `
        <div style="padding-bottom:14px;">
          ${setupHtml}
          <div id="camp-tasks-${c.id}" style="margin-bottom:14px;min-height:60px;">
            <p style="font-size:12px;color:var(--text-muted);">Loading…</p>
          </div>
          <div style="display:flex;justify-content:flex-end;">
            <a href="${campBoardUrl(c)}" style="font-size:11px;color:var(--accent);">Open full board →</a>
          </div>
        </div>
      `) : '';

      return `
        <div class="camp-item" data-camp-id="${c.id}">
          <div class="camp-summary" onclick="toggleCamp(${c.id}, ${currentStage})">
            <div>
              <div style="font-size:13px;font-weight:600;">${c.name}</div>
              ${c.type ? `<div style="font-size:11px;color:var(--text-muted);margin-top:1px;">${c.type} · ${currentStageName}</div>` : ''}

            <div style="display:flex;align-items:center;gap:8px;">

                <span class="status-chip ${chipClass} camp-status-chip" onclick="toggleCampStatusDrop(${c.id}, this)">${statusLabel}</span>
                <div class="camp-status-drop" id="camp-status-drop-${c.id}">
                  ${CAMP_STATUSES.map(s => `<div class="camp-status-opt" onclick="setCampStatus(${c.id}, '${s.value}')">${s.label}</div>`).join('')}
                </div>
              </div>
              <span class="camp-item-arrow" style="font-size:11px;color:var(--text-dim);">${isExpanded ? '▲' : '▼'}</span>
            </div>
          </div>
          ${expandedHtml}
        </div>
      `;
    }

    // ── Social setup helpers ───────────────────────────────────────────────────

    async function getSocialAdmin(campId) {
      const c = campaigns.find(x => x.id === campId);
      let admin = {};
      if (c && c.social_admin) {
        try { admin = typeof c.social_admin === 'string' ? JSON.parse(c.social_admin) : c.social_admin; } catch(e) {}
      }
      return admin;
    }

    async function saveSocialAdmin(campId, patch) {
      const admin = await getSocialAdmin(campId);
      const updated = { ...admin, ...patch };
      await fetch(`/api/campaigns/${campId}/social-admin`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ social_admin: updated }),
      });
      const c = campaigns.find(x => x.id === campId);
      if (c) c.social_admin = updated;
    }

    async function toggleSocialPlatform(campId, platform) {
      const admin = await getSocialAdmin(campId);
      const platforms = admin.platforms || [];
      const idx = platforms.indexOf(platform);
      if (idx === -1) platforms.push(platform);
      else {
        platforms.splice(idx, 1);
        const freqs = admin.frequencies || {};
        delete freqs[platform];
        admin.frequencies = freqs;
      }
      await saveSocialAdmin(campId, { platforms });
      renderCampCard(campId);
    }

    async function saveSocialFrequency(campId, platform, value) {
      const admin = await getSocialAdmin(campId);
      const frequencies = admin.frequencies || {};
      frequencies[platform] = value;
      await saveSocialAdmin(campId, { frequencies });
    }

    // ── Campaign expand / stage / task actions ─────────────────────────────────

    function toggleCamp(campId, currentStage) {
      if (expandedCamps.has(campId)) {
        expandedCamps.delete(campId);
      } else {
        expandedCamps.add(campId);
        if (selectedStages[campId] === undefined) selectedStages[campId] = currentStage;
      }
      renderCampCard(campId);
    }

    function selectCampStage(campId, stageIndex) {
      selectedStages[campId] = stageIndex;
      renderCampCard(campId);
    }

    async function advanceCampStage(campId, newStageIndex, event) {
      if (event) event.stopPropagation();
      const camp = campaigns.find(c => c.id == campId);
      if (!camp) return;
      const stages = STAGES[camp.type] || STAGES.default;
      const clamped = Math.max(0, Math.min(stages.length, newStageIndex));
      await fetch(`/api/campaigns/${campId}/stage`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stage: clamped })
      });
      camp.current_stage = clamped;
      selectedStages[campId] = clamped;
      renderCampCard(campId);
    }

    async function completeCampaign(campId, event) {
      if (event) event.stopPropagation();
      const camp = campaigns.find(c => c.id == campId);
      if (!camp) return;
      const stages = STAGES[camp.type] || STAGES.default;
      await Promise.all([
        fetch(`/api/campaigns/${campId}/stage`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stage: stages.length })
        }),
        fetch(`/api/campaigns/${campId}/status`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'completed' })
        }),
      ]);
      window.location.href = `/pages/reports.html?campaign=${campId}`;
    }

    async function loadCampTasks(campId) {
      const res = await fetch(`/api/campaigns/${campId}/tasks`);
      const tasks = (res.ok ? await res.json() : []).sort((a,b) => a.stage_index - b.stage_index);
      campTasksData[campId] = tasks;
      const list = document.getElementById(`camp-tasks-${campId}`);
      if (!list) return;
      if (!tasks.length) {
        list.innerHTML = `<p style="font-size:12px;color:var(--text-muted);margin:0;">No tasks yet.</p>`;
        return;
      }
      const camp = campaigns.find(c => c.id === campId);
      const isPR = camp && (camp.type === 'PR' || camp.type === 'PR Light');
      const stages = STAGES[camp?.type] || STAGES.default;
      const stagesHtml = stages.map((stageName, stageIdx) => {
        const stageTasks = tasks.filter(t => t.stage_index === stageIdx);
        if (!stageTasks.length) return '';
        const btns = stageTasks.map(t => {
          const isDone = !!t.done;
          const isResearchTask = isPR && t.title && (t.title.toLowerCase().includes('research articles') || t.title.toLowerCase().includes('conduct campaign research'));
          const researchAction = isResearchTask
            ? `<div style="display:flex;gap:5px;margin-top:5px;">
                <button class="btn btn-ghost" style="font-size:10px;padding:2px 7px;" onclick="event.stopPropagation();openCbResearch(${campId})">✦ Research</button>
                <a href="/pitch-list/${campId}" class="btn btn-ghost" style="font-size:10px;padding:2px 7px;">Pitch List →</a>
               </div>`
            : '';
          return `
            <div class="cb-task-btn ${isDone ? 'done' : ''}" id="camp-task-${t.id}" onclick="toggleCampTask(${campId},${t.id},${isDone ? 0 : 1})">
              <div style="display:flex;align-items:center;gap:7px;">
                <div class="cb-task-check">${isDone ? '✓' : ''}</div>
                <span style="font-size:12px;font-weight:500;">${escHtml(t.title)}</span>
              </div>
              ${researchAction}
            </div>`;
        }).join('');
        return `
          <div style="margin-bottom:10px;">
            <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border);">${escHtml(stageName)}</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;">${btns}</div>
          </div>`;
      }).filter(Boolean).join('');
      list.innerHTML = stagesHtml || `<p style="font-size:12px;color:var(--text-muted);margin:0;">No tasks yet.</p>`;
    }

    async function cbSaveCampField(campId, taskId, field, value) {
      const sanitized = (value && value.trim) ? value.trim() : value;
      if (field === 'title' && !sanitized) { cbCancelCell(document.querySelector(`#camp-task-${taskId} .cb-cell-title`)); return; }
      const row = document.getElementById(`camp-task-${taskId}`);
      if (row) {
        row.querySelectorAll('.cb-cell').forEach(c => c.classList.remove('editing'));
        const cellCls = { title:'title', estimated_time:'time', due_date:'due', approver:'approver', assignee:'assignee', task_type:'type', priority:'priority', progress:'progress' };
        const span = cellCls[field] ? row.querySelector(`.cb-cell-${cellCls[field]} > span`) : null;
        if (span) {
          if (field === 'progress') span.innerHTML = `<span class="progress-chip ${progressClass(sanitized||'Not Assigned')}">${escHtml(sanitized||'Not Assigned')}</span>`;
          else if (field === 'assignee' || field === 'approver') span.innerHTML = assigneeDisplay(sanitized);
          else span.innerHTML = escHtml(sanitized) || '<span style=color:var(--text-dim)>—</span>';
        }
      }
      const tasks = campTasksData[campId] || [];
      const task = tasks.find(t => t.id === taskId);
      if (task) {
        task[field] = sanitized || null;
        if (field === 'progress') task.done = sanitized === 'Complete' ? 1 : 0;
      }
      const campBody = { [field]: sanitized || null };
      if (field === 'progress') campBody.done = sanitized === 'Complete' ? 1 : 0;
      await fetch(`/api/campaigns/${campId}/tasks/${taskId}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(campBody)
      });
    }

    async function cbSaveClientField(taskId, field, value) {
      const sanitized = (value && value.trim) ? value.trim() : value;
      if (field === 'title' && !sanitized) { cbCancelCell(document.querySelector(`#client-task-${taskId} .cb-cell-title`)); return; }
      const row = document.getElementById(`client-task-${taskId}`);
      if (row) {
        row.querySelectorAll('.cb-cell').forEach(c => c.classList.remove('editing'));
        const cellCls = { title:'title', estimated_time:'time', due_date:'due', approver:'approver', assignee:'assignee', task_type:'type', priority:'priority', progress:'progress' };
        const span = cellCls[field] ? row.querySelector(`.cb-cell-${cellCls[field]} > span`) : null;
        if (span) {
          if (field === 'progress') {
            span.innerHTML = `<span class="progress-chip ${progressClass(sanitized)}">${escHtml(sanitized||'Not Assigned')}</span>`;
            const isDone = sanitized === 'Complete';
            row.classList.toggle('done', isDone);
            const cb = row.querySelector('input[type=checkbox]');
            if (cb) cb.checked = isDone;
            const t = clientTasksAll.find(x => x.id === taskId);
            if (t) { t.progress = sanitized; t.status = isDone ? 'done' : 'todo'; }
            updateClientTaskCount();
          } else if (field === 'assignee' || field === 'approver') {
            span.innerHTML = assigneeDisplay(sanitized);
          } else {
            span.innerHTML = escHtml(sanitized) || '<span style=color:var(--text-dim)>—</span>';
          }
        }
      }
      const body = { [field]: sanitized || null };
      if (field === 'progress') body.status = sanitized === 'Complete' ? 'done' : 'todo';
      await fetch(`/api/tasks/${taskId}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    async function toggleClientTask(taskId, checked) {
      const status = checked ? 'done' : 'todo';
      const row = document.getElementById(`client-task-${taskId}`);
      if (row) row.classList.toggle('done', checked);
      const t = clientTasksAll.find(x => x.id === taskId);
      if (t) t.status = status;
      updateClientTaskCount();
      await fetch(`/api/tasks/${taskId}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
    }

    async function deleteClientTask(taskId) {
      if (!confirm('Delete this task?')) return;
      await fetch(`/api/tasks/${taskId}`, { method: 'DELETE' });
      clientTasksAll = clientTasksAll.filter(t => t.id !== taskId);
      renderTasksTab();
    }

      document.getElementById(`cb-add-trigger-${campId}`).style.display = 'none';
      document.getElementById(`cb-add-form-${campId}`).classList.add('open');

    async function addCampTask(campId) {
      const input = document.getElementById(`camp-task-input-${campId}`);
      const title = input.value.trim();
      if (!title) return;
      const selStage = selectedStages[campId] !== undefined ? selectedStages[campId] : 0;
      const assignee = document.getElementById(`camp-task-assignee-${campId}`)?.value.trim();
      const due_date = document.getElementById(`camp-task-due-${campId}`)?.value;
      input.value = '';
      if (document.getElementById(`camp-task-assignee-${campId}`)) document.getElementById(`camp-task-assignee-${campId}`).value = '';
      if (document.getElementById(`camp-task-due-${campId}`)) document.getElementById(`camp-task-due-${campId}`).value = '';
      await fetch(`/api/campaigns/${campId}/tasks`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stage_index: selStage, title, assignee: assignee || null, due_date: due_date || null })
      });
      loadCampTasks(campId);

    async function toggleCampTask(campId, taskId, done) {
      const btn = document.getElementById(`camp-task-${taskId}`);
      if (btn) {
        btn.classList.toggle('done', !!done);
        const check = btn.querySelector('.cb-task-check');
        if (check) check.textContent = done ? '✓' : '';
        btn.onclick = () => toggleCampTask(campId, taskId, done ? 0 : 1);
      }
      const task = (campTasksData[campId] || []).find(t => t.id === taskId);
      if (task) task.done = done;
      await fetch(`/api/campaigns/${campId}/tasks/${taskId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done: !!done })
      });
    }

    async function deleteCampTask(campId, taskId) {
      await fetch(`/api/campaigns/${campId}/tasks/${taskId}`, { method: 'DELETE' });
      loadCampTasks(campId);
    }

    async function openStrategyDrawer(strategyId) {
      document.getElementById('strat-overlay').classList.add('open');
      document.getElementById('strat-drawer').classList.add('open');
      document.getElementById('strat-drawer-body').innerHTML = '<p style="font-size:13px;color:var(--text-muted);">Loading…</p>';
      document.getElementById('strat-drawer-footer').innerHTML = '';

      const res = await fetch(`/api/strategies/${strategyId}`);
      if (!res.ok) {
        document.getElementById('strat-drawer-body').innerHTML = '<p style="color:var(--danger);">Could not load strategy.</p>';
        return;
      }
      const s = await res.json();
      let sections = {}, active = [], sectionLabels = {};
      try {
        const rawSections = s.sections ? JSON.parse(s.sections) : {};
        sectionLabels = rawSections._labels || {};
        sections = Object.fromEntries(Object.entries(rawSections).filter(([k]) => k !== '_labels'));
        active = s.active_sections ? JSON.parse(s.active_sections) : [];
      } catch (e) {
        console.warn('Failed to parse strategy sections:', e);
      }

      const chipMap = {
        draft:             'background:var(--surface-2);color:var(--text-muted)',
        awaiting_approval: 'background:#3d2a00;color:#f5a623',
        approved:          'background:#0d3323;color:#3ecf6e',
      };
      const chipLabels = { draft: 'Draft', awaiting_approval: 'Awaiting Approval', approved: 'Approved' };
      const chipStyle = chipMap[s.status] || chipMap.draft;
      const chipLabel = chipLabels[s.status] || s.status;
      const date = s.updated_at ? new Date(s.updated_at).toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' }) : '';

      document.getElementById('strat-drawer-title').textContent = s.title;
      document.getElementById('strat-drawer-meta').innerHTML = `
        <span style="${chipStyle};font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:100px;">${chipLabel}</span>
        ${date ? `<span style="margin-left:8px;">${date}</span>` : ''}
      `;

      drawerNormalized = {};
      drawerActiveSubtabs = {};
      for (const def of SECTION_DEFS) drawerNormalized[def.id] = normalizeSection(sections[def.id]);

      const visibleDefs = orderSectionsForDisplay(active).filter(def => sectionHasContent(drawerNormalized[def.id]));

      if (!visibleDefs.length) {
        document.getElementById('strat-drawer-body').innerHTML = '<p style="font-size:13px;color:var(--text-muted);">No content yet — open the strategy builder to start drafting.</p>';
      } else {
        document.getElementById('strat-drawer-body').innerHTML = visibleDefs.map(def => `
            <div class="strat-section" data-section-id="${def.id}">
              <div class="strat-section-label">${escHtml(sectionLabels[def.id] || def.label)}</div>
              <div class="strat-section-content">${renderSection(drawerNormalized[def.id], { topId: def.id, activeSubtabId: drawerActiveSubtabs[def.id], onSubtabClick: 'onDrawerSubtabClick' })}</div>
            </div>
          `).join('');
      }

      document.getElementById('strat-drawer-footer').innerHTML = `
        <a href="/strategy/${s.id}" class="btn btn-primary" style="font-size:12px;">Open Builder</a>
        ${s.share_token && s.status !== 'draft' ? `<a href="/s/${s.share_token}" target="_blank" class="btn btn-ghost" style="font-size:12px;">Client View</a>` : ''}
      `;
    }

    function strategyChip(status) {
      const map = {
        draft:              'background:var(--surface-2);color:var(--text-muted);',
        awaiting_approval:  'background:#3d2a00;color:#f5a623;',
        approved:           'background:#0d3323;color:#3ecf6e;',

      const labels = { draft: 'Draft', awaiting_approval: 'Awaiting Approval', approved: 'Approved' };
      return { style: map[status] || map.draft, label: labels[status] || status };
    }

    function renderStrategyCard(strategies) {
      const el = document.getElementById('strategy-list');
      const newBtn = document.getElementById('strategy-new-btn');
      if (!el) return;

      // Hide "+ New" once a strategy exists
      if (newBtn) newBtn.style.display = strategies.length ? 'none' : '';

    async function copyStrategyLink(token, btn) {
      const link = `${location.origin}/s/${token}`;
      try {
        await navigator.clipboard.writeText(link);
        const orig = btn.textContent;
        btn.textContent = '✓';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      } catch {
        prompt('Copy this link:', link);
      }
    }

      try {
        const createRes = await fetch('/api/strategies', {
