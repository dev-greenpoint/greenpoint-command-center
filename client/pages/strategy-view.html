<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strategy — Greenpoint Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/strategy-blocks.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1C1C1A;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.10);
      --border-soft: rgba(255,255,255,0.06);
      --accent: #738C7B;
      --accent-light: #9CAA98;
      --text: #fff;
      --text-70: rgba(255,255,255,0.70);
      --text-60: rgba(255,255,255,0.60);
      --text-40: rgba(255,255,255,0.40);
      --text-25: rgba(255,255,255,0.25);
      --tab-bg: #191917;
      --radius: 8px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ── */
    .outer { max-width: 1280px; margin: 0 auto; padding: 0 20px; }
    @media (min-width: 768px) { .outer { padding: 0 40px; } }
    @media (min-width: 1024px) { .outer { padding: 0 64px; } }

    /* ── Top bar ── */
    .topbar {
      padding: 20px 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .gp-logo { height: 18px; width: auto; }
    .topbar-badge {
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      color: var(--text-60);
    }

    /* ── Hero ── */
    .hero {
      padding: 48px 0 40px;
    }
    .hero-eyebrow {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--accent-light);
      margin-bottom: 16px;
    }
    .hero-title {
      font-size: clamp(2.2rem, 6vw, 5rem);
      font-weight: 300;
      line-height: 1.08;
      letter-spacing: -.02em;
      margin-bottom: 24px;
    }
    .hero-desc {
      font-size: 16px;
      line-height: 1.75;
      color: var(--text-70);
      max-width: 680px;
    }

    /* ── Tab bar ── */
    .tab-wrap {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg);
      padding-top: 8px;
    }
    .tab-bar {
      display: flex;
      align-items: center;
      gap: 2px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
      margin-bottom: 0;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0;
      padding: 8px 16px;
      border-radius: 8px 8px 0 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-60);
      background: none;
      border: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      font-family: var(--font);
      white-space: nowrap;
      margin-bottom: -1px;
    }
    .tab-btn:hover:not(.active) { background: var(--surface); color: var(--text); }
    .tab-btn.active { background: var(--accent); color: #fff; font-weight: 600; }

    /* ── Section content area ── */
    .content-area {
      min-height: 60vh;
      padding: 48px 0 120px;
    }

    /* ── Section header ── */
    .section-eyebrow {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .section-title {
      font-size: clamp(1.6rem, 3.5vw, 2.7rem);
      font-weight: 300;
      line-height: 1.15;
      margin-bottom: 16px;
    }

    /* ── Bottom nav ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(28, 28, 26, 0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
    }
    .bottom-nav-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }
    @media (min-width: 768px) { .bottom-nav-inner { padding: 0 40px; } }
    @media (min-width: 1024px) { .bottom-nav-inner { padding: 0 64px; } }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-60);
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font);
      padding: 8px 0;
      transition: color 0.15s;
    }
    .nav-btn:hover { color: var(--text); }
    .nav-btn:disabled { visibility: hidden; }
    .nav-arrow { font-size: 14px; }

    /* ── Footer ── */
    .footer {
      padding: 24px 0 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }
    .footer-text { font-size: 12px; color: var(--text-25); }

    /* ── Error / loading ── */
    .center-msg {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
    }
    .center-msg h2 { font-size: 22px; font-weight: 300; }
    .center-msg p { font-size: 14px; color: var(--text-60); }
  </style>
</head>
<body>
  <div class="outer">
    <div class="topbar">
      <img
        src="https://res.cloudinary.com/dfers76ex/image/upload/v1778739088/Greenpoint-Logo-White_gz5g4m.svg"
        alt="Greenpoint Media"
        class="gp-logo"
        onerror="this.style.display='none';document.getElementById('gp-fallback').style.display='flex'"
      >
      <div id="gp-fallback" style="display:none;align-items:center;gap:8px;">
        <div style="width:28px;height:28px;background:#738C7B;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;">G</div>
        <span style="font-size:13px;font-weight:600;">Greenpoint Media</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="topbar-badge" id="topbar-badge"></div>
      </div>
    </div>
  </div>

  <div id="app-shell" style="display:none;">
    <div class="outer">
      <div class="hero">
        <div class="hero-eyebrow" id="hero-eyebrow"></div>
        <h1 class="hero-title" id="hero-title"></h1>
        <p class="hero-desc" id="hero-desc"></p>
      </div>
    </div>

    <div class="tab-wrap">
      <div class="outer">
        <div class="tab-bar" id="tab-bar"></div>
      </div>
    </div>

    <div class="outer">
      <div class="content-area" id="content-area"></div>

      <div class="footer">
        <p class="footer-text" id="footer-text"></p>
        <img
          src="https://res.cloudinary.com/dfers76ex/image/upload/v1778739088/Greenpoint-Logo-White_gz5g4m.svg"
          alt="Greenpoint"
          style="height:12px;opacity:0.25;"
          onerror="this.style.display='none'"
        >
      </div>
    </div>
  </div>

  <div id="loading" class="outer">
    <div class="center-msg" style="color:rgba(255,255,255,0.3);">
      <p>Loading strategy…</p>
    </div>
  </div>

  <div class="bottom-nav" id="bottom-nav" style="display:none;">
    <div class="bottom-nav-inner">
      <button class="nav-btn" id="nav-prev" onclick="goTab(-1)">
        <span class="nav-arrow">←</span>
        <span id="nav-prev-label"></span>
      </button>
      <button class="nav-btn" id="nav-next" onclick="goTab(1)">
        <span id="nav-next-label"></span>
        <span class="nav-arrow">→</span>
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script src="/components/section-defs.js"></script>
  <script src="/components/strategy-render.js"></script>
  <script>
    const token = location.pathname.replace('/s/', '').replace(/\/$/, '');
    let activeSectionIndex = 0;
    let activeSubtabId = null;
    let sectionDefs = [];
    let sections = {};
    let strategyData = null;

    function esc(str) {
      return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Tab navigation ────────────────────────────────────────────────────────────

    function renderTabBar() {
      const bar = document.getElementById('tab-bar');
      let html = '';
      sectionDefs.forEach((s, i) => {
        html += `<button class="tab-btn ${i===activeSectionIndex?'active':''}" onclick="setTab(${i})">${esc(s.label)}</button>`;
      });
      bar.innerHTML = html;
    }

    function updateBottomNav() {
      const prev = document.getElementById('nav-prev');
      const next = document.getElementById('nav-next');
      const prevLabel = document.getElementById('nav-prev-label');
      const nextLabel = document.getElementById('nav-next-label');

      const hasPrev = activeSectionIndex > 0;
      const hasNext = activeSectionIndex < sectionDefs.length - 1;

      prev.disabled = !hasPrev;
      next.disabled = !hasNext;
      prevLabel.textContent = hasPrev ? sectionDefs[activeSectionIndex - 1].label : '';
      nextLabel.textContent = hasNext ? sectionDefs[activeSectionIndex + 1].label : '';
    }

    function setTab(i) {
      activeSectionIndex = i;
      activeSubtabId = null;
      renderTabBar();
      renderCurrentSection();
      updateBottomNav();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goTab(dir) {
      const next = activeSectionIndex + dir;
      if (next >= 0 && next < sectionDefs.length) setTab(next);
    }

    function onViewSubtabClick(topId, subId) {
      activeSubtabId = subId;
      renderCurrentSection();
    }

    function renderCurrentSection() {
      const def = sectionDefs[activeSectionIndex];
      const normalized = normalizeSection(sections[def.id]);
      if (Array.isArray(normalized.subtabs) && normalized.subtabs.length) {
        const active = normalized.subtabs.filter(st => st.active !== false);
        if (!activeSubtabId || !active.some(st => st.id === activeSubtabId)) {
          activeSubtabId = active[0] ? active[0].id : null;
        }
      } else {
        activeSubtabId = null;
      }
      const area = document.getElementById('content-area');
      area.innerHTML = `
        <div class="section-eyebrow">${esc(def.label)}</div>
        <h2 class="section-title">${esc(def.label)}</h2>
        <div style="margin-top:32px;">${renderSection(normalized, { topId: def.id, activeSubtabId, onSubtabClick: 'onViewSubtabClick' })}</div>
      `;
    }

    // ── Load ─────────────────────────────────────────────────────────────────────

    async function load() {
      const res = await fetch(`/api/strategies/share/${token}`);

      document.getElementById('loading').style.display = 'none';

      if (!res.ok) {
        document.body.innerHTML += `<div class="outer"><div class="center-msg"><h2>Strategy not found</h2><p>This link may be invalid or the strategy has been unpublished.</p></div></div>`;
        return;
      }

      strategyData = await res.json();
      const rawSections = strategyData.sections ? JSON.parse(strategyData.sections) : {};
      const sectionLabels = rawSections._labels || {};
      const rawEntries = Object.fromEntries(Object.entries(rawSections).filter(([k]) => k !== '_labels'));
      sections = {};
      for (const s of SECTION_DEFS) {
        sections[s.id] = normalizeSection(rawEntries[s.id]);
      }
      const activeSectionIds = strategyData.active_sections ? JSON.parse(strategyData.active_sections) : [];

      sectionDefs = orderSectionsForDisplay(activeSectionIds)
        .filter(s => sectionHasContent(sections[s.id]))
        .map(s => sectionLabels[s.id] ? { ...s, label: sectionLabels[s.id] } : s);

      if (!sectionDefs.length) {
        document.body.innerHTML += `<div class="outer"><div class="center-msg"><h2>No content yet</h2><p>This strategy is still being prepared.</p></div></div>`;
        return;
      }

      document.title = `${strategyData.title} — Greenpoint Media`;

      // Populate hero
      const now = new Date();
      const monthYear = now.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' });
      const clientPart = strategyData.client_name ? `${strategyData.client_name} · ` : '';
      document.getElementById('hero-eyebrow').textContent = `${clientPart}${monthYear}`;
      document.getElementById('hero-title').textContent = strategyData.title;
      document.getElementById('topbar-badge').textContent = `Greenpoint × ${strategyData.client_name || strategyData.campaign_name || 'Client'}`;

      if (strategyData.campaign_name) {
        document.getElementById('hero-desc').textContent = strategyData.campaign_name;
      } else {
        document.getElementById('hero-desc').style.display = 'none';
      }

      document.getElementById('footer-text').textContent = `${strategyData.title}, ${monthYear}`;

      document.getElementById('app-shell').style.display = 'block';
      document.getElementById('bottom-nav').style.display = 'block';

      renderTabBar();
      renderCurrentSection();
      updateBottomNav();
    }

    load();
  </script>
</body>
</html>
