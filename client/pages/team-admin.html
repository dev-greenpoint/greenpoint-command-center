<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team — Greenpoint</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/main.css">
  <script src="/components/theme.js"></script>
  <style>
    .drawer-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 200;
    }
    .drawer-overlay.open { display: block; }
    .drawer {
      position: fixed; top: 0; right: -480px;
      width: 480px; height: 100%;
      background: var(--surface); border-left: 1px solid var(--border);
      z-index: 201; display: flex; flex-direction: column;
      transition: right 0.25s ease;
    }
    .drawer.open { right: 0; }
    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--border);
    }
    .drawer-header h2 { font-size: 15px; font-weight: 600; }
    .drawer-close {
      background: none; border: none;
      color: var(--text-muted); cursor: pointer; font-size: 20px; line-height: 1;
    }
    .drawer-body {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .drawer-footer {
      padding: 16px 20px; border-top: 1px solid var(--border);
      display: flex; gap: 8px; justify-content: flex-end;
    }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .form-group input, .form-group select {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-size: 13px; padding: 8px 10px; font-family: var(--font); width: 100%;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none; border-color: var(--accent);
    }
    .member-row {
      display: grid;
      grid-template-columns: 36px 1fr 140px 200px 64px;
      gap: 0 12px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .member-row:last-child { border-bottom: none; }
    .member-row:hover { background: var(--surface-2); }
    .av {
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%; font-weight: 700; color: #fff;
      width: 32px; height: 32px; font-size: 12px; flex-shrink: 0;
    }
    .member-name { font-weight: 500; }
    .member-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .role-chip {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: 100px;
      font-size: 11px; font-weight: 600;
      background: var(--surface-2); color: var(--text-muted);
    }
    .role-lead    { background: #1a2a40; color: #7eb8f7; }
    .role-support { background: #0d3323; color: var(--success); }
    .role-coach   { background: #2d1d40; color: #c4a0f7; }
    .role-director { background: #3d2a00; color: var(--warning); }
    .col-hd {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; color: var(--text-muted); padding: 6px 12px 6px;
    }
    .member-header {
      display: grid;
      grid-template-columns: 36px 1fr 140px 200px 64px;
      gap: 0 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }
    .row-actions { display: flex; gap: 4px; justify-content: flex-end; }
    .btn-icon {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 14px; padding: 2px 5px;
      border-radius: 4px;
    }
    .btn-icon:hover { color: var(--text); background: var(--surface-2); }
    .btn-icon.del:hover { color: #f87171; }
    .empty-state {
      text-align: center; padding: 48px 20px;
      color: var(--text-muted); font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content">

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
          <div id="member-count" style="font-size:13px;color:var(--text-muted);">Loading…</div>
          <button class="btn btn-primary" id="add-btn">+ Add Member</button>
        </div>

        <div class="card" style="padding:0;overflow:hidden;">
          <div class="member-header">
            <div class="col-hd"></div>
            <div class="col-hd">Name</div>
            <div class="col-hd">Role</div>
            <div class="col-hd">Email</div>
            <div class="col-hd"></div>
          </div>
          <div id="members-list">
            <div class="empty-state">Loading…</div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <div class="drawer-overlay" id="drawer-overlay"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <h2 id="drawer-title">Add Member</h2>
      <button class="drawer-close" id="drawer-close">×</button>
    </div>
    <div class="drawer-body">
      <input type="hidden" id="member-id">
      <div class="form-group">
        <label>Name *</label>
        <input type="text" id="f-name" placeholder="Full name">
      </div>
      <div class="form-group">
        <label>Role</label>
        <select id="f-role">
          <option value="">— Select role —</option>
          <option value="Director">Director</option>
          <option value="Account Lead">Account Lead</option>
          <option value="Account Support">Account Support</option>
          <option value="Account Coach">Account Coach</option>
          <option value="Admin">Admin</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="f-email" placeholder="name@greenpointmedia.com.au">
      </div>
    </div>
    <div class="drawer-footer">
      <button class="btn" id="drawer-cancel">Cancel</button>
      <button class="btn btn-primary" id="drawer-save">Save</button>
    </div>
  </div>

  <script src="/components/shell.js"></script>
  <script>
    renderShell({ pageId: 'team-admin', title: 'Team' });

    const ROLES = ['Director','Account Lead','Account Support','Account Coach','Admin','Other'];
    const ROLE_CLASS = {
      'Account Lead': 'role-lead',
      'Account Support': 'role-support',
      'Account Coach': 'role-coach',
      'Director': 'role-director',
    };

    const PALETTE = ['#5b5fcf','#2e7d32','#8e3a7a','#d4870a','#0277bd','#6a4f00','#00695c','#b71c1c'];
    function avatarColor(name) {
      let h = 0;
      for (let i = 0; i < (name||'').length; i++) h = (name.charCodeAt(i) + ((h << 5) - h)) | 0;
      return PALETTE[Math.abs(h) % PALETTE.length];
    }
    function initials(name) {
      return (name||'').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
    }

    let members = [];

    async function load() {
      const res = await fetch('/api/team-members');
      members = await res.json();
      render();
    }

    function render() {
      const el = document.getElementById('members-list');
      document.getElementById('member-count').textContent =
        members.length === 1 ? '1 member' : `${members.length} members`;

      if (!members.length) {
        el.innerHTML = `<div class="empty-state">No team members yet. Add one to get started.</div>`;
        return;
      }

      el.innerHTML = members.map(m => {
        const roleClass = ROLE_CLASS[m.role] || '';
        return `
          <div class="member-row">
            <span class="av" style="background:${avatarColor(m.name)}">${initials(m.name)}</span>
            <div>
              <div class="member-name">${m.name}</div>
            </div>
            <div>${m.role ? `<span class="role-chip ${roleClass}">${m.role}</span>` : '<span style="color:var(--text-dim)">—</span>'}</div>
            <div style="color:var(--text-muted);font-size:12px;">${m.email || '—'}</div>
            <div class="row-actions">
              <button class="btn-icon" onclick="openEdit(${m.id})" title="Edit">✎</button>
              <button class="btn-icon del" onclick="deleteMember(${m.id})" title="Delete">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openDrawer(id = null) {
      const m = id ? members.find(x => x.id === id) : null;
      document.getElementById('drawer-title').textContent = m ? 'Edit Member' : 'Add Member';
      document.getElementById('member-id').value = m ? m.id : '';
      document.getElementById('f-name').value = m ? m.name : '';
      document.getElementById('f-role').value = m ? (m.role || '') : '';
      document.getElementById('f-email').value = m ? (m.email || '') : '';
      document.getElementById('drawer').classList.add('open');
      document.getElementById('drawer-overlay').classList.add('open');
      document.getElementById('f-name').focus();
    }

    function openEdit(id) { openDrawer(id); }

    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
      document.getElementById('drawer-overlay').classList.remove('open');
    }

    async function deleteMember(id) {
      const m = members.find(x => x.id === id);
      if (!m || !confirm(`Remove ${m.name} from the team?`)) return;
      await fetch(`/api/team-members/${id}`, { method: 'DELETE' });
      await load();
    }

    document.getElementById('add-btn').addEventListener('click', () => openDrawer());
    document.getElementById('drawer-close').addEventListener('click', closeDrawer);
    document.getElementById('drawer-cancel').addEventListener('click', closeDrawer);
    document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);

    document.getElementById('drawer-save').addEventListener('click', async () => {
      const id = document.getElementById('member-id').value;
      const name = document.getElementById('f-name').value.trim();
      if (!name) { document.getElementById('f-name').focus(); return; }

      const body = {
        name,
        role: document.getElementById('f-role').value || null,
        email: document.getElementById('f-email').value.trim() || null,
      };

      if (id) {
        await fetch(`/api/team-members/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
      } else {
        await fetch('/api/team-members', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
      }

      closeDrawer();
      await load();
    });

    load();
  </script>
</body>
</html>
