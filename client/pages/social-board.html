<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Board — Greenpoint</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    .board-header { display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap; }
    .status-chip { display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:600; }
    .chip-active    { background:#0d3323;color:var(--success); }
    .chip-draft     { background:var(--surface-2);color:var(--text-muted); }
    .chip-paused    { background:#3d2a00;color:var(--warning); }
    .chip-completed { background:#1a1a2e;color:#8888cc; }

    .scope-bar {
      background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      padding:12px 16px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;
    }
    .scope-block { display:flex;flex-direction:column;gap:4px; }
    .scope-label { font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim); }
    .platform-chips { display:flex;flex-wrap:wrap;gap:5px; }
    .platform-chip {
      background:var(--surface-2);border:1px solid var(--border);border-radius:4px;
      padding:2px 8px;font-size:11px;color:var(--text-muted);font-weight:500;
    }

    .stage-section { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden; }
    .stage-header { display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none; }
    .stage-section:not(.open) .stage-header { border-bottom-color:transparent; }
    .stage-num { width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text-muted);flex-shrink:0; }
    .stage-name { font-size:13px;font-weight:600;flex:1; }
    .stage-task-count { font-size:11px;color:var(--text-muted); }
    .stage-chevron { font-size:10px;color:var(--text-dim);transition:transform 0.2s; }
    .stage-section.open .stage-chevron { transform:rotate(180deg); }
    .stage-body { display:none;padding:8px 12px 10px; }
    .stage-section.open .stage-body { display:block; }

    .task-list { width:100%; }
    .task-cols { display:grid;grid-template-columns:18px 1fr 120px 95px 85px 22px;gap:0 8px;padding:0 4px 5px;border-bottom:1px solid var(--border);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em; }
    .task-row { display:grid;grid-template-columns:18px 1fr 120px 95px 85px 22px;gap:0 8px;padding:0 4px;min-height:34px;align-items:center;border-bottom:1px solid var(--border); }
    .task-row:last-child { border-bottom:none; }
    .task-row:hover { background:var(--surface-2); }
    .task-row.done .task-cell-title span { text-decoration:line-through;color:var(--text-dim); }
    .task-row input[type=checkbox] { width:13px;height:13px;flex-shrink:0;cursor:pointer;accent-color:var(--accent); }

    .task-cell { position:relative;cursor:text;min-width:0; }
    .task-cell span { display:block;font-size:13px;line-height:1;padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .task-cell-assignee span,.task-cell-due span { font-size:12px;color:var(--text-muted); }
    .task-cell input { display:none;width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--accent);border-radius:4px;color:var(--text);font-size:12px;padding:3px 6px; }
    .task-cell input:focus { outline:none; }
    .task-cell select { display:none;width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--accent);border-radius:4px;color:var(--text);font-size:11px;padding:3px 4px;cursor:pointer; }
    .task-cell select:focus { outline:none; }
    .task-cell.editing span { display:none; }
    .task-cell.editing input,.task-cell.editing select { display:block; }

    .av { display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;flex-shrink:0;vertical-align:middle;color:#fff; }
    .task-cell-assignee { cursor:pointer;overflow:visible !important; }
    .task-cell-assignee > span { display:flex;align-items:center;gap:5px; }
    .av-dropdown { display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:300;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 6px 16px rgba(0,0,0,0.35);padding:4px;min-width:150px; }
    .av-dropdown.open { display:block; }
    .av-option { display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;cursor:pointer;font-size:12px; }
    .av-option:hover { background:var(--surface-2); }

    .progress-chip { display:inline-block;padding:2px 7px;border-radius:100px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;cursor:pointer; }
    .pc-not-assigned { background:var(--surface-2);color:var(--text-dim); }
    .pc-planned      { background:#0d1f33;color:#6699cc; }
    .pc-in-progress  { background:#2a1800;color:#cc8800; }
    .pc-in-review    { background:#1a0a2e;color:#9966cc; }
    .pc-complete     { background:#0d3323;color:var(--success); }

    .task-del { background:none;border:none;color:transparent;cursor:pointer;font-size:14px;line-height:1;padding:0;transition:color 0.1s; }
    .task-row:hover .task-del { color:var(--text-dim); }
    .task-del:hover { color:var(--danger) !important; }

    .add-task-row { display:grid;grid-template-columns:18px 1fr;gap:0 8px;padding:0 4px;min-height:32px;align-items:center; }
    .add-task-trigger { font-size:12px;color:var(--text-dim);cursor:pointer;transition:color 0.15s; }
    .add-task-trigger:hover { color:var(--accent); }
    .add-task-inline { display:none; }
    .add-task-inline.open { display:grid;grid-template-columns:1fr 100px 85px auto auto;gap:5px;align-items:center;margin-top:2px;padding:4px 4px 6px; }
    .add-task-inline input { background:var(--surface-2);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;padding:4px 7px;width:100%;box-sizing:border-box; }
    .add-task-inline input:focus { outline:none;border-color:var(--accent); }

    .drawer-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200; }
    .drawer-overlay.open { display:block; }
    .drawer { position:fixed;top:0;right:-400px;width:380px;height:100%;background:var(--surface);border-left:1px solid var(--border);z-index:201;display:flex;flex-direction:column;transition:right 0.25s ease; }
    .drawer.open { right:0; }
    .drawer-header { display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border); }
    .drawer-header h2 { font-size:15px;font-weight:600; }
    .drawer-close { background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:20px;line-height:1; }
    .drawer-body { flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px; }
    .drawer-footer { padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center; }
    .form-group { display:flex;flex-direction:column;gap:5px; }
    .form-group label { font-size:12px;color:var(--text-muted);font-weight:500; }
    .form-group input,.form-group select,.form-group textarea { background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;padding:8px 10px;font-family:var(--font);width:100%; }
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus { outline:none;border-color:var(--accent); }
    .form-group textarea { resize:vertical;min-height:80px; }
    .form-row { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content" id="page-content">
        <p style="color:var(--text-muted);">Loading…</p>
      </main>
    </div>
  </div>

  <div class="drawer-overlay" id="edit-overlay"></div>
  <div class="drawer" id="edit-drawer">
    <div class="drawer-header">
      <h2>Edit Campaign</h2>
      <button class="drawer-close" onclick="closeEditDrawer()">×</button>
    </div>
    <div class="drawer-body">
      <div class="form-group"><label>Campaign Name</label><input type="text" id="f-name"></div>
      <div class="form-row">
        <div class="form-group">
          <label>Status</label>
          <select id="f-status">
            <option value="draft">Draft</option>
            <option value="active">Active</option>
            <option value="paused">Paused</option>
            <option value="completed">Completed</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label>Notes</label><textarea id="f-notes" rows="4"></textarea></div>
    </div>
    <div class="drawer-footer">
      <button class="btn btn-primary" id="edit-save">Save</button>
      <button class="btn btn-ghost" onclick="closeEditDrawer()">Cancel</button>
      <button class="btn btn-danger" style="margin-left:auto;" onclick="deleteCampaign()">Delete</button>
    </div>
  </div>

  <script src="/components/shell.js"></script>
  <script>
    const campaignId = location.pathname.split('/')[2];
    let campaign = null;
    let allTasks = [];
    let teamMembers = [];

    const SOCIAL_STAGES = ['Internal Brief','Strategy & Campaign Direction','Content Planning','Creative Briefing','Content Production','Internal Review','Client Approval','Scheduling','Campaign Launch','Community Management','Optimisation','Reporting'];

    const SOCIAL_GROUPS = [
      { label: 'Set Up',    stages: [0, 1, 2, 3] },
      { label: 'Content',   stages: [4, 5, 6] },
      { label: 'Admin',     stages: [7, 8, 9] },
      { label: 'Reporting', stages: [10, 11] },
    ];

    async function load() {
      const [campRes, tasksRes, teamRes] = await Promise.all([
        fetch(`/api/campaigns/${campaignId}`),
        fetch(`/api/campaigns/${campaignId}/tasks`),
        fetch('/api/team-members/names'),
      ]);
      teamMembers = teamRes.ok ? await teamRes.json() : [];
      if (!campRes.ok) {
        document.getElementById('page-content').innerHTML = '<p style="color:var(--danger);">Campaign not found.</p>';
        return;
      }
      campaign = await campRes.json();
      allTasks = tasksRes.ok ? await tasksRes.json() : [];
      renderShell({ pageId: 'social', title: campaign.name });
      render();
    }

    function render() {
      const scope = campaign.scope ? JSON.parse(campaign.scope) : {};
      const platforms = scope.platforms || [];
      const contentTypes = scope.contentTypes || [];
      const chipClass = { active:'chip-active', draft:'chip-draft', paused:'chip-paused', completed:'chip-completed' }[campaign.status] || 'chip-draft';
      const statusLabel = campaign.status.charAt(0).toUpperCase() + campaign.status.slice(1);

      const scopeBar = (platforms.length || contentTypes.length || scope.notes) ? `
        <div class="scope-bar">
          ${platforms.length ? `
          <div class="scope-block">
            <div class="scope-label">Platforms</div>
            <div class="platform-chips">
              ${platforms.map(p => `<span class="platform-chip">${p.name}${p.posts ? ' · ' + p.posts + '/mo' : ''}</span>`).join('')}
            </div>
          </div>` : ''}
          ${contentTypes.length ? `
          <div class="scope-block">
            <div class="scope-label">Content Types</div>
            <div class="platform-chips">
              ${contentTypes.map(t => `<span class="platform-chip">${t}</span>`).join('')}
            </div>
          </div>` : ''}
          ${scope.notes ? `
          <div class="scope-block">
            <div class="scope-label">Notes</div>
            <div style="font-size:12px;color:var(--text-muted);max-width:300px;">${scope.notes}</div>
          </div>` : ''}
        </div>` : '';

      const stageHtml = (s, i) => {
        const stageTasks = allTasks.filter(t => t.stage_index === i);
        const doneCount = stageTasks.filter(t => t.done).length;
        const taskCountLabel = stageTasks.length ? `${doneCount}/${stageTasks.length}` : '';

        const colHeader = stageTasks.length ? `
          <div class="task-cols">
            <div></div><div>Task</div><div>Progress</div><div>Assignee</div><div>Due</div><div></div>
          </div>` : '';

        const tasksHtml = stageTasks.map(t => {
          const prog = t.progress || 'Not Assigned';
          const progClass = progressClass(prog);
          return `
          <div class="task-row ${t.done ? 'done' : ''}" id="task-row-${t.id}">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleDone(${t.id}, this.checked)">
            <div class="task-cell task-cell-title" onclick="editCell(this, ${t.id}, 'title')">
              <span>${t.title}</span>
              <input type="text" value="${t.title.replace(/"/g, '&quot;')}"
                onblur="saveField(${t.id}, 'title', this.value)"
                onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape')cancelCell(this.parentElement)">
            </div>
            <div class="task-cell task-cell-progress" onclick="editCell(this, ${t.id}, 'progress')">
              <span><span class="progress-chip ${progClass}">${prog}</span></span>
              <select onchange="saveField(${t.id}, 'progress', this.value)" onblur="cancelCell(this.parentElement)">
                ${['Not Assigned','Planned','In Progress','In Review','Complete'].map(o => `<option${o===prog?' selected':''}>${o}</option>`).join('')}
              </select>
            </div>
            <div class="task-cell task-cell-assignee" onclick="openAssigneeSelector(event, ${t.id})">
              <span>${assigneeDisplay(t.assignee)}</span>
              <div class="av-dropdown" id="av-drop-${t.id}">
                <div class="av-option" onclick="event.stopPropagation();selectAssignee(${t.id}, null)">
                  <span style="font-size:11px;color:var(--text-dim)">— Unassign</span>
                </div>
                ${teamMembers.map(name => `
                  <div class="av-option" onclick="event.stopPropagation();selectAssignee(${t.id}, '${name.replace(/'/g, "\\'")}')">
                    ${avatarHtml(name)} ${name}
                  </div>`).join('')}
              </div>
            </div>
            <div class="task-cell task-cell-due" onclick="editCell(this, ${t.id}, 'due_date')">
              <span>${t.due_date || '<span style=color:var(--text-dim)>—</span>'}</span>
              <input type="date" value="${t.due_date || ''}"
                onchange="saveField(${t.id}, 'due_date', this.value)"
                onblur="saveField(${t.id}, 'due_date', this.value)"
                onkeydown="if(event.key==='Escape')cancelCell(this.parentElement)">
            </div>
            <button class="task-del" onclick="deleteTask(${t.id})" title="Delete">×</button>
          </div>`;
        }).join('');

        return `
          <div class="stage-section open" id="stage-section-${i}">
            <div class="stage-header" onclick="toggleSection(${i})">
              <div class="stage-num">${i + 1}</div>
              <div class="stage-name">${s}</div>
              ${taskCountLabel ? `<span class="stage-task-count">${taskCountLabel}</span>` : ''}
              <span class="stage-chevron">▼</span>
            </div>
            <div class="stage-body">
              <div class="task-list">
                ${colHeader}
                ${tasksHtml}
              </div>
              <div class="add-task-row">
                <div></div>
                <div class="add-task-trigger" id="add-trigger-${i}" onclick="showAddForm(${i})">+ Add task</div>
              </div>
              <div class="add-task-inline" id="add-form-${i}">
                <input type="text" id="add-title-${i}" placeholder="Task title…" onkeydown="if(event.key==='Enter')submitTask(${i});if(event.key==='Escape')hideAddForm(${i})">
                <input type="text" id="add-assignee-${i}" placeholder="Assignee">
                <input type="date" id="add-due-${i}">
                <button class="btn btn-primary" style="font-size:12px;padding:4px 10px;white-space:nowrap;" onclick="submitTask(${i})">Add</button>
                <button class="btn btn-ghost" style="font-size:12px;padding:4px 8px;" onclick="hideAddForm(${i})">✕</button>
              </div>
            </div>
          </div>`;
      };

      const sectionsHtml = SOCIAL_GROUPS.map(group => `
        <div style="margin-bottom:6px;margin-top:20px;">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);padding:0 2px 8px;">${group.label}</div>
          ${group.stages.map(i => stageHtml(SOCIAL_STAGES[i], i)).join('')}
        </div>
      `).join('');

      document.getElementById('page-content').innerHTML = `
        <div class="board-header">
          <a href="/social" style="color:var(--text-muted);font-size:13px;text-decoration:none;">← Social</a>
          ${campaign.client_name ? `<span style="color:var(--text-dim);">›</span><a href="/clients/${campaign.client_id}/board" style="color:var(--text-muted);font-size:13px;text-decoration:none;">${campaign.client_name}</a>` : ''}
          <h1 style="font-size:20px;font-weight:700;">${campaign.name}</h1>
          <span class="status-chip ${chipClass}">${statusLabel}</span>
          <div style="flex:1;"></div>
          <button class="btn btn-ghost" style="font-size:12px;" onclick="openEditDrawer()">Edit</button>
        </div>
        ${scopeBar}
        <div id="stages-list">${sectionsHtml}</div>
      `;
    }

    function toggleSection(i) {
      document.getElementById(`stage-section-${i}`).classList.toggle('open');
    }

    function showAddForm(i) {
      document.getElementById(`add-trigger-${i}`).style.display = 'none';
      document.getElementById(`add-form-${i}`).classList.add('open');
      document.getElementById(`add-title-${i}`).focus();
    }
    function hideAddForm(i) {
      document.getElementById(`add-form-${i}`).classList.remove('open');
      const t = document.getElementById(`add-trigger-${i}`);
      if (t) t.style.display = '';
    }
    async function submitTask(i) {
      const title = document.getElementById(`add-title-${i}`).value.trim();
      if (!title) return;
      const assignee = document.getElementById(`add-assignee-${i}`).value.trim();
      const due_date = document.getElementById(`add-due-${i}`).value;
      hideAddForm(i);
      await fetch(`/api/campaigns/${campaignId}/tasks`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stage_index: i, title, assignee: assignee || null, due_date: due_date || null }),
      });
      load();
    }

    async function toggleDone(taskId, done) {
      await fetch(`/api/campaigns/${campaignId}/tasks/${taskId}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done }),
      });
      const task = allTasks.find(t => t.id === taskId);
      if (task) task.done = done ? 1 : 0;
    }

    async function deleteTask(taskId) {
      await fetch(`/api/campaigns/${campaignId}/tasks/${taskId}`, { method: 'DELETE' });
      load();
    }

    function avatarColor(name) {
      const p = ['#5b5fcf','#2e7d32','#8e3a7a','#d4870a','#0277bd','#6a4f00','#00695c','#b71c1c'];
      let h = 0;
      for (let i = 0; i < (name||'').length; i++) h = (name.charCodeAt(i) + ((h << 5) - h)) | 0;
      return p[Math.abs(h) % p.length];
    }
    function avatarHtml(name, size=20) {
      if (!name) return '';
      const ini = name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
      return `<span class="av" style="width:${size}px;height:${size}px;background:${avatarColor(name)};font-size:${Math.round(size*.42)}px">${ini}</span>`;
    }
    function assigneeDisplay(name) {
      return name ? `${avatarHtml(name)} ${name}` : '<span style="color:var(--text-dim)">—</span>';
    }
    function progressClass(p) {
      return {'Not Assigned':'pc-not-assigned','Planned':'pc-planned','In Progress':'pc-in-progress','In Review':'pc-in-review','Complete':'pc-complete'}[p]||'pc-not-assigned';
    }

    function openAssigneeSelector(event, taskId) {
      event.stopPropagation();
      const drop = document.getElementById(`av-drop-${taskId}`);
      const isOpen = drop.classList.contains('open');
      document.querySelectorAll('.av-dropdown.open').forEach(d => d.classList.remove('open'));
      if (!isOpen) drop.classList.add('open');
    }
    async function selectAssignee(taskId, name) {
      document.querySelectorAll('.av-dropdown.open').forEach(d => d.classList.remove('open'));
      await saveField(taskId, 'assignee', name || '');
    }
    document.addEventListener('click', () => {
      document.querySelectorAll('.av-dropdown.open').forEach(d => d.classList.remove('open'));
    });

    function editCell(cell, taskId, field) {
      cell.classList.add('editing');
      const el = cell.querySelector('input, select');
      if (!el) return;
      el.focus();
      if (el.type === 'text') el.select();
    }
    function cancelCell(cell) { cell.classList.remove('editing'); }

    async function saveField(taskId, field, value) {
      const task = allTasks.find(t => t.id === taskId);
      if (!task) return;
      const sanitized = (value && value.trim) ? value.trim() : value;
      if (field === 'title' && !sanitized) { cancelCell(document.querySelector(`#task-row-${taskId} .task-cell-title`)); return; }
      const row = document.getElementById(`task-row-${taskId}`);
      if (row) {
        row.querySelectorAll('.task-cell').forEach(c => c.classList.remove('editing'));
        const map = { title:'title', assignee:'assignee', due_date:'due', progress:'progress' };
        const span = row.querySelector(`.task-cell-${map[field]} > span`);
        if (span) {
          if (field === 'progress') {
            const p = sanitized || 'Not Assigned';
            span.innerHTML = `<span class="progress-chip ${progressClass(p)}">${p}</span>`;
          } else if (field === 'assignee') {
            span.innerHTML = assigneeDisplay(sanitized);
          } else {
            span.innerHTML = sanitized || '<span style=color:var(--text-dim)>—</span>';
          }
        }
      }
      task[field] = sanitized || null;
      await fetch(`/api/campaigns/${campaignId}/tasks/${taskId}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [field]: sanitized || null }),
      });
    }

    function openEditDrawer() {
      document.getElementById('f-name').value = campaign.name || '';
      document.getElementById('f-status').value = campaign.status || 'active';
      document.getElementById('f-notes').value = campaign.notes || '';
      document.getElementById('edit-drawer').classList.add('open');
      document.getElementById('edit-overlay').classList.add('open');
    }
    function closeEditDrawer() {
      document.getElementById('edit-drawer').classList.remove('open');
      document.getElementById('edit-overlay').classList.remove('open');
    }
    document.getElementById('edit-overlay').addEventListener('click', closeEditDrawer);
    document.getElementById('edit-save').addEventListener('click', async () => {
      await fetch(`/api/campaigns/${campaignId}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('f-name').value.trim(),
          status: document.getElementById('f-status').value,
          notes: document.getElementById('f-notes').value.trim() || null,
        }),
      });
      closeEditDrawer();
      load();
    });
    async function deleteCampaign() {
      if (!confirm('Delete this social campaign? This cannot be undone.')) return;
      await fetch(`/api/campaigns/${campaignId}`, { method: 'DELETE' });
      window.location.href = '/social';
    }

    load();
  </script>
</body>
</html>
