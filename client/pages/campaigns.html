<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaigns — Greenpoint</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
    }
    .drawer-overlay.open { display: block; }
    .drawer {
      position: fixed;
      top: 0; right: -440px;
      width: 440px;
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 201;
      display: flex;
      flex-direction: column;
      transition: right 0.25s ease;
    }
    .drawer.open { right: 0; }
    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .drawer-header h2 { font-size: 15px; font-weight: 600; }
    .drawer-close {
      background: none; border: none;
      color: var(--text-muted); cursor: pointer;
      font-size: 20px; line-height: 1;
    }
    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .drawer-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      align-items: center;
    }
    .filter-btn {
      padding: 5px 14px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: none;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      padding: 2px 9px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
    }
    .chip-active     { background: #0d3323; color: var(--success); }
    .chip-draft      { background: var(--surface-2); color: var(--text-muted); }
    .chip-paused     { background: #3d2a00; color: var(--warning); }
    .chip-completed  { background: #1a1a2e; color: #8888cc; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content" id="page-content">

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
          <div class="filter-bar" style="margin-bottom:0;">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="draft">Draft</button>
            <button class="filter-btn" data-filter="paused">Paused</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
          </div>
          <button class="btn btn-primary" id="btn-new">+ New Campaign</button>
        </div>

        <div class="card">
          <table id="campaigns-table">
            <thead>
              <tr>
                <th>Campaign</th>
                <th>Client</th>
                <th>Type</th>
                <th>Status</th>
                <th>Start</th>
                <th>End</th>
              </tr>
            </thead>
            <tbody id="campaigns-body">
              <tr><td colspan="6" style="color:var(--text-muted);text-align:center;padding:32px;">Loading…</td></tr>
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <!-- Drawer -->
  <div class="drawer-overlay" id="overlay"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <h2 id="drawer-title">New Campaign</h2>
      <button class="drawer-close" id="drawer-close">×</button>
    </div>
    <div class="drawer-body">
      <div class="form-group">
        <label>Client</label>
        <select id="f-client">
          <option value="">Select client</option>
        </select>
      </div>
      <div class="form-group">
        <label>Type</label>
        <select id="f-type">
          <option value="">Select type</option>
          <option value="PR">PR</option>
          <option value="PR Light">PR Light</option>
          <option value="Social Media">Social Media</option>
          <option value="Content">Content</option>
          <option value="Events & Partnerships">Events & Partnerships</option>
          <option value="Awards">Awards</option>
          <option value="Paid Media">Paid Media</option>
          <option value="Design">Design</option>
        </select>
      </div>
      <div class="form-group">
        <label>Campaign Name</label>
        <input type="text" id="f-name" placeholder="e.g. Summer Launch PR">
      </div>
    </div>
    <div class="drawer-footer">
      <button class="btn btn-primary" id="drawer-save">Save Campaign</button>
      <button class="btn btn-ghost" id="drawer-cancel">Cancel</button>
      <button class="btn btn-danger" id="drawer-delete" style="margin-left:auto;display:none;">Delete</button>
    </div>
  </div>

  <script src="/components/shell.js"></script>
  <script>
    renderShell({ pageId: 'campaigns', title: 'Campaigns' });

    let allCampaigns = [];
    let allClients = [];
    let editingId = null;
    let activeFilter = 'all';

    const overlay  = document.getElementById('overlay');
    const drawer   = document.getElementById('drawer');

    async function loadClients() {
      const res = await fetch('/api/clients');
      allClients = await res.json();
      const sel = document.getElementById('f-client');
      sel.innerHTML = '<option value="">Select client</option>' +
        allClients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    async function loadCampaigns() {
      const res = await fetch('/api/campaigns');
      allCampaigns = await res.json();
      renderTable();
    }

    function renderTable() {
      const filtered = activeFilter === 'all'
        ? allCampaigns
        : allCampaigns.filter(c => c.status === activeFilter);

      const tbody = document.getElementById('campaigns-body');
      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="color:var(--text-muted);text-align:center;padding:32px;">No campaigns${activeFilter !== 'all' ? ' with status "' + activeFilter + '"' : ''}</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(c => {
        const chip = statusChip(c.status);
        return `
          <tr style="cursor:pointer;" onclick="window.location.href='/campaigns/${c.id}'">
            <td style="font-weight:500;">${c.name}</td>
            <td style="color:var(--text-muted);">${c.client_name || '—'}</td>
            <td style="color:var(--text-muted);">${c.type || '—'}</td>
            <td>${chip}</td>
            <td style="color:var(--text-muted);">${c.start_date || '—'}</td>
            <td style="color:var(--text-muted);">${c.end_date || '—'}</td>
          </tr>`;
      }).join('');
    }

    function statusChip(status) {
      const map = {
        active: 'chip-active',
        draft: 'chip-draft',
        paused: 'chip-paused',
        completed: 'chip-completed',
      };
      const label = status.charAt(0).toUpperCase() + status.slice(1);
      return `<span class="status-chip ${map[status] || 'chip-draft'}">${label}</span>`;
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        renderTable();
      });
    });

    function openDrawer(title) {
      document.getElementById('drawer-title').textContent = title;
      drawer.classList.add('open');
      overlay.classList.add('open');
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      overlay.classList.remove('open');
      clearForm();
      editingId = null;
    }

    function clearForm() {
      document.getElementById('f-name').value = '';
      document.getElementById('f-client').value = '';
      document.getElementById('f-type').value = '';
      document.getElementById('drawer-delete').style.display = 'none';
    }

    document.getElementById('btn-new').addEventListener('click', () => {
      editingId = null;
      clearForm();
      openDrawer('New Campaign');
    });

    async function openEdit(id) {
      const res = await fetch(`/api/campaigns/${id}`);
      if (!res.ok) return;
      const c = await res.json();
      editingId = id;
      document.getElementById('f-name').value = c.name || '';
      document.getElementById('f-client').value = c.client_id || '';
      document.getElementById('f-type').value = c.type || '';
      document.getElementById('drawer-delete').style.display = 'inline-flex';
      openDrawer('Edit Campaign');
    }

    document.getElementById('drawer-save').addEventListener('click', async () => {
      const name = document.getElementById('f-name').value.trim();
      if (!name) { alert('Campaign name is required'); return; }

      const btn = document.getElementById('drawer-save');
      btn.disabled = true;
      btn.textContent = 'Saving…';

      const body = {
        name,
        client_id: document.getElementById('f-client').value || null,
        type: document.getElementById('f-type').value || null,
        status: 'draft',
      };

      const url    = editingId ? `/api/campaigns/${editingId}` : '/api/campaigns';
      const method = editingId ? 'PUT' : 'POST';
      const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

      if (!editingId) {
        const { id } = await res.json();
        window.location.href = `/campaigns/${id}`;
        return;
      }

      btn.disabled = false;
      btn.textContent = 'Save Campaign';
      closeDrawer();
      loadCampaigns();
    });

    document.getElementById('drawer-delete').addEventListener('click', async () => {
      if (!editingId) return;
      if (!confirm('Delete this campaign?')) return;
      await fetch(`/api/campaigns/${editingId}`, { method: 'DELETE' });
      closeDrawer();
      loadCampaigns();
    });

    document.getElementById('drawer-cancel').addEventListener('click', closeDrawer);
    document.getElementById('drawer-close').addEventListener('click', closeDrawer);
    overlay.addEventListener('click', closeDrawer);

    loadClients();
    loadCampaigns();
  </script>
</body>
</html>
