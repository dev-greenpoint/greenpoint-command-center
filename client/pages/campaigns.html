<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PR Campaigns — Greenpoint</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/main.css">
  <script src="/components/theme.js"></script>
  <style>
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .page-title { font-size: 20px; font-weight: 700; }

    /* ── Filter tabs ── */
    .filter-bar {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .filter-btn {
      padding: 8px 18px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      cursor: pointer;
      transition: color 0.15s;
      white-space: nowrap;
    }
    .filter-btn:hover { color: var(--text); }
    .filter-btn.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
    .filter-count {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--surface-2); border-radius: 100px;
      font-size: 10px; font-weight: 700;
      padding: 1px 6px; margin-left: 5px;
      color: var(--text-muted);
    }
    .filter-btn.active .filter-count { background: var(--accent); color: #000; }

    /* ── Campaign cards grid ── */
    .camp-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .camp-card {
      display: flex;
      flex-direction: column;
      padding: 18px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, background 0.15s;
      min-width: 0;
    }
    .camp-card:hover { border-color: var(--accent); background: var(--surface-2); }

    .camp-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .camp-client {
      font-size: 10px; color: var(--text-dim); font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em;
      display: flex; align-items: center; gap: 5px;
    }
    .camp-client-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
    }
    .camp-title {
      font-size: 15px; font-weight: 700; line-height: 1.35;
      margin-bottom: 6px;
    }
    .camp-type {
      font-size: 11px; color: var(--text-dim);
    }
    .camp-card-footer {
      margin-top: auto;
      padding-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
    }
    .camp-dates { font-size: 11px; color: var(--text-dim); }
    .camp-open {
      font-size: 11px; color: var(--text-muted);
      display: flex; align-items: center; gap: 3px;
    }
    .camp-open::after { content: '→'; }

    /* ── Status pills ── */
    .status-pill {
      display: inline-flex; align-items: center;
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .05em; padding: 2px 8px; border-radius: 100px;
      white-space: nowrap;
    }
    .sp-draft     { background: var(--surface-2); color: var(--text-muted); }
    .sp-active    { background: #0d3323; color: var(--success); }
    .sp-paused    { background: #3d2a00; color: var(--warning); }
    .sp-completed { background: #1a1a2e; color: #8888cc; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 60px 24px;
      color: var(--text-dim); font-size: 13px;
    }
    .empty-icon { font-size: 32px; margin-bottom: 12px; }
    .empty-title { font-size: 15px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      z-index: 200; display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: calc(var(--radius) * 1.5); padding: 28px;
      width: 440px; max-width: 96vw;
    }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
    .form-row { margin-bottom: 16px; }
    .form-label { font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .05em; color: var(--text-muted); margin-bottom: 6px; display: block; }
    .form-input, .form-select {
      width: 100%; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 13px;
      padding: 9px 12px; font-family: var(--font); box-sizing: border-box;
      transition: border-color 0.15s;
    }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--accent); }
    .form-select option { background: var(--surface); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="header" id="header"></header>
      <main class="page-content" id="page-content">
        <p style="color:var(--text-muted);">Loading…</p>
      </main>
    </div>
  </div>

  <!-- New Campaign Modal -->
  <div class="modal-overlay" id="new-camp-overlay">
    <div class="modal">
      <div class="modal-title">New PR Campaign</div>
      <div class="form-row">
        <label class="form-label">Client</label>
        <select class="form-select" id="nc-client"></select>
      </div>
      <div class="form-row">
        <label class="form-label">Campaign Name</label>
        <input class="form-input" id="nc-name" type="text" placeholder="e.g. Q3 2026 Launch">
      </div>
      <div class="form-row">
        <label class="form-label">Type</label>
        <select class="form-select" id="nc-type">
          <option value="PR">PR</option>
          <option value="PR Light">PR Light</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="nc-create-btn" onclick="createCampaign()">Create & Open</button>
      </div>
    </div>
  </div>

  <script src="/components/shell.js"></script>
  <script>
    const STAGES = [
      { id: 'all',       label: 'All' },
      { id: 'strategy',  label: 'Strategy' },
      { id: 'research',  label: 'Research' },
      { id: 'drafting',  label: 'Drafting' },
      { id: 'review',    label: 'Review' },
      { id: 'pitching',  label: 'Pitching' },
      { id: 'monitoring',label: 'Monitoring' },
      { id: 'reporting', label: 'Reporting' },
    ];

    let allCampaigns = [];
    let activeFilter = 'all';

    async function load() {
      renderShell({ pageId: 'campaigns', title: 'PR Campaigns' });

      const res = await fetch('/api/campaigns');
      const data = res.ok ? await res.json() : [];
      allCampaigns = data.filter(c => c.type === 'PR' || c.type === 'PR Light');

      renderPage();
    }

    function renderPage() {
      const el = document.getElementById('page-content');

      const filtered = activeFilter === 'all'
        ? allCampaigns
        : allCampaigns.filter(c => c.current_stage === activeFilter);

      el.innerHTML = `
        <div class="page-header">
          <div class="page-title">PR Campaigns</div>
          <button class="btn btn-primary" onclick="openModal()">+ New Campaign</button>
        </div>

        <div class="filter-bar">
          ${STAGES.map(s => {
            const count = s.id === 'all' ? allCampaigns.length : allCampaigns.filter(c => c.current_stage === s.id).length;
            return filterBtn(s.id, s.label, count);
          }).join('')}
        </div>

        <div class="camp-list" id="camp-list">
          ${filtered.length ? filtered.map(campCardHtml).join('') : emptyState()}
        </div>
      `;
    }

    function filterBtn(id, label, count) {
      return `<button class="filter-btn ${activeFilter === id ? 'active' : ''}"
        onclick="setFilter('${id}')">
        ${escHtml(label)}<span class="filter-count">${count}</span>
      </button>`;
    }

    function campCardHtml(c) {
      const stageLabel = STAGES.find(s => s.id === c.current_stage)?.label || 'Strategy';
      const stageCls   = c.current_stage === 'reporting' ? 'sp-approved'
                       : c.current_stage ? 'sp-pending' : 'sp-draft';

      const statusMap = { active: 'Active', draft: 'Draft', paused: 'Paused', completed: 'Completed' };
      const statusLabel = statusMap[c.status] || 'Draft';

      const fmt = d => d ? new Date(d).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : null;
      const start = fmt(c.start_date);
      const end   = fmt(c.end_date);
      const dates = start && end ? `${start} – ${end}` : start || end || '—';

      return `
        <a class="camp-card" href="/campaigns/${c.id}">
          <div class="camp-card-top">
            <div class="camp-client">
              <span class="camp-client-dot"></span>
              ${escHtml(c.client_name || 'Unknown Client')}
            </div>
            <span class="status-pill ${stageCls}">${stageLabel}</span>
          </div>
          <div class="camp-title">${escHtml(c.name)}</div>
          <div class="camp-type">${escHtml(c.type || 'PR')} · ${statusLabel}</div>
          <div class="camp-card-footer">
            <span class="camp-dates">${dates}</span>
            <span class="camp-open">Open</span>
          </div>
        </a>`;
    }

    function emptyState() {
      if (activeFilter === 'all') {
        return `<div class="empty-state" style="grid-column:1/-1;">
          <div class="empty-icon">◆</div>
          <div class="empty-title">No PR campaigns yet</div>
          <div>Create your first campaign to get started.</div>
        </div>`;
      }
      const stage = STAGES.find(s => s.id === activeFilter);
      return `<div class="empty-state" style="grid-column:1/-1;">
        <div class="empty-icon">○</div>
        <div class="empty-title">No campaigns in ${stage?.label || activeFilter}</div>
        <div>Campaigns at this stage will appear here.</div>
      </div>`;
    }

    function setFilter(f) {
      activeFilter = f;
      renderPage();
    }

    // ── Modal ──────────────────────────────────────────────────────────────────

    async function openModal() {
      const res = await fetch('/api/clients');
      const clients = res.ok ? await res.json() : [];
      const sel = document.getElementById('nc-client');
      sel.innerHTML = clients.length
        ? clients.map(c => `<option value="${c.id}">${escHtml(c.name)}</option>`).join('')
        : '<option value="">No clients yet</option>';
      document.getElementById('nc-name').value = '';
      document.getElementById('nc-type').value = 'PR';
      document.getElementById('new-camp-overlay').classList.add('open');
      document.getElementById('nc-name').focus();
    }

    function closeModal() {
      document.getElementById('new-camp-overlay').classList.remove('open');
    }

    async function createCampaign() {
      const clientId = document.getElementById('nc-client').value;
      const name     = document.getElementById('nc-name').value.trim();
      const type     = document.getElementById('nc-type').value;
      if (!clientId || !name) return;

      const btn = document.getElementById('nc-create-btn');
      btn.disabled = true;
      btn.textContent = 'Creating…';

      const res = await fetch('/api/campaigns', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ client_id: clientId, name, type, status: 'draft' }),
      });
      if (!res.ok) {
        btn.disabled = false;
        btn.textContent = 'Create & Open';
        alert('Failed to create campaign');
        return;
      }
      const data = await res.json();
      window.location = `/campaigns/${data.id}`;
    }

    document.getElementById('new-camp-overlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });

    // ── Utils ──────────────────────────────────────────────────────────────────

    function escHtml(str) {
      return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function escAttr(str) {
      return (str || '').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    load();
  </script>
</body>
</html>
